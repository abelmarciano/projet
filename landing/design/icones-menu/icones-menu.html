<title>Icônes du menu Growthity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&display=swap">
<style>
/* Mise en page : en-tête court, quatre menus côte à côte (actuel + 3 propositions), puis un tableau de comparaison icône par icône. */
:root{
  --bg:#F4F4F8; --surface:#FFFFFF; --fg:#14151C; --muted:#5D6070; --dim:#8A8D9C; --line:#E4E4EC; --accent:#5B3FF0; --accent-soft:#EEEBFF; --ok:#0F7A49;
  --sb-bg:#FFFFFF; --sb-fg:#1A1B22; --sb-muted:#4A4D5A; --sb-dim:#8A8D9C; --sb-line:#E6E6EE; --sb-sel:#ECECF2; --sb-acc:#5B3FF0; --sb-acc-soft:#EFEBFF; --sb-card:#F7F7FA; --sb-red:#D0334A;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F14; --surface:#16171F; --fg:#ECEDF3; --muted:#A3A6B5; --dim:#757888; --line:#262835; --accent:#8B76FF; --accent-soft:#231E45; --ok:#1F9A64; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F14; --surface:#16171F; --fg:#ECEDF3; --muted:#A3A6B5; --dim:#757888; --line:#262835; --accent:#8B76FF; --accent-soft:#231E45; --ok:#1F9A64; color-scheme:dark}
/* Le menu factice a son propre thème, réglé par le bouton Clair / Sombre */
.mocks[data-mode="dark"]{--sb-bg:#13141B; --sb-fg:#ECEDF3; --sb-muted:#B4B7C6; --sb-dim:#7B7E8E; --sb-line:#272935; --sb-sel:#22232D; --sb-acc:#9583FF; --sb-acc-soft:#262049; --sb-card:#1A1B24; --sb-red:#E04A5C}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:32px 56px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:24px}
h1{font:700 30px/1.15 var(--display);margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;max-width:62ch;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg button{font:500 13px var(--ui);color:var(--muted);background:none;border:0;padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:focus-visible,.it:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.colh{display:flex;align-items:center;gap:8px;min-height:26px}
.colh b{font:600 15px var(--ui)}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.rec{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.verdict{margin:0;color:var(--muted);font-size:13px}
.verdict code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg)}
/* Menu factice, aux mesures du menu réel */
.sb{display:flex;flex-direction:column;gap:2px;padding:14px 12px;border:1px solid var(--sb-line);border-radius:16px;background:var(--sb-bg);color:var(--sb-fg);min-width:0}
.sb-logo{display:flex;align-items:center;gap:6px;font:700 19px var(--display);padding:0 4px 10px;letter-spacing:-.01em}
.sb-logo span{color:var(--sb-acc)}
.sb-logo svg{width:20px;height:20px;color:var(--sb-acc)}
.ws{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--sb-line);border-radius:12px;background:var(--sb-card);margin-bottom:10px}
.ws i{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,#F4A04A,#D9472F);flex:none}
.ws b{display:block;font-size:13px}
.ws small{display:block;font-size:11.5px;color:var(--sb-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws div{min-width:0}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sb-dim);padding:14px 10px 4px}
.it{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:none;color:var(--sb-muted);font:500 13.5px var(--ui);text-align:left;cursor:pointer}
.it:hover{background:var(--sb-sel);color:var(--sb-fg)}
.ic{width:19px;height:19px;flex:none;display:grid;place-items:center;color:var(--sb-muted)}
.ic svg{width:19px;height:19px;display:block}
.it.on{color:var(--sb-fg);font-weight:600}
.it.on .ic{color:var(--sb-acc)}
.s-lucide .it.on{background:var(--sb-sel);box-shadow:inset 0 0 0 1.5px var(--sb-acc)}
.s-ph .it.on,.s-solar .it.on,.s-huge .it.on{background:var(--sb-acc-soft)}
.sp{flex:1;min-height:24px}
.cr{border:1px solid var(--sb-line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--sb-card)}
.cr div{display:flex;justify-content:space-between;font-size:12.5px}
.cr b{font-variant-numeric:tabular-nums}
.cr em{display:block;height:6px;border-radius:3px;background:var(--sb-red);margin:8px 0 6px}
.cr small{font-size:11.5px;color:var(--sb-muted)}
/* Comparaison icône par icône */
h2{font:700 20px var(--display);margin:40px 0 4px}
.sub{margin:0 0 14px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
td:first-child{color:var(--muted);font-size:13px;white-space:nowrap}
.cell{display:flex;align-items:center;gap:14px;color:var(--fg)}
.cell svg{width:26px;height:26px}
.cell .a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.it{transition:background .12s,color .12s}}
@media (max-width:560px){h1{font-size:25px}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Icônes du menu</h1>
      <p class="lead">Ton menu actuel et trois bibliothèques d'icônes, avec les mêmes pages. Clique sur une page dans n'importe quel menu : elle devient active dans les quatre, pour comparer l'état sélectionné.</p>
    </div>
    <div class="seg" role="group" aria-label="Thème des menus">
      <button type="button" id="m-light" aria-pressed="true">Clair</button>
      <button type="button" id="m-dark" aria-pressed="false">Sombre</button>
    </div>
  </header>

  <div class="mocks" id="mocks" data-mode="light"></div>

  <h2>Icône par icône</h2>
  <p class="sub">À gauche l'icône au repos, à droite la même quand la page est ouverte.</p>
  <div class="tw"><table id="cmp"></table></div>
</div>

  {k:'huge', cls:'s-huge', name:'Hugeicons', tag:'Proposition', verdict:'Très moderne, trait fin. La version gratuite n\'a que le trait : la page ouverte ne change que de couleur. Les styles plein et deux tons sont payants.'},
];
const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>';
const GROUPS = [[0,3,null],[3,7,'Créer'],[7,12,'Mes pubs']];
let active = 1;

function item(set, i){
  const r = ICONS[set.k][i], on = i === active;
  return `<button type="button" class="it${on?' on':''}" data-i="${i}" aria-current="${on?'page':'false'}"><span class="ic">${on ? r.a : r.i}</span>${r.l}</button>`;
}
function render(){
  document.getElementById('mocks').innerHTML = SETS.map(s => {
    let nav = '';
    for (const [a,b,label] of GROUPS){ if (label) nav += `<div class="sec">${label}</div>`; for (let i=a;i<b;i++) nav += item(s,i); }
    return `<section class="col" aria-label="${s.name}">
      <div class="colh"><b>${s.name}</b><span class="tag${s.rec?' rec':''}">${s.tag}</span></div>
      <nav class="sb ${s.cls}">
        <div class="sb-logo">${LOGO}growthity<span>.ai</span></div>
        <div class="ws"><i></i><div><b>ABEL</b><small>Marque active : Leadeurs</small></div></div>
        ${nav}
        <div class="sp"></div>
        <div class="cr"><div><span>Crédits restants</span><b>727</b></div><em></em><small>Presque épuisés · recharger</small></div>
        ${item(s,12)}${item(s,13)}
      </nav>
      <p class="verdict">${s.verdict}</p>
    </section>`;
  }).join('');
  const head = '<tr><th>Page</th>' + SETS.map(s => `<th>${s.name}</th>`).join('') + '</tr>';
  const rows = ICONS.lucide.map((r,i) => `<tr><td>${r.l}</td>` + SETS.map(s => `<td><div class="cell">${ICONS[s.k][i].i}<span class="a">${ICONS[s.k][i].a}</span></div></td>`).join('') + '</tr>').join('');
  document.getElementById('cmp').innerHTML = head + rows;
}
document.getElementById('mocks').addEventListener('click', e => {
  const b = e.target.closest('.it'); if (!b) return;
  active = +b.dataset.i; render();
});
function setMode(m){
  document.getElementById('mocks').dataset.mode = m;
  document.getElementById('m-light').setAttribute('aria-pressed', m==='light');
  document.getElementById('m-dark').setAttribute('aria-pressed', m==='dark');
}
document.getElementById('m-light').onclick = () => setMode('light');
document.getElementById('m-dark').onclick = () => setMode('dark');
try { if (matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light') setMode('dark'); } catch(e){}
render();
</script>
