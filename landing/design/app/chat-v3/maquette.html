<title>Chat Growthity v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : barre d'outils de la maquette en haut, puis la fenêtre du Chat (colonne de lecture 720 px, barre de saisie en bas). */
:root{
  --app:#F4F4F7; --bg:#FFFFFF; --surface:#FFFFFF; --raised:#F7F7FA; --sunk:#F1F1F5;
  --line:#E7E7EE; --line2:#D7D7E1; --fg:#141418; --muted:#44444F; --dim:#737381; --faint:#A2A2AF;
  --accent:#5B3FE4; --accent-2:#4C31D3; --accent-soft:#F0ECFF; --accent-ink:#4A2FCF; --on-accent:#FFFFFF;
  --ok:#137A45; --ok-soft:#E6F5EC; --warn:#9A5205; --warn-soft:#FFF4E2; --err:#C02B2B; --err-soft:#FDECEC;
  --meta:#0866FF; --ub:#17171C; --ub-fg:#FFFFFF;
  --sh-sm:0 1px 2px rgba(20,20,40,.05);
  --sh:0 1px 2px rgba(20,20,40,.04),0 6px 20px rgba(20,20,40,.06);
  --sh-lg:0 20px 60px rgba(10,10,30,.22);
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --app:#09090C; --bg:#0F0F13; --surface:#16161C; --raised:#1C1C23; --sunk:#121217;
  --line:#272730; --line2:#363641; --fg:#F2F2F6; --muted:#C6C6D0; --dim:#8F8F9D; --faint:#5F5F6C;
  --accent:#8E79FF; --accent-2:#9D8BFF; --accent-soft:#231D42; --accent-ink:#C0B3FF; --on-accent:#FFFFFF;
  --ok:#4ADE80; --ok-soft:#0F2E1C; --warn:#F5B454; --warn-soft:#30220C; --err:#F87171; --err-soft:#371616;
  --meta:#4C8DFF; --ub:#272731; --ub-fg:#F2F2F6;
  --sh-sm:0 1px 2px rgba(0,0,0,.4); --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --sh-lg:0 20px 60px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --app:#09090C; --bg:#0F0F13; --surface:#16161C; --raised:#1C1C23; --sunk:#121217;
  --line:#272730; --line2:#363641; --fg:#F2F2F6; --muted:#C6C6D0; --dim:#8F8F9D; --faint:#5F5F6C;
  --accent:#8E79FF; --accent-2:#9D8BFF; --accent-soft:#231D42; --accent-ink:#C0B3FF; --on-accent:#FFFFFF;
  --ok:#4ADE80; --ok-soft:#0F2E1C; --warn:#F5B454; --warn-soft:#30220C; --err:#F87171; --err-soft:#371616;
  --meta:#4C8DFF; --ub:#272731; --ub-fg:#F2F2F6;
  --sh-sm:0 1px 2px rgba(0,0,0,.4); --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --sh-lg:0 20px 60px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--app);color:var(--fg);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:16px;height:16px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- Barre de la maquette ---------- */
.page{height:100%;display:flex;flex-direction:column;padding-block:14px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;max-width:1120px;width:100%;margin:0 auto}
.bar h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.bar .sp{flex:1}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ghost{height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:13px;font-weight:500;cursor:pointer}
.ghost:hover{background:var(--raised)}

/* ---------- Fenêtre ---------- */
.win{flex:1;min-height:0;max-width:1120px;width:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.win-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:52px}
.win-h b{font-weight:600;font-size:14px}
.win-h small{color:var(--dim);font-size:12.5px}
.win-h .sp{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:28px 24px 24px;display:flex;flex-direction:column;gap:22px}
@media (max-width:600px){.col{padding:18px 14px 18px;gap:18px}}

/* ---------- Messages ---------- */
.m{display:flex;gap:12px;align-items:flex-start;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.av svg{width:16px;height:16px}
.mb{min-width:0;flex:1;display:flex;flex-direction:column;gap:12px}
.txt p{margin:0 0 8px}.txt p:last-child{margin:0}
.txt b{font-weight:600}
.txt ul{margin:4px 0 8px;padding-left:20px}
.txt li{margin:2px 0}
.m.u{justify-content:flex-end}
.m.u .mb{flex:none;align-items:flex-end;max-width:min(520px,86%)}
.ub{padding:10px 14px;border-radius:18px 18px 6px 18px;background:var(--ub);color:var(--ub-fg);font-size:14.5px;line-height:1.5}
.acts{display:flex;gap:2px;margin-top:-4px;opacity:0;transition:opacity .15s}
.m:hover .acts,.acts:focus-within{opacity:1}
@media (hover:none){.acts{opacity:.8}}
.ia{width:30px;height:30px;border:0;border-radius:8px;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer}
.ia:hover{background:var(--sunk);color:var(--fg)}
.ia[aria-pressed="true"]{color:var(--accent)}
.ia .i{width:15px;height:15px}

/* Note système */
.note{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--sunk);color:var(--dim);font-size:12.5px}
.note .i{width:13px;height:13px}
.note b{color:var(--muted);font-weight:600}

/* Étapes des outils */
.steps{font-size:13.5px;color:var(--dim)}
.steps summary{list-style:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:3px 0;border-radius:6px}
.steps summary::-webkit-details-marker{display:none}
.steps summary:hover{color:var(--muted)}
.steps summary .chev{transition:transform .2s;width:13px;height:13px}
.steps[open] summary .chev{transform:rotate(90deg)}
.steps ul{list-style:none;margin:6px 0 0;padding:0 0 0 4px;border-left:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px}
.steps li{display:flex;align-items:center;gap:8px;padding-left:12px}
.ok-ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.ok-ic svg{width:10px;height:10px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* Réflexion */
.think{display:inline-flex;align-items:center;gap:10px;color:var(--dim);font-size:14px;height:30px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.3;animation:dt 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dt{40%{opacity:1;transform:translateY(-2px)}}

/* ---------- Réponses rapides ---------- */
.qr{display:flex;flex-direction:column;gap:8px}
.qr-row{display:flex;flex-wrap:wrap;gap:8px}
.qc{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:7px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:14px;font-weight:500;text-align:left;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.qc:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.qc:active{transform:scale(.98)}
.qc .i{width:15px;height:15px;color:var(--dim)}
.qc:hover .i{color:var(--accent)}
.qw{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;color:var(--dim);font-size:13px;cursor:pointer}
.qw:hover{color:var(--accent-ink)}
.qw .i{width:13px;height:13px}
.qr.gone{animation:out .25s ease forwards}
@keyframes out{to{opacity:0;transform:translateY(-4px);height:0;margin:0}}

/* Petites suggestions « Ou modifier » */
.mods{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mods > span{font-size:12.5px;color:var(--dim);margin-right:2px}
.mc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.mc:hover{border-color:var(--line2);background:var(--raised);color:var(--fg)}
.mc .i{width:14px;height:14px;color:var(--dim)}

/* ---------- Cartes ---------- */
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--sh-sm);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card-h .ti{font-weight:600;font-size:15px}
.card-h .sub{color:var(--dim);font-size:13px}
.card-h .sp{flex:1}
.ic-tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ic-tile .i{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.run{background:var(--accent-soft);color:var(--accent-ink)}
.pill.todo{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.grey{background:var(--sunk);color:var(--dim)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.run .dot{animation:dt 1.1s infinite}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn .i{width:15px;height:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.lg{height:44px;padding:0 18px;font-size:14.5px;border-radius:11px}
.btn.txt{border-color:transparent;background:none;color:var(--dim)}
.btn.txt:hover{color:var(--fg);background:var(--sunk)}
.btn.sq{width:38px;padding:0}
.cr{display:inline-flex;align-items:center;gap:3px;padding-left:8px;margin-left:2px;border-left:1px solid color-mix(in srgb,currentColor 30%,transparent);font-weight:600;font-variant-numeric:tabular-nums}
.cr .i{width:13px;height:13px}
.link{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:500;font-size:13.5px;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* Acteurs */
.pick{padding:16px;display:flex;flex-direction:column;gap:12px}
.pick-h b{display:block;font-weight:600;font-size:15px}
.pick-h small{color:var(--dim);font-size:13px}
.pick-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:600px){.pick-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pk{position:relative;aspect-ratio:3/4;max-width:100%;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--sunk)}
.pk img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block;transition:transform .3s}
.pk:hover img{transform:scale(1.05)}
.pk:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.pk .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;text-align:left;font-size:12.5px;font-weight:600;line-height:1.2}
.pk .cap small{display:block;font-weight:400;opacity:.85;font-size:11px}
.pk.all{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line2);background:var(--raised);color:var(--accent-ink);font-size:12.5px;font-weight:600;padding:8px;text-align:center}
.pk.all:hover{background:var(--accent-soft)}
.pk.all span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft)}
.pick.done{opacity:.5}
.pick.done button{pointer-events:none}
.pk.chosen{box-shadow:inset 0 0 0 3px var(--accent)}

.who{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.who img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 15%;flex:none}
.who .t{min-width:0;flex:1}
.who .t small{display:block;color:var(--dim);font-size:12px;line-height:1.2}
.who .t b{font-weight:600;font-size:14.5px}
.who .t span{color:var(--dim);font-size:13px}

.achip{display:flex;align-items:center;gap:12px;width:300px;max-width:100%;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.achip img{width:46px;height:62px;border-radius:9px;object-fit:cover;object-position:50% 15%;flex:none}
.achip .lb{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.achip b{display:block;font-weight:600}
.achip small{color:var(--dim);font-size:12.5px}
.achip .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.achip .ck svg{width:12px;height:12px}

/* ---------- Brief ---------- */
.brief .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.styles button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.styles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.script{border:1px solid var(--line);border-radius:12px;background:var(--raised);padding:4px 14px}
.script.edit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.sec-h .i{width:14px;height:14px}
.sec-h .sp{flex:1}
.line{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px;padding:2px 0}
.line .tc{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:2px}
.decor{font-size:14px;color:var(--muted)}
.decor.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ost{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:7px;background:var(--fg);color:var(--bg);font-weight:600;font-size:13.5px}
[contenteditable="true"]{outline:none;border-radius:4px}
[contenteditable="true"]:focus{background:var(--accent-soft)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-2px;margin-left:1px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.4s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.slow{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px}

.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.q-opts{grid-template-columns:1fr}}
.qo{display:flex;flex-direction:column;gap:2px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.qo b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.qo small{color:var(--dim);font-size:12.5px}
.qo[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.qo .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center}
.qo[aria-pressed="true"] .rd{border-color:var(--accent)}
.qo[aria-pressed="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.qo .cr2{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--warn);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.qo .cr2 .i{width:12px;height:12px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--raised)}
.foot .hint{font-size:12.5px;color:var(--dim);margin-left:auto}
@media (max-width:560px){.foot .hint{margin-left:0;width:100%}}

/* ---------- Génération / Résultat ---------- */
.res{display:grid;grid-template-columns:168px minmax(0,1fr);gap:16px;padding:14px}
@media (max-width:560px){.res{grid-template-columns:1fr}.res .thumb{max-width:220px}}
.thumb{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:12px;overflow:hidden;background:var(--sunk)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .blur{filter:blur(10px) saturate(.7);transform:scale(1.15);opacity:.55}
.thumb .shim{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:220% 100%;animation:sh 1.6s infinite}
.thumb .ctr{position:absolute;inset:0;display:grid;place-items:center}
.thumb .ctr span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh)}
.thumb .badge{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center}
.thumb .dur{left:auto;right:8px}
.thumb .play{position:absolute;inset:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.thumb .play span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .2s}
.thumb .play:hover span{transform:scale(1.08)}
.thumb .play svg{width:18px;height:18px;margin-left:3px}
.rt{min-width:0;display:flex;flex-direction:column;gap:12px}
.rt-h{display:flex;align-items:flex-start;gap:10px}
.rt-h .ti{font-weight:600;font-size:15px;line-height:1.3}
.rt-h .meta{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--dim);font-size:12.5px}
.rt-h .sp{flex:1}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.prog-top span:last-child{color:var(--dim);font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .6s ease}
.stages{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim);margin:2px 0 0;padding:0;list-style:none}
.stages li{display:flex;align-items:center;gap:8px}
.stages li.on{color:var(--fg);font-weight:500}

const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t;};
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);}
function down(){requestAnimationFrame(()=>{scroll.scrollTop=scroll.scrollHeight;});}
function node(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild;}
function push(html){const el=node(html);col.appendChild(el);down();return el;}

function steps(list,running){
  const head=running
    ? '<span class="spin"></span><span>'+esc(list[list.length-1])+'</span>'
    : '<span class="ok-ic">'+ic("check")+'</span><span>'+list.length+' étapes terminées</span>'+ic("chev","chev");
  const items=list.map((s,i)=>'<li>'+(running&&i===list.length-1?'<span class="spin"></span>':'<span class="ok-ic">'+ic("check")+'</span>')+esc(s)+'</li>').join("");
  return running?'<div class="steps"><span style="display:inline-flex;align-items:center;gap:8px">'+head+'</span></div>'
    :'<details class="steps"><summary>'+head+'</summary><ul>'+items+'</ul></details>';
}

let actor=null, streaming=false;
function composerHTML(big){
  return '<div class="cmp-in"><div class="box"><div class="ctx" id="ctx"></div>'+
    '<form class="crow" id="form"><button type="button" class="ib" data-act="t" data-v="Menu : importer un fichier, mes créations, mes campagnes…" aria-label="Ajouter du contenu">'+ic("plus")+'</button>'+
    '<textarea id="input" rows="'+(big?2:1)+'" aria-label="Message" placeholder="'+(big?"Décris la pub que tu veux créer…":"Écris ta réponse, ou demande une modification…")+'"></textarea>'+

    '<button type="submit" class="ib send" id="sendBtn" aria-label="Envoyer" disabled>'+ic("up")+'</button></form></div>'+
    '<div class="cmp-note">Growthity peut se tromper. Vérifie les prix et les promesses avant de publier.</div></div>';

function renderCtx(pulse){
  const c=$("#ctx"); if(!c) return;
  let h='<button type="button" class="cp" data-act="t" data-v="Choix de la marque">'+ic("eyeoff")+'Marque blanche'+ic("down")+'</button>';
  h+=actor?'<span class="cp" id="aPill" role="button" tabindex="0" data-act="pick"><img src="'+actor.img+'" alt="">'+esc(actor.name)+'<span class="x" role="button" tabindex="0" data-act="clearA" aria-label="Retirer l\'acteur">'+ic("x")+'</span></span>'
    :'<button type="button" class="cp add" id="aPill" data-act="pick"><span class="pl">'+ic("plus")+'</span>Acteur</button>';
  h+='<button type="button" class="cp add" data-act="t" data-v="Maquette : catalogue produits"><span class="pl">'+ic("plus")+'</span>Produits</button>';
  c.innerHTML=h;
  if(pulse){const p=$("#aPill");p.classList.remove("pulse");void p.offsetWidth;p.classList.add("pulse");}
}
function setStreaming(on){
  streaming=on; const b=$("#sendBtn"); if(!b) return;
  if(on){b.className="ib stop";b.innerHTML=ic("stop");b.setAttribute("aria-label","Arrêter");b.type="button";b.disabled=false;b.dataset.act="halt";}
  else{b.className="ib send";b.innerHTML=ic("up");b.setAttribute("aria-label","Envoyer");b.type="submit";delete b.dataset.act;b.disabled=!$("#input").value.trim();}
}
function mountComposer(big,target){
  $("#cmpWrap").hidden=!!target;
  (target||$("#cmpWrap")).innerHTML=composerHTML(big);
  renderCtx(false);
  const inp=$("#input");
  inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";if(!streaming)$("#sendBtn").disabled=!inp.value.trim();});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!streaming&&inp.value.trim())$("#form").requestSubmit();}});
  $("#form").addEventListener("submit",e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;inp.value="";inp.style.height="auto";$("#sendBtn").disabled=true;userSays(v,true);});
}

/* ======================= Scénario ======================= */
let tab="conv", flow=null;
function header(kind){
  const h=$("#winH");
  if(kind==="home"){h.innerHTML='<b>Nouvelle conversation</b><span class="sp"></span><small>Marque blanche</small>';return;}
  if(kind==="all"){h.innerHTML='<b>Tous les éléments du Chat</b><span class="sp"></span><small>Même style partout, clair et sombre</small>';return;}
  h.innerHTML='<div><b>Pâtes fraîches pour restaurants</b><br><small>Marque blanche · vidéo 9:16</small></div><span class="sp"></span><button type="button" class="ib" data-act="t" data-v="Maquette : historique" aria-label="Historique">'+ic("clock")+'</button>';
}

function startConv(){
  clearTimers(); tab="conv"; actor=null; flow={step:1};
  header("conv"); col.innerHTML=""; $("#win").querySelector(".scroll").style.display="";
  mountComposer(false);
  push(U(ub("Je vends des pâtes fraîches en quantité aux pros de la restauration.")));
  push(A(steps(["Lecture de ton message","Pubs de grossistes repérées sur Meta (8)"],false)+
    T('<p>Top, du B2B pour les restaurateurs. Sur Meta, on vise plutôt des <b>demandes de devis</b> que des ventes directes.</p><p><b>Quel est ton argument principal face à leur fournisseur actuel ?</b> C\'est lui qui fera l\'accroche.</p>')+
    qr([{t:"Prix au kilo plus bas",i:"euro"},{t:"Pâtes fraîches artisanales",i:"leaf"},{t:"Livraison rapide et régulière",i:"truck"},{t:"Échantillon gratuit pour tester",i:"gift"}],"arg"),true));
  scroll.scrollTop=0;
}

function removeQR(){col.querySelectorAll(".qr").forEach(q=>{q.classList.add("gone");setTimeout(()=>q.remove(),260);});}
function botTurn(fn,ms,label){
  setStreaming(true);
  const th=push(think(label));
  later(()=>{th.remove();setStreaming(false);fn();},ms||1000);
}
function userSays(text,typed){
  if(tab!=="conv"){setTab("conv",true);}
  removeQR();
  push(U(ub(text)));
  if(flow.step===1){flow.step=2;
    const priceFirst=/prix|kilo/i.test(text);
    botTurn(()=>push(A(T(priceFirst
      ?'<p>Bon choix : pour un restaurateur, le coût matière, c\'est le nerf de la guerre.</p><p><b>Tu as un prix au kilo à afficher ?</b> Sinon je fais une accroche sans chiffre, du genre « Payez vos pâtes moins cher, sans perdre en qualité ».</p>'
      :'<p>Noté, c\'est un vrai argument pour un chef.</p><p><b>Tu as un prix au kilo à afficher en plus ?</b> Un chiffre concret rend l\'accroche bien plus forte.</p>')+
      qr([{t:"10 € HT le kilo",i:"euro"},{t:"Pas de chiffre",i:"x"},{t:"Je donne un autre prix",i:"pen"}],"price"),true)),900);
    return;}
  if(flow.step===2){flow.step=3;
    botTurn(()=>{
      push(A(T('<p>Parfait. Voici ce que je te propose :</p><ul><li><b>Vidéo verticale de 8 s</b>, façon témoignage, dans une cuisine de restaurant pro.</li><li>Ce qui est dit : <i>« Chefs, vous payez encore trop cher vos pâtes fraîches ? Ici, c\'est 10 € HT le kilo. Demandez votre devis. »</i></li><li>Texte à l\'écran : <b>« Pâtes fraîches · 10 € HT le kilo »</b></li></ul>')+picker(false),true));
    },1100);
    return;}
  // Texte libre après le brief
  botTurn(()=>push(A(T('<p>Bien reçu. Dans la vraie app, je mets le brief à jour avec ta demande et je te le remontre avant de dépenser des crédits.</p>'),true)),900);
}

function choose(a,auto){
  closeDlg();
  if(tab!=="conv") return;
  const changed=!actor||actor.id!==a.id;
  actor=a; renderCtx(true);
  if(!changed) return;
  col.querySelectorAll("[data-pick]:not(.done)").forEach(c=>{c.classList.add("done");const t=c.querySelector('.pk[data-id="'+a.id+'"]');if(t)t.classList.add("chosen");});
  col.querySelectorAll('[data-brief="ready"]').forEach(b=>{const p=b.querySelector(".card-h .pill");if(p&&!p.classList.contains("ok")){p.className="pill grey";p.textContent="Remplacé";b.style.opacity=".55";b.querySelectorAll("button").forEach(x=>x.disabled=true);}});
  removeQR();
  if(!auto) push(U(actorChip(a)+ub("Je prends "+a.name+" pour cette vidéo.")));
  botTurn(()=>{
    push(A(T('<p>C\'est noté, <b>'+esc(a.name)+'</b> sera face caméra, en '+pr(a).metier.toLowerCase()+' et en tablier. Je rédige le brief final.</p>'),false));
    const card=push(A(briefStreaming(a)));
    streamBrief(card,a);
  },900);
}

function streamBrief(wrap,a){
  setStreaming(true);
  const card=wrap.querySelector("[data-brief]"), s=script(a);
  const L=card.querySelector('[data-s="lines"]'), D=card.querySelector('[data-s="decor"]'), O=card.querySelector('[data-s="ost"]');
  const queue=[];
  s.lines.forEach(l=>queue.push({el:L,line:l}));
  queue.push({el:D,text:s.decor,clear:true});
  queue.push({el:O,text:s.ost,clear:true,ost:true});
  later(()=>{const w=card.querySelector('[data-s="slow"]');if(w)w.hidden=false;},5200);
  let qi=0;
  function nextItem(){
    if(qi>=queue.length){later(()=>finish(),400);return;}
    const it=queue[qi++]; let target;
    if(it.line){const row=node('<div class="line"><span class="tc">'+it.line[0]+'</span><span></span></div>');it.el.appendChild(row);target=row.lastElementChild;typeInto(target,it.line[1],nextItem);}
    else{if(it.clear)it.el.innerHTML="";target=it.ost?node('<span class="ost"></span>'):it.el;if(it.ost)it.el.appendChild(target);typeInto(target,it.text,nextItem);}
  }
  function typeInto(el,text,done){
    let i=0; const caret=node('<span class="caret"></span>');
    const tick=()=>{i=Math.min(text.length,i+4);el.textContent=text.slice(0,i);el.appendChild(caret);down();if(i<text.length)later(tick,16);else{caret.remove();done();}};
    tick();
  }
  function finish(){
    setStreaming(false);
    const fresh=node(briefReady(a));
    card.replaceWith(fresh);
    fresh.insertAdjacentHTML("afterend",mods([{t:"Importer mes photos de pâtes",i:"photo"},{t:"Version image carrée",i:"square"},{t:"Change l'accroche",i:"pen"},{t:"Autre chose",i:"spark",a:"write"}]));
    down();
  }
  nextItem();
}

function launch(btn){
  const card=btn.closest("[data-brief]");
  card.querySelector(".card-h .pill").outerHTML='<span class="pill ok">Lancé</span>';
  card.querySelector(".foot").remove();
  card.querySelectorAll(".bd button").forEach(b=>b.disabled=true);
  const m=card.closest(".mb"); const md=m&&m.querySelector(".mods"); if(md) md.remove();
  const a=actor||byId("alice"); const title="Pâtes fraîches · UGC 8 s";
  const g=push(A(genCard(a,title)));
  runGen(g,a,title);
}
function runGen(wrap,a,title){
  setStreaming(false);
  const bar=wrap.querySelector('[data-g="bar"]'),st=wrap.querySelector('[data-g="stage"]'),eta=wrap.querySelector('[data-g="eta"]'),lis=wrap.querySelectorAll('[data-g="stages"] li');
  const plan=[[18,"Tournage de la vidéo","environ 2 min"],[46,"Tournage de la vidéo","environ 1 min 20"],[72,"Voix et lèvres","environ 40 s"],[90,"Finitions","environ 10 s"],[100,"Finitions","terminé"]];
  const stageIdx={"Tournage de la vidéo":1,"Voix et lèvres":2,"Finitions":3};
  plan.forEach((p,i)=>later(()=>{
    if(!wrap.isConnected||wrap.dataset.stopped) return;
    bar.style.width=p[0]+"%"; st.textContent=p[1]; eta.textContent=p[2];
    const k=stageIdx[p[1]];
    lis.forEach((li,j)=>{li.className=j===k?"on":"";const o=li.firstElementChild;if(j<k)o.outerHTML='<span class="ok-ic">'+ic("check")+'</span>';else if(j===k&&o.className!=="spin")o.outerHTML='<span class="spin"></span>';});
    if(p[0]===100) later(()=>{
      if(wrap.dataset.stopped) return;
      wrap.replaceWith(node(A(readyCard(a,title))));
      push(A(T('<p>Ta vidéo est prête. <b>'+esc(a.name)+'</b> présente tes tagliatelles en 8 s, avec le prix à l\'écran.</p><p>Tu peux la publier directement, ou me demander une variation pour tester deux accroches.</p>'),true));
    },700);
  },1300*(i+1)));
}

/* ======================= Fenêtre acteurs ======================= */
let filter="all";
function openDlg(){
  closeDlg();
  const o=node('<div class="ovl" id="ovl"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="dlg-h"><div><b id="dT">Choisir un acteur</b><small>Il parlera face caméra dans ta vidéo.</small></div><button type="button" class="ib" data-act="closeDlg" aria-label="Fermer">'+ic("x")+'</button></div>'+
    '<div class="filt" role="group" aria-label="Filtrer"><button type="button" data-f="all" aria-pressed="true">Tous</button><button type="button" data-f="f" aria-pressed="false">Femmes</button><button type="button" data-f="h" aria-pressed="false">Hommes</button></div><div class="tiles" id="tiles"></div></div></div>');
  document.body.appendChild(o); filter="all"; renderTiles();
  o.addEventListener("click",e=>{if(e.target===o)closeDlg();const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;o.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x===f)));renderTiles();}});

  const t=$("#tiles"); if(!t) return;

}
function closeDlg(){const o=$("#ovl");if(o)o.remove();}

/* ======================= Clics ======================= */
document.addEventListener("click",e=>{
  if(!e.target.closest(".menu")) document.querySelectorAll(".menu-pop").forEach(m=>{m.previousElementSibling&&m.previousElementSibling.setAttribute("aria-expanded","false");m.remove();});
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, v=b.dataset.v;
  switch(act){
    case "t": toast(v); break;
    case "qr": if(tab==="all"){toast("Dans la conversation, ce clic envoie la réponse");break;} userSays(v); break;
    case "write": { const i=$("#input"); if(i){i.focus();i.placeholder="Écris ta réponse…";} break; }
    case "say": if(tab==="all"){toast("Dans la conversation, ce clic envoie la demande");break;} userSays(v); break;
    case "pick": openDlg(); break;
    case "quick": { const a=byId(b.dataset.id); if(tab==="conv") choose(a); else {closeDlg(); actor=a; renderCtx(true); toast(a.name+" choisi");} break; }
    case "auto": if(tab!=="conv"){toast("L'IA choisit l'acteur le plus crédible");break;}
      col.querySelectorAll("[data-pick]:not(.done)").forEach(c=>c.classList.add("done"));
      push(U(ub("Choisis pour moi.")));
      botTurn(()=>{const a=byId("thomas");push(A(T('<p>Je prends <b>Thomas R.</b> : la quarantaine, crédible en cuisine pro pour parler à d\'autres chefs. Tu peux le changer à tout moment.</p>'),false));actor=null;choose(a,true);},800);
      break;
    case "clearA": e.stopPropagation(); actor=null; renderCtx(false); toast("Acteur retiré"); break;
    case "closeDlg": closeDlg(); break;
    case "style": b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); break;
    case "q": { const card=b.closest("[data-brief]"); card.querySelectorAll(".qo").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); break; }
    case "edit": { const s=b.closest("[data-script]"); const on=!s.classList.contains("edit"); s.classList.toggle("edit",on); s.querySelectorAll("[data-ed]").forEach(x=>x.contentEditable=on?"true":"false"); b.textContent=on?"Terminé":"Modifier"; if(on){const f=s.querySelector("[data-ed]");f.focus();} break; }
    case "more": { const d=b.previousElementSibling; const open=d.classList.toggle("clamp"); b.textContent=open?"Lire tout":"Réduire"; break; }
    case "go": if(tab!=="conv"){toast("Dans la conversation, ce bouton lance la vidéo");break;} launch(b); break;
    case "reform": toast("Maquette : l'IA reformule le script"); break;
    case "stop": { const w=b.closest("[data-gen]"); b.closest(".m").dataset.stopped="1";
      w.querySelector(".rt").innerHTML='<div class="rt-h"><div><div class="ti">Génération arrêtée</div><div class="meta"><span class="pill grey">Arrêtée</span><span>Aucun crédit débité</span></div></div></div><div class="row-btns"><button type="button" class="btn pri" data-act="t" data-v="Maquette : génération relancée">'+ic("redo")+'Relancer</button></div>';
      w.querySelector(".shim")&&w.querySelector(".shim").remove(); w.querySelector(".ctr")&&w.querySelector(".ctr").remove(); break; }
    case "creations": toast("Maquette : ouvre Mes créations"); break;
    case "lightbox": openLB(b.dataset.vid,b.dataset.poster,b.dataset.title); break;
    case "closeLB": closeLB(); break;
    case "meta": closeLB(); if(tab==="conv"){push(A(T('<p>Voici la campagne prête à partir. Vérifie le budget et la zone, puis valide.</p>')+metaCard()));} else toast("Maquette : ouvre la publication Meta"); break;
    case "editor": toast("Maquette : ouvre l'éditeur vidéo"); break;
    case "menu": { e.stopPropagation(); const wrap=b.parentElement; const open=wrap.querySelector(".menu-pop"); document.querySelectorAll(".menu-pop").forEach(m=>m.remove()); if(!open){wrap.insertAdjacentHTML("beforeend",menuPop());b.setAttribute("aria-expanded","true");} break; }
    case "copy": toast("Message copié"); break;
    case "retry": toast("Maquette : nouvelle réponse"); break;
    case "like": case "dislike": { const on=b.getAttribute("aria-pressed")!=="true"; b.parentElement.querySelectorAll('[data-act="like"],[data-act="dislike"]').forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed",String(on)); if(on) toast(act==="like"?"Merci, c'est noté":"Merci, dis-moi ce qui ne va pas"); break; }
    case "halt": clearTimers(); col.querySelectorAll(".think").forEach(t=>t.closest(".m").remove()); setStreaming(false); toast("Réponse arrêtée"); break;
    case "starter": { setTab("conv",false); const i=$("#input"); i.value=v; i.dispatchEvent(new Event("input")); i.focus(); i.setSelectionRange(i.value.length,i.value.length); toast("Complète si tu veux, puis envoie"); break; }
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDlg();closeLB();document.querySelectorAll(".menu-pop").forEach(m=>m.remove());}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('span[role="button"][data-act]')){e.preventDefault();e.target.click();}
});

function setTab(t,keepConv){

    clearTimers(); tab="conv"; actor=null; flow={step:1}; header("conv"); col.innerHTML=""; mountComposer(false);
    push(A(T('<p>Prêt à créer ta pub. <b>Dis-moi ce que tu veux promouvoir</b> : le produit, l\'offre et ta cible.</p>')));
  }
  else startConv();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
$("#replay").addEventListener("click",()=>setTab(tab==="home"?"home":tab==="all"?"all":"conv"));
function setTheme(th){
  document.documentElement.setAttribute("data-theme",th);
  document.querySelectorAll("[data-th]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.th===th)));
  try{localStorage.setItem("gx-theme",th);}catch(_){}
}
document.querySelectorAll("[data-th]").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.th)));
let saved=null; try{saved=localStorage.getItem("gx-theme");}catch(_){}
setTheme(saved||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#brandLogo").innerHTML=LOGO;

startConv();
})();
