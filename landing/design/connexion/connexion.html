<title>Connexion Meta Growthity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout : page Connexion de la console. Une seule carte maîtresse « Meta » : à gauche l'action, à droite ce que Growthity pourra faire ; le guide devient une bande d'aide dans la carte, pas une carte rivale. Thème clair de la console. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --raised:#F9FAFB; --sunk:#ECEEF2; --line:#E3E5EA; --line-2:#D3D6DD;
  --fg:#101217; --muted:#5A606D; --dim:#676D7B;
  --accent:#5B3FE4; --accent-soft:#EDEAFE; --accent-ink:#3F27C2;
  --ok:#14955A; --ok-soft:#E3F5EC; --ok-ink:#0B7A47; --warn:#C27409; --warn-soft:#FCF1DE;
  --fb:#1877F2; --fb-h:#166FE5;
  --shadow:0 1px 2px rgba(16,18,23,.05),0 12px 32px -18px rgba(16,18,23,.22);
  --display:"Bricolage Grotesque","Geist",system-ui,sans-serif;
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--fg);color:#fff;font-size:12.5px}
.demo b{font-weight:600;opacity:.7}
.demo button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px}
.demo button[aria-pressed="true"]{background:#fff;color:var(--fg);border-color:#fff}

.top{display:flex;align-items:center;gap:10px;height:57px;padding-inline:24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent)}
.crumb{font-weight:600}.crumb small{font-weight:500;color:var(--dim);margin-right:6px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:4px;background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.pill.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

.page{max-width:1080px;margin:0 auto;padding-block:26px 64px;padding-inline:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:18px}
.ph h1{margin:0;font-family:var(--display);font-weight:650;font-size:clamp(24px,2.6vw,30px);letter-spacing:-.02em;line-height:1.15}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.act{padding:26px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.brand{display:flex;align-items:center;gap:12px}
.mlogo{width:48px;height:48px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.mlogo svg{width:30px;height:30px}
.brand b{display:block;font-size:15px;font-weight:600}
.brand small{display:block;color:var(--dim);font-size:12.5px}
.st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor}
.st.on{background:var(--ok-soft);color:var(--ok-ink)}
.act h2{margin:0;font-family:var(--display);font-weight:650;font-size:24px;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.act p.lead{margin:-6px 0 0;color:var(--muted);font-size:15px;max-width:52ch}
.fb{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--fb);color:#fff;font-weight:600;font-size:14.5px;align-self:flex-start}
.fb:hover{background:var(--fb-h)}
.fb svg{width:20px;height:20px}
.trust{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--dim)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.trust svg{width:14px;height:14px;color:var(--ok)}

.can{background:var(--raised);border-left:1px solid var(--line);padding:26px 28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lbl{margin:0;font-size:11.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.can ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.can li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.can li i{width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.can li i svg{width:15px;height:15px}
.can li b{display:block;font-weight:600;font-size:13.5px}
.can li small{display:block;color:var(--muted);font-size:12.5px}

/* Panneau « guide » : le second chemin, bien visible pour qui n'a pas encore de compte */
.guide{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center;padding:22px 28px;border-top:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));background:linear-gradient(180deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 35%,var(--surface)))}
.g-txt{display:flex;flex-direction:column;gap:12px;min-width:0}
.g-h{display:flex;align-items:center;gap:12px}
.gi{width:40px;height:40px;border-radius:11px;background:var(--surface);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));display:grid;place-items:center;flex:none}
.gi svg{width:20px;height:20px}
.g-h b{display:block;font-family:var(--display);font-weight:650;font-size:18px;letter-spacing:-.01em;line-height:1.2}
.g-h div>span{display:block;color:var(--muted);font-size:13.5px}
.path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.path li{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--fg)}
.path li i{width:20px;height:20px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font:600 11px var(--ui);font-style:normal}
.path li.done i{background:var(--ok);color:#fff}
.path li.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.path li.cur i{background:var(--accent);color:#fff}
.path .arr{color:var(--dim);font-size:12px}
.g-cta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.g-cta small{font-size:12px;color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;height:44px;padding:0 18px;font-size:14px}
.btn.pri:hover{background:#4A2FD2;border-color:#4A2FD2}
.meter{width:200px;max-width:100%;height:6px;border-radius:3px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:33%;background:var(--accent)}
.or-guide{font-size:13px;color:var(--muted)}
.or-guide a{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn svg{width:15px;height:15px;flex:none}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.ghost{border-color:transparent;color:var(--muted)}.btn.ghost:hover{color:#B8282E;border-color:#FCE8E8}

/* État connecté */
.accs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;background:var(--surface)}
.acc+.acc{border-top:1px solid var(--line)}
.acc input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.acc b{display:block;font-weight:600}
.acc small{display:block;font:500 11.5px var(--mono);color:var(--dim)}
.def{font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.hint{font-size:12.5px;color:var(--dim)}
.ready li i{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.ready li.opt i{color:var(--dim);background:var(--sunk)}

@media (max-width:820px){
  .card{display:flex;flex-direction:column}.main{display:contents}.act{order:1}.guide{order:2}.can{order:3}
  .main{grid-template-columns:minmax(0,1fr)}
  .guide{grid-template-columns:minmax(0,1fr)}.g-cta{align-items:stretch}.g-cta .btn{width:100%}
  .can{border-left:0;border-top:1px solid var(--line)}.guide{border-top:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
  .guide{flex-wrap:wrap;padding-inline:20px}.act,.can{padding:22px 20px}
  .top .pill{display:none}
}
</style>

<div class="demo" role="toolbar" aria-label="États de la maquette">
  <b>Maquette</b>
  <button type="button" data-v="off" aria-pressed="true">Meta non connecté</button>
  <button type="button" data-v="guide" aria-pressed="false">Guide commencé</button>
  <button type="button" data-v="on" aria-pressed="false">Meta connecté</button>
</div>

<header class="top">
  <div class="crumb"><small>Publicités Meta /</small>Connexion</div>
  <div class="sp"></div>
  <span class="pill" id="pill"><i></i><span>Meta non connecté</span></span>
</header>

<main class="page">
  <div class="ph">
    <h1>Connexion</h1>
    <p>Relie ton compte Meta : Growthity pourra publier tes pubs et suivre leurs résultats.</p>
  </div>
  <section class="card" id="card" aria-live="polite"></section>
</main>

<script>
const META=`<svg viewBox="0 0 24 24" role="img" aria-label="Meta"><defs><linearGradient id="mG" x1="0" y1="12" x2="24" y2="12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0064E1"/><stop offset=".55" stop-color="#0073EE"/><stop offset="1" stop-color="#0082FB"/></linearGradient></defs><path fill="url(#mG)" d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.908 44.908 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.358-2.602zm-10.201.553c1.265 0 2.058.791 2.675 1.446.307.327.737.871 1.234 1.579l-1.02 1.566c-.757 1.163-1.882 3.017-2.837 4.338-1.191 1.649-1.81 1.817-2.486 1.817-.524 0-1.038-.237-1.383-.794-.263-.426-.464-1.13-.464-2.046 0-2.221.63-4.535 1.66-6.088.454-.687.964-1.226 1.533-1.533a2.264 2.264 0 0 1 1.088-.285z"/></svg>`;
const FB=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff"/><path fill="#1877F2" d="M13.4 21.9v-7h2.4l.4-2.8h-2.8v-1.8c0-.8.2-1.4 1.4-1.4h1.5V6.4a20 20 0 0 0-2.2-.1c-2.2 0-3.7 1.3-3.7 3.8v2.1H8v2.8h2.4v7z"/></svg>`;
const I=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',check:'<path d="m5 12 5 5 9-10"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',reload:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',dash:'<path d="M5 12h14"/>'};
const $=s=>document.querySelector(s);
const brand=on=>`<div class="brand"><span class="mlogo">${META}</span><div><b>Meta Ads</b><small>Facebook et Instagram</small></div><span class="st${on?" on":""}">${on?"Connecté":"Non connecté"}</span></div>`;
const canList=`<div class="can"><p class="lbl">Avec ton accord, Growthity pourra</p><ul>
  <li><i>${I(IC.send)}</i><div><b>Publier tes campagnes</b><small>Sur le compte publicitaire que tu choisis, avec le budget que tu fixes.</small></div></li>
  <li><i>${I(IC.chart)}</i><div><b>Lire tes résultats</b><small>Dépenses, clics, ventes : tout remonte dans Résultats et Performance.</small></div></li>
  <li><i>${I(IC.users)}</i><div><b>Récupérer tes leads</b><small>Les contacts de tes formulaires Meta arrivent directement dans Growthity.</small></div></li>
</ul></div>`;
const STEPS4=["Portefeuille","Page Facebook","Compte pub","Paiement"];
const guide=(started)=>`<div class="guide" id="sans-compte">
  <div class="g-txt">
    <div class="g-h"><span class="gi">${I(IC.book)}</span><div>
      <b>${started?"Ton guide est en cours : étape 4 sur 9":"Pas encore de compte publicitaire Meta ?"}</b>
      <span>${started?"Reprends là où tu t'es arrêté, puis reviens ici pour connecter Meta.":"On le crée ensemble, écran par écran, même si tu n'as jamais fait de pub."}</span></div></div>
    <ol class="path" aria-label="Ce que le guide te fait créer">${STEPS4.map((t,k)=>`${k?'<li class="arr" aria-hidden="true" style="border:0;background:none;padding:0;height:auto">→</li>':''}<li class="${started?(k<1?"done":k===1?"cur":""):""}"><i>${started&&k<1?"✓":k+1}</i>${t}</li>`).join("")}</ol>
  </div>
  <div class="g-cta">
    ${started?`<span class="meter" aria-hidden="true"><i></i></span>`:""}
    <a class="btn pri" href="#">${started?"Reprendre le guide →":"Créer mon compte avec le guide →"}</a>
    <small>9 étapes · environ 25 minutes · gratuit chez Meta</small>
  </div></div>`;
const V={
  off:()=>`<div class="main"><div class="act">${brand(false)}
    <h2>Tu as déjà un compte publicitaire ? Connecte-le.</h2>
    <p class="lead">Une seule connexion, et Growthity publie tes pubs sur Facebook et Instagram.</p>
    <button type="button" class="fb">${FB}Continuer avec Facebook</button>
    <p class="or-guide" style="margin:-4px 0 0">Pas encore de compte publicitaire ? <a href="#sans-compte">Commence par le guide ↓</a></p>
    <div class="trust"><span>${I(IC.lock)}Connexion sécurisée par Meta</span><span>${I(IC.check)}Tu choisis les comptes à relier</span><span>${I(IC.check)}Accès retirable à tout moment</span></div>
  </div>${canList}</div>${guide(false)}`,
  guide:()=>V.off().replace(guide(false),guide(true)),
  on:()=>`<div class="main"><div class="act">${brand(true)}
    <div><p class="lbl" style="margin-bottom:8px">Comptes publicitaires actifs (2)</p>
    <div class="accs">
      <label class="acc"><input type="radio" name="d" checked><div><b>Atelier Sauge – Pubs</b><small>act_1048 2217 9930 · EUR</small></div><span class="def">Par défaut</span></label>
      <label class="acc"><input type="radio" name="d"><div><b>Atelier Sauge – Tests</b><small>act_1048 5520 1184 · EUR</small></div><span></span></label>
    </div></div>
    <p class="hint" style="margin:0">Le compte par défaut est celui qu'utilise le Chat pour publier. Connexion valable jusqu'au 11 décembre : on te prévient 14 jours avant.</p>
    <div class="row"><button type="button" class="btn sm">Gérer les comptes</button><button type="button" class="btn sm">${I(IC.reload)}Reconnecter</button><span class="sp"></span><button type="button" class="btn sm ghost">Déconnecter</button></div>
  </div>
  <div class="can ready"><p class="lbl">Prêt à publier</p><ul>
    <li><i>${I(IC.check)}</i><div><b>Portefeuille business</b><small>Atelier Sauge</small></div></li>
    <li><i>${I(IC.check)}</i><div><b>Page Facebook</b><small>Atelier Sauge · Instagram @atelier.sauge relié</small></div></li>
    <li><i>${I(IC.check)}</i><div><b>Compte publicitaire</b><small>Moyen de paiement ajouté</small></div></li>
    <li class="opt"><i>${I(IC.dash)}</i><div><b>Pixel</b><small>Facultatif · <a href="#">l'installer avec le guide</a></small></div></li>
  </ul></div></div>`
};
function render(v){
  $("#card").innerHTML=V[v]();
  document.querySelectorAll(".demo button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  const on=v==="on"; $("#pill").classList.toggle("on",on); $("#pill span").textContent=on?"Meta connecté · 2 comptes":"Meta non connecté";
}
document.querySelectorAll(".demo button").forEach(b=>b.onclick=()=>render(b.dataset.v));
render("off");
</script>
