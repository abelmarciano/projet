<title>Classicall Vue 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Charte Classicall (reprise du CRM) : Nunito, fond dégradé bleu ciel → lavande, bleu océan pour l'action, violet pour la sélection.
   Layout : la scène d'équipe en 3D occupe le fond (une rangée par métier, chaque personne sur un socle dont la hauteur suit l'indicateur choisi) ; chiffres en haut, fiche de la personne à droite, activité en bas à gauche. Sur mobile, tout s'empile sous la scène. */
:root {
  --bg: #eaf1fd;
  --grad: linear-gradient(135deg, #D3E4FD 0%, #F1F0FB 55%, #FFFFFF 100%);
  --surface: rgba(255, 255, 255, 0.88);
  --surface-solid: #ffffff;
  --ink: #111827;
  --muted: #8E9196;
  --line: rgba(17, 24, 39, 0.08);
  --brand: #0EA5E9;
  --violet: #9b87f5;
  --violet-dark: #7E69AB;
  --tele: #0EA5E9;
  --terrain: #F97316;
  --cq: #22C55E;
  --admin: #9b87f5;
  --sel: #111827;
  --lead: #94a3b8;
  --rdv: #9b87f5;
  --honore: #f59e0b;
  --signe: #6366f1;
  --installe: #14b8a6;
  --ok: #22C55E;
  --ko: #ea384c;
  --up: #22C55E;
  --down: #ea384c;
  --s-bg: #e9effb; --s-floor: #eef2fa; --s-row: #e3e9f6; --s-plinth: #ffffff;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f172a; --grad: linear-gradient(135deg, #0f172a 0%, #131c33 60%, #0f172a 100%); --surface: rgba(23, 33, 54, 0.88); --surface-solid: #1a2540; --ink: #f1f5f9; --muted: #94a3b8; --line: rgba(255, 255, 255, 0.08);
  --brand: #38bdf8; --violet: #a897f7; --violet-dark: #b9abf9; --tele: #38bdf8; --terrain: #fb923c; --cq: #4ade80; --admin: #b9abf9; --sel: #f1f5f9; --lead: #8b98ab; --rdv: #a897f7; --honore: #fbbf24; --signe: #818cf8; --installe: #2dd4bf; --ok: #4ade80; --ko: #f87171; --up: #4ade80; --down: #f87171;
  --s-bg: #0f172a; --s-floor: #141e33; --s-row: #1c2944; --s-plinth: #25345a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f172a; --grad: linear-gradient(135deg, #0f172a 0%, #131c33 60%, #0f172a 100%); --surface: rgba(23, 33, 54, 0.88); --surface-solid: #1a2540; --ink: #f1f5f9; --muted: #94a3b8; --line: rgba(255, 255, 255, 0.08);
  --brand: #38bdf8; --violet: #a897f7; --violet-dark: #b9abf9; --tele: #38bdf8; --terrain: #fb923c; --cq: #4ade80; --admin: #b9abf9; --sel: #f1f5f9; --lead: #8b98ab; --rdv: #a897f7; --honore: #fbbf24; --signe: #818cf8; --installe: #2dd4bf; --ok: #4ade80; --ko: #f87171; --up: #4ade80; --down: #f87171;
  --s-bg: #0f172a; --s-floor: #141e33; --s-row: #1c2944; --s-plinth: #25345a;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg) var(--grad); color: var(--ink); font-family: var(--f-body); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage canvas { display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 12px; pointer-events: none; transition: opacity .6s; }

/* Étiquette au-dessus de chaque personne : nom + valeur de l'indicateur choisi */
.tag { position: absolute; width: max-content; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 7px; padding: 3px 10px 3px 3px; border-radius: 20px; background: var(--surface-solid); border: 1.5px solid color-mix(in srgb, var(--role) 55%, transparent); box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.07); white-space: nowrap; pointer-events: auto; cursor: pointer; font: 700 11px/1 var(--f-body); color: var(--ink); transition: box-shadow .2s, transform .25s; }
.tag .ini { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 800 9px/1 var(--f-body); position: relative; background: var(--role); color: #fff; }
.tag .ini::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--st); border: 1.5px solid var(--surface-solid); }
.tag .nm { display: flex; flex-direction: column; gap: 2px; }
.tag .nm small { font: 600 10px/1 var(--f-body); color: var(--muted); }
.tag b { font: 800 13px/1 var(--f-body); font-variant-numeric: tabular-nums; padding-left: 6px; border-left: 1px solid var(--line); }
.tag:hover, .tag.hover { box-shadow: 0 0 0 1.5px var(--brand), 0 6px 16px rgba(0,0,0,.1); transform: translate(-50%, calc(-100% - 2px)); z-index: 2; }
.tag.sel { box-shadow: 0 0 0 2.5px var(--sel), 0 6px 18px rgba(0,0,0,.12); z-index: 3; }
.tag.best b { color: color-mix(in srgb, var(--role) 75%, var(--ink)); }
.tag .nm small { display: none; }
.tag:hover .nm small, .tag.hover .nm small, .tag.sel .nm small { display: block; }

/* Libellé de rangée avec choix de l'indicateur */
.rowlab { position: absolute; width: max-content; transform: translate(-100%, -50%); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
.rowlab h3 { margin: 0; font: 800 13px/1 var(--f-body); display: flex; align-items: center; gap: 7px; white-space: nowrap; padding: 6px 10px 6px 8px; border-radius: 20px; background: color-mix(in srgb, var(--role) 14%, var(--surface-solid)); color: color-mix(in srgb, var(--role) 70%, var(--ink)); border: 1px solid color-mix(in srgb, var(--role) 35%, transparent); }
.rowlab h3 i { width: 9px; height: 9px; border-radius: 50%; }
.rowlab h3 span { color: var(--muted); font-weight: 600; }
.mini { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.mini button { border: 0; background: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.mini button[aria-pressed="true"] { background: var(--violet); color: #fff; }
.mini button:not([aria-pressed="true"]):hover { color: var(--violet-dark); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(20,30,60,.07); }
.eyebrow { font: 700 11px/1 var(--f-body); color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* En-tête */
.top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { width: 300px; flex: 0 0 auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; justify-content: space-between; }
.brand h1 { margin: 0; font: 800 22px/1 var(--f-body); display: flex; align-items: center; gap: 10px; }
.brand h1 img { width: 32px; height: 32px; border-radius: 9px; box-shadow: 0 4px 12px rgba(14,165,233,.3); }
.brand h1 small { font: 700 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--violet-dark); background: color-mix(in srgb, var(--violet) 14%, transparent); padding: 4px 7px; border-radius: 6px; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line); }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--violet); color: #fff; box-shadow: 0 2px 6px color-mix(in srgb, var(--violet) 40%, transparent); }
.seg button:not([aria-pressed="true"]):hover { color: var(--violet-dark); }
.sample { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
.kpis { flex: 1; min-width: 0; padding: 16px 6px 14px; display: flex; overflow-x: auto; scrollbar-width: none; }
.kpis::-webkit-scrollbar { display: none; }
.kpi { flex: 1 0 auto; min-width: 112px; padding: 0 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.kpi:first-child { border-left: 0; }
.kpi .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.kpi .l i { width: 6px; height: 6px; border-radius: 50%; }
.kpi .v { font: 800 30px/1 var(--f-body); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; transition: color .4s; }
.kpi .v small { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 2px; }
.kpi .v.flash { color: var(--brand); }
.kpi .d { font: 700 11px/1 var(--f-body); color: var(--up); white-space: nowrap; }
.kpi .d.down { color: var(--down); }
.goal { min-width: 190px; }
.goal .t { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.bar { height: 4px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; border-radius: 3px; transition: width .7s cubic-bezier(.2,.8,.2,1); }

/* Colonnes */
.side { position: absolute; top: 140px; bottom: 16px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
.side > * { pointer-events: auto; }
.right { right: 16px; width: 340px; }
.box { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.detail { flex: 1 1 auto; overflow-y: auto; }
.feed { position: absolute; left: 16px; bottom: 16px; width: 360px; }
.feed ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.feed li { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: baseline; font-size: 12px; line-height: 1.4; min-width: 0; }
.feed li:first-child { animation: in .5s ease-out both; }
.feed li i { width: 6px; height: 6px; border-radius: 50%; display: block; transform: translateY(-1px); }
.feed li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed li time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.hint .lg { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; font-weight: 700; color: var(--ink); }
.hint .lg i { width: 9px; height: 9px; border-radius: 50%; }
.hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 7px 12px; border-radius: 20px; white-space: nowrap; pointer-events: none; }

.person { display: flex; gap: 14px; align-items: center; }
.av { width: 48px; height: 48px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--f-body); position: relative; }
.av::after { content: ""; position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--st, transparent); border: 2px solid var(--surface-solid); }
.person h2 { margin: 0; font: 800 20px/1.1 var(--f-body); text-wrap: balance; }
.person p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; background: var(--line); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; }
.rank { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--violet) 9%, transparent); font-size: 12px; }
.rank b { font: 800 20px/1 var(--f-body); color: var(--violet-dark); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.grid2 div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grid2 small { font-size: 11px; color: var(--muted); }
.grid2 b { font: 800 21px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.spark svg { display: block; width: 100%; height: 60px; overflow: visible; }
.rate { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 12px; }
.rate .bar { grid-column: 1 / -1; height: 3px; }
.rate b { font-weight: 800; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 8px; padding: 7px 10px; font-weight: 700; font-size: 12px; cursor: pointer; }
.btn:hover { border-color: var(--violet); color: var(--violet-dark); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.items { display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; }
.items div { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 6px; border-radius: 8px; font-size: 12px; min-width: 0; }
.items div:hover { background: var(--line); }
.items time { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.items span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.items span small { display: block; color: var(--muted); font-size: 11px; }
.chip { font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 10px; white-space: nowrap; }
#toast { position: absolute; left: 50%; bottom: 64px; transform: translate(-50%, 8px); background: var(--ink); color: var(--surface-solid); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1280px) { .feed { display: none; } .kpi .v { font-size: 26px; } }
@media (max-width: 1060px) { .goal { display: none; } }
@media (max-width: 880px) {
  body { overflow: auto; }
  .app { height: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 28px; }
  .top { position: static; flex-direction: column; order: -1; }
  .brand { width: auto; }
  #stage { position: relative; inset: auto; height: 64vh; min-height: 420px; border-radius: 12px; border: 1px solid var(--line); order: 0; }
  .side, .feed { position: static; width: auto; }
  .right { order: 1; } .feed { order: 2; display: flex; }
  .goal { display: flex; }
  .hint { display: none; }
  .rowlab { transform: translate(-30%, -50%); }
  .tag .nm { display: none; }
  .tag { padding: 2px 6px 2px 2px; gap: 4px; }
  .tag b { font-size: 11px; padding-left: 4px; }
  .tag .ini { width: 18px; height: 18px; font-size: 8px; }
  .mini { display: none; }
  .rowlab h3 span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .feed li:first-child { animation: none; } .bar > div { transition: none; } }
</style>

<div class="app">
  <div id="stage"><div id="labels"></div><div id="loading">Chargement de l'équipe…</div><div class="hint"><span class="lg"><i style="background:var(--tele)"></i>Télépro</span><span class="lg"><i style="background:var(--terrain)"></i>Commercial</span><span class="lg"><i style="background:var(--cq)"></i>Contrôle qualité</span><span class="lg"><i style="background:var(--admin)"></i>Admin</span><span>· cliquez sur une personne pour ses stats</span></div></div>
  <div id="toast" role="status"></div>

  <header class="top">

const tmp = new THREE.Vector3();

// Décale la scène vers la gauche quand la fiche occupe la droite de l'écran
