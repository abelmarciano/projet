<title>QG Solaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout : une maquette d'architecte en 3D occupe tout l'écran ; quelques cartes de verre dépoli flottent autour (chiffres en haut, équipe à gauche, fiche à droite, vues en bas). Sur mobile, les cartes passent sous la scène. */
:root {
  --bg: #e8ecec;
  --surface: rgba(255, 255, 255, 0.78);
  --surface-solid: #ffffff;
  --ink: #17201f;
  --muted: #6c7877;
  --line: rgba(23, 32, 31, 0.09);
  --gold: #b07d22;
  --tele: #36698a;
  --terrain: #b0623b;
  --lead: #98a3a2;
  --rdv: #5878b8;
  --honore: #8a68b4;
  --installe: #3b9268;
  --up: #2f8a5f;
  --down: #c0533f;
  /* scène */
  --s-bg: #e3e8e8; --s-plinth: #f3f4f1; --s-lawn: #e2e9e1; --s-road: #d6dbda; --s-wall: #fbfaf7; --s-roof: #3b4447; --s-tree: #a9bfa4; --s-frame: #2c3537; --s-glass: #c9dde3;
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171a; --surface: rgba(24, 31, 35, 0.8); --surface-solid: #182024; --ink: #e9eeed; --muted: #8b9796; --line: rgba(255, 255, 255, 0.08);
  --gold: #dcaa4a; --tele: #6fa6c9; --terrain: #de8a5f; --lead: #7f8b8a; --rdv: #8aa2e0; --honore: #b195d8; --installe: #5cc08e; --up: #5cc08e; --down: #e67a66;
  --s-bg: #12191c; --s-plinth: #1e272b; --s-lawn: #1f2b2a; --s-road: #283236; --s-wall: #d9dbd6; --s-roof: #2b3235; --s-tree: #3f5a4c; --s-frame: #9aa7a8; --s-glass: #39505a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11171a; --surface: rgba(24, 31, 35, 0.8); --surface-solid: #182024; --ink: #e9eeed; --muted: #8b9796; --line: rgba(255, 255, 255, 0.08);
  --gold: #dcaa4a; --tele: #6fa6c9; --terrain: #de8a5f; --lead: #7f8b8a; --rdv: #8aa2e0; --honore: #b195d8; --installe: #5cc08e; --up: #5cc08e; --down: #e67a66;
  --s-bg: #12191c; --s-plinth: #1e272b; --s-lawn: #1f2b2a; --s-road: #283236; --s-wall: #d9dbd6; --s-roof: #2b3235; --s-tree: #3f5a4c; --s-frame: #9aa7a8; --s-glass: #39505a;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--s-bg); }
#stage.dragging { cursor: grabbing; }
#stage canvas { display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font: 500 11px/1 var(--f-body); padding: 4px 8px 4px 6px; border-radius: 20px; background: var(--surface-solid); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.08); display: flex; align-items: center; gap: 6px; transition: opacity .3s; }
.tag i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.tag.sel { box-shadow: 0 0 0 1.5px var(--gold), 0 4px 14px rgba(0,0,0,.12); }
.float { position: absolute; transform: translate(-50%, -100%); font: 500 12px/1 var(--f-body); white-space: nowrap; padding: 6px 10px; border-radius: 20px; background: var(--surface-solid); box-shadow: 0 6px 20px rgba(0,0,0,.12); display: flex; align-items: center; gap: 6px; }
.float i { width: 7px; height: 7px; border-radius: 50%; }
#loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 12px; letter-spacing: .02em; pointer-events: none; transition: opacity .6s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(20,30,30,.07); }
.eyebrow { font: 500 11px/1 var(--f-body); color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* ---- En-tête ---- */
.top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { width: 300px; flex: 0 0 auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; justify-content: space-between; }
.brand h1 { margin: 0; font: 400 26px/1 var(--f-display); letter-spacing: -.01em; }
.brand h1 em { color: var(--gold); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line); }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-solid); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.kpis { flex: 1; min-width: 0; padding: 16px 6px 14px; display: flex; overflow-x: auto; scrollbar-width: none; }
.kpis::-webkit-scrollbar { display: none; }
.kpi { flex: 1 0 auto; min-width: 118px; padding: 0 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.kpi:first-child { border-left: 0; }
.kpi .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.kpi .l i { width: 6px; height: 6px; border-radius: 50%; }
.kpi .v { font: 400 34px/1 var(--f-display); letter-spacing: -.01em; font-variant-numeric: lining-nums tabular-nums; transition: color .4s; white-space: nowrap; }
.kpi .v small { font-size: 20px; color: var(--muted); margin-left: 2px; }
.kpi .v.flash { color: var(--gold); }
.kpi .d { font: 400 11px/1 var(--f-mono); color: var(--up); white-space: nowrap; }
.kpi .d.down { color: var(--down); }
.goal { display: flex; flex-direction: column; gap: 6px; min-width: 190px; }
.goal .bar { height: 4px; }
.goal .t { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }

/* ---- Colonnes ---- */
.side { position: absolute; top: 140px; bottom: 76px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
.side > * { pointer-events: auto; }
.left { left: 16px; width: 340px; }
.right { right: 16px; width: 320px; }
.box { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.team { flex: 1 1 auto; }
.list { overflow-y: auto; min-height: 0; margin: 0 -8px; }
.thead, .row { display: grid; grid-template-columns: 1fr 44px 44px 52px; gap: 6px; align-items: center; padding: 0 8px; }
.thead { font-size: 10px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding-bottom: 4px; }
.thead span:not(:first-child), .row .c { text-align: right; }
.row { width: 100%; border: 0; background: none; text-align: left; padding-block: 8px; border-radius: 10px; cursor: pointer; }
.row:hover { background: var(--line); }
.row.sel { background: var(--surface-solid); box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,.06); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font: 500 11px/1 var(--f-body); letter-spacing: .02em; position: relative; }
.av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--st, transparent); border: 2px solid var(--surface-solid); }
.who b { font-weight: 500; font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); font-size: 11px; white-space: nowrap; display: block; overflow: hidden; text-overflow: ellipsis; }
.row .c { font: 400 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.row .c.hl { color: var(--ink); font-weight: 500; }

.feed ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.feed li { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: baseline; font-size: 12px; line-height: 1.4; min-width: 0; }
.feed li:first-child { animation: in .5s ease-out both; }
.feed li i { width: 6px; height: 6px; border-radius: 50%; display: block; transform: translateY(-1px); }
.feed li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed li time { font: 400 11px/1 var(--f-mono); color: var(--muted); }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.detail { flex: 1 1 auto; overflow-y: auto; }
.person { display: flex; gap: 14px; align-items: center; }
.person .av { width: 48px; height: 48px; font-size: 15px; }
.person h2 { margin: 0; font: 400 24px/1.05 var(--f-display); text-wrap: balance; }
.person p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 9px; border-radius: 20px; background: var(--line); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.grid2 div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grid2 small { font-size: 11px; color: var(--muted); }
.grid2 b { font: 400 24px/1 var(--f-display); font-variant-numeric: lining-nums tabular-nums; }
.grid2 b.txt { font: 500 13px/1.3 var(--f-body); }
.spark svg { display: block; width: 100%; height: 64px; overflow: visible; }
.rate { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 12px; }
.rate .bar { grid-column: 1 / -1; }
.rate b { font: 400 12px/1 var(--f-mono); }
.bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; border-radius: 3px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
.step i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--lead); }
.step.done i { background: var(--c); border-color: var(--c); }
.step:not(.done) span { color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--gold); cursor: pointer; font-size: 12px; text-align: left; }

.funnel { display: flex; flex-direction: column; gap: 7px; }
.fz { display: grid; grid-template-columns: 74px 1fr 40px; gap: 10px; align-items: center; font-size: 12px; }
.fz .track { position: relative; height: 18px; }
.fz .track div { position: absolute; inset: 0 auto 0 0; border-radius: 4px; transition: width .7s cubic-bezier(.2,.8,.2,1); display: flex; align-items: center; padding-left: 7px; font: 500 11px/1 var(--f-mono); color: #fff; }
.fz em { font: normal 400 11px/1 var(--f-mono); color: var(--muted); text-align: right; }

/* ---- Vues ---- */
.views { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: calc(100% - 32px); }
.views .seg { background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 4px; border-radius: 12px; overflow-x: auto; max-width: 100%; box-shadow: 0 10px 30px rgba(20,30,30,.07); }
.views .seg button { white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 11px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.sample { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

@media (max-width: 1240px) { .feed { display: none !important; } .kpi .v { font-size: 30px; } }
@media (max-width: 1060px) { .goal { display: none; } }
@media (max-width: 880px) {
  body { overflow: auto; }
  .app { height: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 28px; }
  .top { position: static; flex-direction: column; }
  .brand { width: auto; }
  #stage { position: relative; inset: auto; height: 62vh; min-height: 360px; border-radius: 14px; border: 1px solid var(--line); }
  .side, .views { position: static; width: auto; transform: none; max-width: none; }
  .views { order: 1; } #stage { order: 0; } .top { order: -1; } .left { order: 2; } .right { order: 3; }
  .feed { display: flex !important; }
  .list { max-height: 360px; }
  .goal { display: flex; }
}
@media (prefers-reduced-motion: reduce) { .feed li:first-child { animation: none; } .bar > div, .fz .track div { transition: none; } }
</style>

  <div id="stage"><div id="labels"></div><div id="loading">Chargement de l'équipe…</div></div>

  <header class="top">

<script>

function loadBot(onLoad, onError) {
  try {
    const bin = atob(window.XBOT_GLB), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    new THREE.GLTFLoader().parse(buf.buffer, '', onLoad, onError);
  } catch (e) { onError(e); }
}
loadBot(bot => {
  const clip = n => { const c = bot.animations.find(a => a.name === n); return new THREE.AnimationClip(n, c.duration, c.tracks.filter(t => t.name.endsWith('.quaternion'))); };
  const idle = clip('idle'), walk = clip('walk'), nod = clip('agree');
  THREE.AnimationUtils.makeClipAdditive(nod);
  bot.scene.updateMatrixWorld(true);
  let top = 1.78; bot.scene.traverse(o => { if (/HeadTop_End/.test(o.name)) top = o.getWorldPosition(new THREE.Vector3()).y; });
  agents.forEach(a => {
    const model = THREE.SkeletonUtils.clone(bot.scene);
    model.scale.setScalar(FIG_H / top);
    model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.frustumCulled = false; o.userData = { type: 'agent', id: a.id }; pickables.push(o);
      o.material = o.material.clone(); o.material.roughness = .55; o.material.metalness = 0;
      if (/Joints/.test(o.material.name)) a.jointMat = o.material; else o.material.color.set(BODY[a.role]);
    });
    a.g.add(model);
    a.mixer = new THREE.AnimationMixer(model);

    a.nod = a.mixer.clipAction(nod); a.nod.blendMode = THREE.AdditiveAnimationBlendMode; a.nod.setLoop(THREE.LoopOnce, 1);

function spark(vals, color, label) {

  const last = pts[n - 1];
  return `<div class="spark"><div class="eyebrow" style="margin-bottom:8px"><span>${label}</span><span class="num">14 derniers jours</span></div><svg viewBox="0 0 ${w} ${h + 4}" preserveAspectRatio="none" aria-hidden="true">

    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--${color})"/></svg></div>`;
}

  el.innerHTML = head + body;

/* ============ Boucle ============ */
const tmp = new THREE.Vector3();
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const toScreen = (v, w, h) => { tmp.copy(v).project(camera); return { x: (tmp.x * .5 + .5) * w, y: (-tmp.y * .5 + .5) * h, ok: tmp.z < 1 }; };
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (!reduced && now - lastUser > 10000) cam.theta += dt * .025;
  if (follow) { goal.target.set(follow.g.position.x, 1.3, follow.g.position.z); lastUser = now; }
  const ease = 1 - Math.exp(-dt * 3.2); cam.r += (goal.r - cam.r) * ease; cam.target.lerp(goal.target, ease);
  const { theta, phi, r, target } = cam;
  camera.position.set(target.x + r * Math.sin(phi) * Math.sin(theta), target.y + r * Math.cos(phi), target.z + r * Math.sin(phi) * Math.cos(theta)); camera.lookAt(target);

  houses.forEach(h => {
    if (!h.shown) return;
    if (h.anim < 1) { h.anim = Math.min(1, h.anim + dt * 1.4); const k = 1 - Math.pow(1 - h.anim, 3); h.g.scale.setScalar(Math.max(.0001, k)); }
    h.head.position.y = 8.3 + (reduced ? 0 : Math.sin(t * 1.6 + h.idx) * .15);
    if (h.state === 'installe') h.halo.material.opacity = .45 + Math.sin(t * 2 + h.idx) * .25;
  });

  agents.forEach(a => {
    if (a.mixer) a.mixer.update(dt);
    if (a.queue.length) {
      const tgt = a.queue[0]; tmp.subVectors(tgt, a.g.position); tmp.y = 0;
      const d = tmp.length(), step = 3.4 * dt;
      if (d <= step) { a.g.position.copy(tgt); a.queue.shift(); if (!a.queue.length) { setWalking(a, false); a.yaw = a.faceOnArrive; const f = a.onArrive; a.onArrive = null; f && f(); } }
      else { tmp.normalize(); a.g.position.addScaledVector(tmp, step); a.yaw = Math.atan2(tmp.x, tmp.z); }
    }
    let dy = a.yaw - a.g.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); a.g.rotation.y += dy * Math.min(1, dt * 8);
    const active = a.status === 'En appel' || a.status === 'En RDV';
    const k = (t * .7 + a.s.honores * .1) % 1; a.pulse.scale.setScalar(1 + k * 2.2); a.pulse.material.opacity = active ? (1 - k) * .7 : 0;
  });
  if (sel.type === 'agent') { const g = byId[sel.id].g; selRing.position.set(g.position.x, g.position.y + .06, g.position.z); selRing.scale.setScalar(1); }
  else { const h = houses[sel.idx]; selRing.position.set(h.pos.x, .2, h.pos.z); selRing.scale.setScalar(5.6); }
  selRing.material.opacity = .65 + Math.sin(t * 3) * .25;

  for (let i = arcs.length - 1; i >= 0; i--) {
    const a = arcs[i]; a.t += dt / 1.5;
    a.line.geometry.setDrawRange(0, Math.min(81, Math.floor(a.t * 81)));
    if (a.t <= 1) a.dot.position.copy(a.curve.getPoint(a.t)); else a.dot.visible = false;
    if (a.t > 1) a.line.material.opacity = Math.max(0, 1 - (a.t - 1) * 1.4);
    if (a.t > 1.8) { scene.remove(a.line, a.dot); a.line.geometry.dispose(); arcs.splice(i, 1); }
  }
  renderer.render(scene, camera);

  const w = stage.clientWidth, h = stage.clientHeight;
  const far = cam.r > 205;
  agents.forEach(a => { const p = toScreen(tmp.copy(a.g.position).setY(a.g.position.y + 2.85), w, h); a.tag.style.display = p.ok ? '' : 'none'; a.tag.style.opacity = far && !(sel.type === 'agent' && sel.id === a.id) ? 0 : 1; a.tag.style.left = p.x + 'px'; a.tag.style.top = p.y + 'px'; });
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt; const p = toScreen(tmp.copy(f.pos).setY(f.pos.y + f.t * 1.2), w, h);
    f.el.style.left = p.x + 'px'; f.el.style.top = p.y + 'px'; f.el.style.opacity = f.t < .25 ? f.t * 4 : f.t < 2.2 ? 1 : Math.max(0, 1 - (f.t - 2.2) * 2);
    if (f.t > 2.8) { f.el.remove(); floats.splice(i, 1); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
