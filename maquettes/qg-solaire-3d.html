<title>Classicall Vue 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : une maquette d'architecte en 3D occupe tout l'écran ; quelques cartes de verre dépoli flottent autour (chiffres en haut, équipe à gauche, fiche à droite, vues en bas). Sur mobile, les cartes passent sous la scène. */
/* Charte Classicall (repris du CRM) : Nunito, fond dégradé bleu ciel → lavande, bleu océan pour l'action, violet en accent, marine pour le terrain, couleurs de statuts du CRM. */
:root {
  --bg: #eaf1fd;
  --grad: linear-gradient(135deg, #D3E4FD 0%, #F1F0FB 55%, #FFFFFF 100%);
  --surface: rgba(255, 255, 255, 0.86);
  --surface-solid: #ffffff;
  --ink: #111827;
  --muted: #8E9196;
  --line: rgba(17, 24, 39, 0.08);
  --brand: #0EA5E9;
  --violet: #9b87f5;
  --violet-dark: #7E69AB;
  --tele: #0EA5E9;
  --terrain: #002F79;
  --lead: #94a3b8;
  --rdv: #9b87f5;
  --honore: #f59e0b;
  --signe: #6366f1;
  --installe: #14b8a6;
  --up: #22C55E;
  --down: #ea384c;
  --s-bg: #e4ecfb; --s-plinth: #ffffff; --s-lawn: #E6F0EA; --s-road: #dfe7f6; --s-wall: #fbfcff; --s-roof: #334155; --s-tree: #b9d6c4; --s-frame: #22324f; --s-glass: #bfe3f7;
  --f-display: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f172a; --grad: linear-gradient(135deg, #0f172a 0%, #131c33 60%, #0f172a 100%); --surface: rgba(23, 33, 54, 0.86); --surface-solid: #1a2540; --ink: #f1f5f9; --muted: #94a3b8; --line: rgba(255, 255, 255, 0.08);
  --brand: #38bdf8; --violet: #a897f7; --violet-dark: #9b87f5; --tele: #38bdf8; --terrain: #7ea6ef; --lead: #8b98ab; --rdv: #a897f7; --honore: #fbbf24; --signe: #818cf8; --installe: #2dd4bf; --up: #4ade80; --down: #f87171;
  --s-bg: #0f172a; --s-plinth: #1b2539; --s-lawn: #1a2b2c; --s-road: #24314b; --s-wall: #e3e8f0; --s-roof: #1e293b; --s-tree: #2f5246; --s-frame: #7dd3fc; --s-glass: #2b4a66;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f172a; --grad: linear-gradient(135deg, #0f172a 0%, #131c33 60%, #0f172a 100%); --surface: rgba(23, 33, 54, 0.86); --surface-solid: #1a2540; --ink: #f1f5f9; --muted: #94a3b8; --line: rgba(255, 255, 255, 0.08);
  --brand: #38bdf8; --violet: #a897f7; --violet-dark: #9b87f5; --tele: #38bdf8; --terrain: #7ea6ef; --lead: #8b98ab; --rdv: #a897f7; --honore: #fbbf24; --signe: #818cf8; --installe: #2dd4bf; --up: #4ade80; --down: #f87171;
  --s-bg: #0f172a; --s-plinth: #1b2539; --s-lawn: #1a2b2c; --s-road: #24314b; --s-wall: #e3e8f0; --s-roof: #1e293b; --s-tree: #2f5246; --s-frame: #7dd3fc; --s-glass: #2b4a66;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg) var(--grad); color: var(--ink); font-family: var(--f-body); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--s-bg); }
#stage.dragging { cursor: grabbing; }
#stage canvas { display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font: 700 11px/1 var(--f-body); padding: 3px 9px 3px 3px; border-radius: 20px; background: var(--surface-solid); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.07); display: flex; align-items: center; gap: 6px; pointer-events: auto; cursor: pointer; transition: box-shadow .2s, transform .2s; }
.tag .ini { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 800 8px/1 var(--f-body); position: relative; }
.tag .ini::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 7px; height: 7px; border-radius: 50%; background: var(--st); border: 1.5px solid var(--surface-solid); }
.tag em { font-style: normal; font-weight: 600; color: var(--muted); display: none; }
.tag:hover, .tag.hover { box-shadow: 0 0 0 1.5px var(--brand), 0 6px 16px rgba(0,0,0,.1); transform: translate(-50%, calc(-100% - 2px)); z-index: 2; }
.tag:hover em, .tag.hover em, .tag.sel em { display: inline; }
.tag.sel { z-index: 3; box-shadow: 0 0 0 1.5px var(--violet), 0 4px 14px rgba(0,0,0,.12); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 8px; padding: 7px 10px; font-weight: 700; font-size: 12px; cursor: pointer; color: var(--ink); }
.btn:hover { border-color: var(--violet); color: var(--violet-dark); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.agenda { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
.agenda button { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; min-width: 0; }
.agenda button:hover { background: var(--line); }
.agenda time { white-space: nowrap; font-weight: 800; font-variant-numeric: tabular-nums; }
.agenda span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agenda span small { display: block; color: var(--muted); font-size: 11px; }
.agenda .empty { color: var(--muted); font-size: 12px; padding: 4px 8px; }
.chip { font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 10px; white-space: nowrap; }
#toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 8px); background: var(--ink); color: var(--surface-solid); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 12px; letter-spacing: .02em; pointer-events: none; transition: opacity .6s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(20,30,30,.07); }
.eyebrow { font: 700 11px/1 var(--f-body); color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* ---- En-tête ---- */
.top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { width: 300px; flex: 0 0 auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; justify-content: space-between; }
.brand h1 { margin: 0; font: 800 22px/1 var(--f-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.brand h1 img { width: 32px; height: 32px; border-radius: 9px; box-shadow: 0 4px 12px rgba(14,165,233,.3); }
.brand h1 small { font: 700 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--violet-dark); background: color-mix(in srgb, var(--violet) 14%, transparent); padding: 4px 7px; border-radius: 6px; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line); }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button { font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--violet); color: #fff; box-shadow: 0 2px 6px color-mix(in srgb, var(--violet) 40%, transparent); }
.seg button:not([aria-pressed="true"]):hover { color: var(--violet-dark); }
.kpis { flex: 1; min-width: 0; padding: 16px 6px 14px; display: flex; overflow-x: auto; scrollbar-width: none; }
.kpis::-webkit-scrollbar { display: none; }
.kpi { flex: 1 0 auto; min-width: 118px; padding: 0 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.kpi:first-child { border-left: 0; }
.kpi .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.kpi .l i { width: 6px; height: 6px; border-radius: 50%; }
.kpi .v { font: 800 30px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; transition: color .4s; white-space: nowrap; }
.kpi .v small { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 2px; }
.kpi .v.flash { color: var(--brand); }
.kpi .d { font: 700 11px/1 var(--f-mono); color: var(--up); white-space: nowrap; }
.kpi .d.down { color: var(--down); }
.goal { display: flex; flex-direction: column; gap: 6px; min-width: 190px; }
.goal .bar { height: 4px; }
.goal .t { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }

/* ---- Colonnes ---- */
.side { position: absolute; top: 140px; bottom: 76px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
.side > * { pointer-events: auto; }
.left { left: 16px; width: 340px; }
.right { right: 16px; width: 320px; }
.box { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.team { flex: 1 1 auto; }
.list { overflow-y: auto; min-height: 0; margin: 0 -8px; }
.thead, .row { display: grid; grid-template-columns: 1fr 44px 44px 52px; gap: 6px; align-items: center; padding: 0 8px; }
.thead { font-size: 10px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding-bottom: 4px; }
.thead span:not(:first-child), .row .c { text-align: right; }
.row { width: 100%; border: 0; background: none; text-align: left; padding-block: 8px; border-radius: 10px; cursor: pointer; }
.row:hover { background: var(--line); }
.row.sel { background: color-mix(in srgb, var(--violet) 10%, var(--surface-solid)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--violet) 45%, transparent); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font: 800 11px/1 var(--f-body); letter-spacing: .02em; position: relative; }
.av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--st, transparent); border: 2px solid var(--surface-solid); }
.who b { font-weight: 700; font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); font-size: 11px; white-space: nowrap; display: block; overflow: hidden; text-overflow: ellipsis; }
.row .c { font: 600 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.row .c.hl { color: var(--ink); font-weight: 800; }

.feed ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.feed li { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: baseline; font-size: 12px; line-height: 1.4; min-width: 0; }
.feed li:first-child { animation: in .5s ease-out both; }
.feed li i { width: 6px; height: 6px; border-radius: 50%; display: block; transform: translateY(-1px); }
.feed li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed li time { font: 400 11px/1 var(--f-mono); color: var(--muted); }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.detail { flex: 1 1 auto; overflow-y: auto; }
.person { display: flex; gap: 14px; align-items: center; }
.person .av { width: 48px; height: 48px; font-size: 15px; }
.person h2 { margin: 0; font: 800 20px/1.1 var(--f-display); text-wrap: balance; }
.person p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 9px; border-radius: 20px; background: var(--line); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.grid2 div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grid2 small { font-size: 11px; color: var(--muted); }
.grid2 b { font: 800 21px/1 var(--f-display); font-variant-numeric: lining-nums tabular-nums; }
.grid2 b.txt { font: 700 13px/1.3 var(--f-body); }
.spark svg { display: block; width: 100%; height: 64px; overflow: visible; }
.rate { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 12px; }
.rate .bar { grid-column: 1 / -1; }
.rate b { font: 400 12px/1 var(--f-mono); }
.bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; border-radius: 3px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
.step i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--lead); }
.step.done i { background: var(--c); border-color: var(--c); }
.step:not(.done) span { color: var(--muted); }
.link { border: 0; background: var(--brand); padding: 8px 12px; border-radius: 8px; font-weight: 700; color: #fff; align-self: flex-start; cursor: pointer; font-size: 12px; text-align: left; }

.funnel { display: flex; flex-direction: column; gap: 7px; }
.fz { display: grid; grid-template-columns: 74px 1fr 40px; gap: 10px; align-items: center; font-size: 12px; }
.fz .track { position: relative; height: 18px; }
.fz .track div { position: absolute; inset: 0 auto 0 0; border-radius: 6px; transition: width .7s cubic-bezier(.2,.8,.2,1); display: flex; align-items: center; padding-left: 7px; font: 800 11px/1 var(--f-mono); color: #fff; }
.fz em { font: normal 400 11px/1 var(--f-mono); color: var(--muted); text-align: right; }

/* ---- Vues ---- */
.views { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: calc(100% - 32px); }
.views .seg { background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 4px; border-radius: 12px; overflow-x: auto; max-width: 100%; box-shadow: 0 10px 30px rgba(20,30,30,.07); }
.views .seg button { white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 11px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.sample { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

@media (max-width: 1240px) { .feed { display: none !important; } .kpi .v { font-size: 30px; } }
@media (max-width: 1060px) { .goal { display: none; } }
@media (max-width: 880px) {
  body { overflow: auto; }
  .app { height: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 28px; }
  .top { position: static; flex-direction: column; }
  .brand { width: auto; }
  #stage { position: relative; inset: auto; height: 62vh; min-height: 360px; border-radius: 14px; border: 1px solid var(--line); }
  .side, .views { position: static; width: auto; transform: none; max-width: none; }
  .views { order: 1; } #stage { order: 0; } .top { order: -1; } .left { order: 2; } .right { order: 3; }
  .feed { display: flex !important; }
  .list { max-height: 360px; }
  .goal { display: flex; }
}
@media (prefers-reduced-motion: reduce) { .feed li:first-child { animation: none; } .bar > div, .fz .track div { transition: none; } }
</style>

const BODY = { tele: 0xf6f8fc, terrain: 0xeef1f8 };
const FIG_H = 2.3; // personnages légèrement agrandis pour rester lisibles sur la maquette
function loadBot(onLoad, onError) {
  try {
    const bin = atob(window.XBOT_GLB), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    new THREE.GLTFLoader().parse(buf.buffer, '', onLoad, onError);
  } catch (e) { onError(e); }
}
loadBot(bot => {
  const clip = n => { const c = bot.animations.find(a => a.name === n); return new THREE.AnimationClip(n, c.duration, c.tracks.filter(t => t.name.endsWith('.quaternion'))); };
  const idle = clip('idle'), walk = clip('walk'), nod = clip('agree');
  THREE.AnimationUtils.makeClipAdditive(nod);
  bot.scene.updateMatrixWorld(true);
  let top = 1.78; bot.scene.traverse(o => { if (/HeadTop_End/.test(o.name)) top = o.getWorldPosition(new THREE.Vector3()).y; });
  agents.forEach(a => {
    const model = THREE.SkeletonUtils.clone(bot.scene);
    model.scale.setScalar(FIG_H / top);
    model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.frustumCulled = false;
      o.material = o.material.clone(); o.material.roughness = .55; o.material.metalness = 0;
      if (/Joints/.test(o.material.name)) a.jointMat = o.material; else o.material.color.set(BODY[a.role]);
    });
    a.g.add(model);
    a.mixer = new THREE.AnimationMixer(model);
    a.idle = a.mixer.clipAction(idle); a.walk = a.mixer.clipAction(walk);
    a.nod = a.mixer.clipAction(nod); a.nod.blendMode = THREE.AdditiveAnimationBlendMode; a.nod.setLoop(THREE.LoopOnce, 1);

  });

function setWalking(a, on) {

  a.walking = on;
  const from = on ? a.idle : a.walk, to = on ? a.walk : a.idle;

const cam = { theta: .62, phi: .84, r: 300, target: new THREE.Vector3(0, 0, 3) };

function focus(v, r) { follow = null; goal.target.set(v.x, v.y || 0, v.z); goal.r = r; lastUser = performance.now(); }
const pointers = new Map(); let drag = null;
stage.addEventListener('pointerdown', e => { if (e.target.closest('.tag')) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); stage.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, pinch: null }; stage.classList.add('dragging'); });
stage.addEventListener('pointermove', e => {
  if (!drag) { hoverAt(e); return; }
  if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [p, q] = [...pointers.values()]; const d = Math.hypot(p.x - q.x, p.y - q.y); if (drag.pinch) goal.r = THREE.MathUtils.clamp(goal.r * drag.pinch / d, 14, 340); drag.pinch = d; return; }
  follow = null; cam.theta -= (e.clientX - drag.x) * .005; cam.phi = THREE.MathUtils.clamp(cam.phi - (e.clientY - drag.y) * .004, .55, 1.05);
  drag.x = e.clientX; drag.y = e.clientY; lastUser = performance.now();
});
function endDrag(e) { if (!drag) return; const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy); pointers.delete(e.pointerId); if (moved < 6 && !pointers.size) clickAt(e); if (!pointers.size) { drag = null; stage.classList.remove('dragging'); } }

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function pickAt(e) {

  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(mouse, camera);

}
const first = n => n.split(' ')[0];
function bump(k, n = 1) { Object.values(P).forEach(p => p[k] += n); flash.add(k); }
function evLead() {

  const h = pick(pool); showHouse(h, 'lead'); bump('leads');
  addFeed('lead', `Nouveau lead · <b>${h.d.client}</b>, ${h.d.city} (${h.d.source})`);
}

  if (!pool.length || !callers.length) return evLead();

  setTimeout(() => {
    a.s.appels += Math.round(rnd(3, 9)); a.s.joints++; a.s.rdv++; h.d.tele = a.id;

      a.status = Math.random() < .25 ? 'Saisie CRM' : 'Disponible';
      addFeed('rdv', `<b>${first(a.name)}</b> fixe un RDV chez ${h.d.client} · ${h.d.city}, ${pick(['demain 10 h', 'jeudi 14 h', 'vendredi 9 h 30', 'lundi 17 h'])}`);

}

  const h = pick(pool), c = byId[h.d.com]; h.busy = c.busy = true; c.status = 'En route'; renderList();

function spark(vals, color, label) {

    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--${color})"/></svg></div>`;
}

  const a = byId[sel.id], s = a.s, isT = a.role === 'tele';

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

const SLOTS = ['9 h 00', '10 h 30', '11 h 45', '14 h 00', '15 h 30', '17 h 00', '18 h 15'];
function agenda(a) {
  const isT = a.role === 'tele';
  const slot = h => h.idx % SLOTS.length;
  const list = houses.filter(h => h.shown && (isT ? h.d.tele === a.id : h.d.com === a.id) && h.state !== 'lead').slice(0, 5).sort((x, y) => slot(x) - slot(y));
  if (!list.length) return `<div class="agenda"><div class="empty">Rien pour le moment aujourd'hui.</div></div>`;
  return `<div class="agenda">${list.map((h, i) => `<button type="button" data-house="${h.idx}"><time>${SLOTS[slot(h)]}</time><span>${h.d.client}<small>${h.d.city} · ${h.d.kwc} kWc</small></span><span class="chip" style="background:color-mix(in srgb, ${sc(h.state)} 16%, transparent);color:${sc(h.state)}">${STATE_LABEL[h.state]}</span></button>`).join('')}</div>`;

$('#detail').addEventListener('click', e => { const b = e.target.closest('[data-house]'); if (b) select({ type: 'house', idx: +b.dataset.house }); });
function renderFunnel() {

$('#list').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) select({ type: 'agent', id: r.dataset.id }); });

/* ============ Boucle ============ */
const tmp = new THREE.Vector3();
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const toScreen = (v, w, h) => { tmp.copy(v).project(camera); return { x: (tmp.x * .5 + .5) * w, y: (-tmp.y * .5 + .5) * h, ok: tmp.z < 1 }; };
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (follow) { goal.target.set(follow.g.position.x, 1.3, follow.g.position.z); lastUser = now; }
  const ease = 1 - Math.exp(-dt * 3.2); cam.r += (goal.r - cam.r) * ease; cam.target.lerp(goal.target, ease);
  const { theta, phi, r, target } = cam;
  camera.position.set(target.x + r * Math.sin(phi) * Math.sin(theta), target.y + r * Math.cos(phi), target.z + r * Math.sin(phi) * Math.cos(theta)); camera.lookAt(target);

  houses.forEach(h => {
    if (!h.shown) return;
    if (h.anim < 1) { h.anim = Math.min(1, h.anim + dt * 1.4); const k = 1 - Math.pow(1 - h.anim, 3); h.g.scale.setScalar(Math.max(.0001, k)); }
  });

  agents.forEach(a => {
    if (a.mixer) a.mixer.update(dt);
    if (a.queue.length) {
      const tgt = a.queue[0]; tmp.subVectors(tgt, a.g.position); tmp.y = 0;
      const d = tmp.length(), step = 3.4 * dt;
      if (d <= step) { a.g.position.copy(tgt); a.queue.shift(); if (!a.queue.length) { setWalking(a, false); a.yaw = a.faceOnArrive; const f = a.onArrive; a.onArrive = null; f && f(); } }
      else { tmp.normalize(); a.g.position.addScaledVector(tmp, step); a.yaw = Math.atan2(tmp.x, tmp.z); }
    }
    let dy = a.yaw - a.g.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); a.g.rotation.y += dy * Math.min(1, dt * 8);
  });
  if (sel.type === 'agent') { const g = byId[sel.id].g; selRing.position.set(g.position.x, g.position.y + .06, g.position.z); selRing.scale.setScalar(1); }
  else { const h = houses[sel.idx]; selRing.position.set(h.pos.x, .2, h.pos.z); selRing.scale.setScalar(5.6); }
  selRing.material.opacity = .95;

  renderer.render(scene, camera);

  const w = stage.clientWidth, h = stage.clientHeight;
  const far = false;
  agents.forEach(a => { const p = toScreen(tmp.copy(a.g.position).setY(a.g.position.y + 2.85), w, h); a.tag.style.display = p.ok ? '' : 'none'; a.tag.style.opacity = far && !(sel.type === 'agent' && sel.id === a.id) ? 0 : 1; a.tag.style.left = p.x + 'px'; a.tag.style.top = p.y + 'px'; });
  requestAnimationFrame(loop);
}
