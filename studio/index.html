<title>Growthity Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;550;600;650;680;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm workspace. Top bar navigation, full-width canvas, hairline structure; colour comes only from the creatives, the status dots and one violet accent. Light by design. */
:root {
  --bg: #F6F6F8;
  --panel: #FFFFFF;
  --raised: #FFFFFF;
  --sunk: #F1F0F4;
  --hover: #F7F6FA;
  --ink: #17161D;
  --ink-2: #3D3C47;
  --muted: #6E6D79;
  --faint: #A3A2AD;
  --line: #E9E8EE;
  --line-2: #DCDBE3;
  --accent: #5B3FE4;
  --accent-2: #4A2FD0;
  --accent-soft: #F0EDFF;
  --on-accent: #FFFFFF;
  --grad: linear-gradient(120deg, #2563EB 0%, #5B3FE4 52%, #9333EA 100%);
  --glow-a: #5B3FE4;
  --st-idea: #9A9DAA; --st-make: #E08A12; --st-review: #E8573A; --st-sched: #3368F0; --st-live: #16A35B; --st-pause: #9B4CF0;
  --danger: #D92D20; --redo: #C2301F; --redo-bg: #FDF1EF; --redo-line: #F4CFC9; --fav: #E0245E;
  --glass: rgba(255,255,255,.86); --scrim: rgba(23,22,29,.32); --thumb: #ECEBF0;
  --sh-1: 0 1px 2px rgba(23,22,29,.04);
  --sh-2: 0 1px 2px rgba(23,22,29,.04), 0 8px 24px -12px rgba(23,22,29,.16);
  --sh-3: 0 0 0 1px rgba(23,22,29,.05), 0 24px 60px -24px rgba(23,22,29,.32);
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Geist", system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; letter-spacing: -.005em }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--glass) }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
::selection { background: var(--accent-soft) }
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
.serif { color: var(--accent) }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.grow { flex: 1 }

/* ---------- shell: top bar ---------- */
.app { min-height: 100% }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); backdrop-filter: saturate(1.6) blur(16px); border-bottom: 1px solid var(--line) }
.top-in { max-width: 1440px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 22px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)) }
.ws { display: flex; align-items: center; gap: 9px; text-decoration: none; flex: none }
.ws .mk { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; box-shadow: 0 4px 12px -4px rgba(91,63,228,.6) }
.ws .mk svg { width: 15px; height: 15px }
.ws b { font-weight: 650; font-size: 15px; letter-spacing: -.02em }
.ws small { font-size: 12px; color: var(--faint); font-weight: 500; margin-left: 2px }
.nav { display: flex; gap: 2px; height: 100%; min-width: 0; overflow-x: auto; scrollbar-width: none }
.nav a { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 11px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 13.5px; white-space: nowrap; transition: color .15s }
.nav a:hover { color: var(--ink) }
.nav a svg { width: 15px; height: 15px; opacity: .8 }
.nav a[aria-current="page"] { color: var(--ink) }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink) }
.nav .n { font: 500 11px var(--f-mono); color: var(--faint); background: var(--sunk); border-radius: 5px; padding: 0 5px; line-height: 18px }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none }
.kbtn { display: flex; align-items: center; gap: 8px; height: 34px; width: 230px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--faint); font-size: 13px }
.kbtn:hover { border-color: var(--line-2); color: var(--muted) }
.kbtn kbd { margin-left: auto; font: 500 10.5px var(--f-mono); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--muted) }
.kbtn svg { width: 14px; height: 14px }
.rail-foot { display: none }
.tabbar { display: none }

main { min-width: 0; padding-block: 28px 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)) }
.page { max-width: 1440px; margin: 0 auto; animation: in .28s var(--ease) both }
@keyframes in { from { opacity: 0; transform: translateY(3px) } }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 22px }
.eyebrow { font-size: 12.5px; font-weight: 550; color: var(--muted); margin-bottom: 4px; display: flex; gap: 7px; align-items: center }
.eyebrow svg { display: none }
.ph h1 { margin: 0; font: 680 28px/1.1 var(--f-display); letter-spacing: -.035em; text-wrap: balance }
.ph p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 64ch }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 600; font-size: 13px; white-space: nowrap; box-shadow: var(--sh-1); transition: background .15s, border-color .15s, transform .1s, box-shadow .15s; text-decoration: none; color: var(--ink) }
.btn:hover { border-color: #C9C8D2; background: var(--hover) }
.btn:active { transform: translateY(1px) }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff }
.btn.primary:hover { background: #2B2A33 }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 16px -8px rgba(91,63,228,.8) }
.btn.accent:hover { background: var(--accent-2) }
.btn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2) }
.btn.quiet:hover { background: var(--sunk) }
.btn.danger { color: var(--danger) }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px }
.btn.icon { width: 36px; padding: 0 }
.btn.sm.icon { width: 30px }
.btn svg { width: 15px; height: 15px; flex: none }
.btn[disabled] { opacity: .45; pointer-events: none }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--muted); transition: background .15s, color .15s }
.seg button:hover { color: var(--ink) }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--sh-2) }
.search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); min-width: 0; flex: 0 1 300px }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; font-size: 13px }
.search svg { width: 14px; height: 14px; color: var(--faint); flex: none }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px }

.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: color-mix(in srgb, var(--c) 10%, white); color: color-mix(in srgb, var(--c) 75%, black) }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; background: var(--sunk); color: var(--ink-2); font-size: 11px; font-weight: 600; white-space: nowrap }
.tag.mono { font: 500 10.5px var(--f-mono); color: var(--muted) }
.tag.ad { background: var(--ink); color: #fff; letter-spacing: .08em; font-size: 10px; font-weight: 700 }
.net { width: 17px; height: 17px; border-radius: 5px; display: inline-grid; place-items: center; color: #fff; font: 700 8.5px var(--f-ui); flex: none }
.net.Instagram { background: linear-gradient(135deg,#F9A13A,#E1306C 50%,#833AB4) }
.net.Facebook { background: #1877F2 }
.net.TikTok { background: #111 }
.net.LinkedIn { background: #0A66C2 }
.nets { display: inline-flex; gap: 3px }

.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 36px 24px; text-align: center; color: var(--muted); background: var(--panel) }
.empty b { display: block; color: var(--ink); font-size: 16px; font-weight: 650; margin-bottom: 6px; letter-spacing: -.02em }
.empty .btn { margin-top: 14px }
.notice { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); font-size: 13px; margin-bottom: 14px }
.skel { background: linear-gradient(90deg, var(--sunk), #FAFAFC, var(--sunk)); background-size: 200% 100%; animation: sk 1.2s infinite linear; border-radius: 12px }
@keyframes sk { to { background-position: -200% 0 } }

/* cover = the whole creative, never cropped, on a blurred bed of itself */
.cv { position: relative; overflow: hidden; background: var(--thumb); isolation: isolate }
.cv .bed { position: absolute; inset: -18px; background-size: cover; background-position: center; filter: blur(16px) saturate(1.2); opacity: .8; transform: scale(1.1); z-index: -1 }
.cv img, .cv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block }
.cv.fill img, .cv.fill video { object-fit: cover }
.cv .ico { position: absolute; right: 6px; top: 6px; height: 20px; padding: 0 6px; border-radius: 6px; background: rgba(15,14,20,.55); backdrop-filter: blur(6px); display: inline-flex; align-items: center; gap: 4px; color: #fff; font: 600 10px var(--f-ui) }
.cv .ico svg { width: 10px; height: 10px }
.cv .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 11.5px; font-weight: 600 }
.cvw { position: relative; display: block; min-width: 0 }

/* ---------- home ---------- */
.home-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 18px; margin-bottom: 24px }
.home-h h1 { margin: 0; font: 680 30px/1.1 var(--f-display); letter-spacing: -.04em }
.home-h .eyebrow { margin-bottom: 6px }
.stats-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px }
.sl { display: inline-flex; align-items: baseline; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s, box-shadow .15s }
.sl:hover { border-color: var(--line-2); box-shadow: var(--sh-2) }
.sl b { font: 650 18px/40px var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.sl span { font-size: 12.5px; color: var(--muted); font-weight: 550; display: inline-flex; align-items: center; gap: 6px }
.sl span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.home { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px }
.sec-h h2 { margin: 0; font: 650 16px var(--f-display); letter-spacing: -.02em }
.sec-h small { font: 500 12px var(--f-mono); color: var(--faint) }
.sec-h a, .sec-h button.lnk { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; background: none; border: 0; padding: 0 }
.queue { display: grid; gap: 10px }
.qc { display: grid; grid-template-columns: 92px minmax(0,1fr) auto; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px 10px 10px; transition: border-color .15s, box-shadow .2s }
.qc:hover { border-color: var(--line-2); box-shadow: var(--sh-2) }
.qc .cvw .cv { width: 92px; aspect-ratio: 4/5; border-radius: 9px }
.qc .cv .ico { display: none }
.qc .pbtn { width: 30px; height: 30px; margin: -15px 0 0 -15px } .qc .pbtn svg { width: 12px; height: 12px }
.qc .body { min-width: 0; display: grid; gap: 6px; cursor: pointer }
.qc .tt { font-weight: 650; font-size: 14.5px; letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.qc .cap { font-size: 13px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.qc .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.qc .acts { display: flex; flex-direction: column; gap: 6px }
.side { display: grid; gap: 26px }
.agenda { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.ag-day { display: grid; grid-template-columns: 54px minmax(0,1fr); border-top: 1px solid var(--line); min-height: 46px }
.ag-day:first-child { border-top: 0 }
.ag-day.over { background: var(--accent-soft) }
.ag-d { padding: 10px 0 10px 14px; display: grid; align-content: start; line-height: 1.1 }
.ag-d span { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em }
.ag-d b { font: 650 17px var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.ag-day.today .ag-d b, .ag-day.today .ag-d span { color: var(--accent) }
.ag-l { padding: 7px 10px 7px 0; display: grid; gap: 4px; align-content: center; min-width: 0 }
.ag-it { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 3px 6px 3px 3px; border-radius: 8px; text-align: left; min-width: 0; cursor: grab; color: inherit }
.ag-it:hover { background: var(--hover) }
.ag-it .cv { width: 24px; height: 30px; border-radius: 5px; flex: none }
.ag-it .cv .ico { display: none }
.ag-it .tt { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 }
.ag-it .tm { font: 500 11px var(--f-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; flex: none }
.ag-it .tm i { width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.ag-add { justify-self: start; border: 0; background: none; color: var(--faint); font-size: 12px; font-weight: 600; padding: 4px 6px; border-radius: 6px }
.ag-add:hover { color: var(--accent); background: var(--accent-soft) }
.mini { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px }
.mini button { border: 0; padding: 0; background: transparent; border-radius: 8px; overflow: hidden }
.mini .cv { aspect-ratio: 4/5; border-radius: 8px; transition: transform .2s var(--ease) }
.mini button:hover .cv { transform: scale(1.03) }
.mini .cv .ico { display: none }
.list { display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.li { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 8px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; transition: background .15s; color: inherit }
.li:first-child { border-top: 0 }
.li:hover { background: var(--hover) }
.li .cv { width: 36px; aspect-ratio: 4/5; border-radius: 6px }
.li .cv .ico, .li .pbtn { display: none }
.li .tt { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.li .sub { display: flex; gap: 6px; align-items: center; margin-top: 3px; color: var(--muted); font-size: 12px; min-width: 0 }
.li .when { text-align: right; font: 500 11.5px var(--f-mono); color: var(--ink-2) }
.li .when small { display: block; color: var(--faint); font-size: 10.5px }
.redo-l .li .sub { color: var(--redo) }

/* ---------- posts list ---------- */
.stabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; scrollbar-width: none }
.stabs button { position: relative; border: 0; background: none; height: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap }
.stabs button i { width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.stabs button small { font: 500 11px var(--f-mono); color: var(--faint) }
.stabs button:hover { color: var(--ink) }
.stabs button[aria-pressed="true"] { color: var(--ink) }
.stabs button[aria-pressed="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px }
.rows { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.rh, .rw { display: grid; grid-template-columns: 52px minmax(0, 1fr) 110px 70px 150px 150px; gap: 14px; align-items: center; padding: 0 16px 0 10px }
.rh { height: 36px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .08em }
.rw { min-height: 72px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s }
.rw:last-child { border-bottom: 0 }
.rw:hover { background: var(--hover) }
.rw .cv { width: 44px; aspect-ratio: 4/5; border-radius: 7px }
.rw .cv .ico, .rw .pbtn { display: none }
.rw .t { min-width: 0 }
.rw .tt { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center }
.rw .cap { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px }
.rw .when { font: 500 12px var(--f-mono); color: var(--ink-2) }
.rw .when small { display: block; color: var(--faint); font-size: 11px }
.stsel-in { appearance: none; -webkit-appearance: none; border: 1px solid transparent; border-radius: 999px; height: 28px; padding: 0 26px 0 22px; font-size: 12px; font-weight: 600; cursor: pointer; background: color-mix(in srgb, var(--c) 10%, white) no-repeat; color: color-mix(in srgb, var(--c) 75%, black); background-image: radial-gradient(circle, var(--c) 3px, transparent 3.5px), linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: 9px 50%, calc(100% - 13px) 52%, calc(100% - 9px) 52%; background-size: 8px 8px, 4px 4px, 4px 4px; width: 100% }
.stsel-in:hover { border-color: color-mix(in srgb, var(--c) 40%, transparent) }

/* ---------- planning ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.cal-head h2 { margin: 0 10px 0 6px; font: 650 20px var(--f-display); letter-spacing: -.03em; text-transform: capitalize; min-width: 190px }
.plan { display: grid; grid-template-columns: minmax(0,1fr) 290px; gap: 20px; align-items: start }
.cal { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel) }
.cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border-bottom: 1px solid var(--line) }
.cal-dow div { padding: 9px 10px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .08em }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)) }
.day { min-height: 124px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: background .15s }
.day:nth-child(7n) { border-right: 0 }
.day.out { background: #FAFAFB }
.day.out .dn { color: #C7C6CF }
.day.over { background: var(--accent-soft) !important }
.day-top { display: flex; align-items: center; justify-content: space-between; padding: 1px 2px 1px 3px }
.dn { font: 500 12px var(--f-mono); color: var(--muted); min-width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 6px }
.today .dn { background: var(--accent); color: #fff }
.day .plus { opacity: 0; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; transition: opacity .15s }
.day:hover .plus, .day .plus:focus-visible { opacity: 1 }
.day .plus:hover { background: var(--sunk); color: var(--ink) }
.ev { display: flex; align-items: center; gap: 6px; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 6px 3px 3px; text-align: left; min-width: 0; cursor: grab; transition: border-color .15s, box-shadow .15s; color: inherit; box-shadow: var(--sh-1) }
.ev:hover { border-color: var(--accent); box-shadow: var(--sh-2) }
.ev .cv { width: 22px; height: 28px; border-radius: 5px; flex: none }
.ev .cv .ico { display: none }
.ev .tx { min-width: 0; display: grid; line-height: 1.2 }
.ev .tt { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ev .tm { font: 500 9.5px var(--f-mono); color: var(--muted); display: flex; gap: 5px; align-items: center }
.ev .tm i { width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.ev.is-ad { box-shadow: inset 2px 0 0 var(--ink) }
.dragging { opacity: .35 }
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px }
.rday { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 7px; min-width: 0; transition: background .15s }
.rday.over { background: var(--accent-soft) }
.rday.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.rday h5 { margin: 0 2px; display: flex; align-items: baseline; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em }
.rday h5 b { font: 650 19px var(--f-display); letter-spacing: -.03em; color: var(--ink) }
.rday.today h5 b { color: var(--accent) }
.rtile { border: 0; padding: 0; background: transparent; text-align: left; display: grid; gap: 5px; cursor: grab; color: inherit }
.rtile .cv { aspect-ratio: 4/5; border-radius: 8px }
.rtile .cv .ico { display: none }
.rtile .tt { font-size: 11.5px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.rtile .tm { font: 500 10px var(--f-mono); color: var(--muted); display: flex; gap: 5px; align-items: center }
.rtile .tm i { width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.radd { margin-top: auto; border: 1px dashed var(--line-2); border-radius: 8px; background: transparent; height: 28px; color: var(--faint); font-weight: 600; font-size: 11.5px }
.radd:hover { color: var(--accent); border-color: var(--accent) }
.tray { position: sticky; top: 80px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; max-height: calc(100vh - 100px); overflow: auto; transition: background .15s }
.tray.over { background: var(--accent-soft) }
.tray h3 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: baseline }
.tray h3 small { font: 500 11.5px var(--f-mono); color: var(--faint) }
.tray p { margin: 3px 0 12px; font-size: 12px; color: var(--muted) }
.tray .tl { display: grid; gap: 2px }
.trow { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; align-items: center; width: 100%; border: 0; border-radius: 9px; background: transparent; padding: 5px; text-align: left; cursor: grab; transition: background .15s; color: inherit }
.trow:hover { background: var(--hover) }
.trow .cv { width: 34px; aspect-ratio: 4/5; border-radius: 6px }
.trow .cv .ico { display: none }
.trow .tt { font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.trow .meta { display: flex; gap: 5px; align-items: center; margin-top: 3px }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }

/* ---------- board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: start }
.col { border-radius: var(--r); padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 220px; background: var(--sunk); transition: background .15s, outline-color .15s; outline: 2px dashed transparent; outline-offset: -2px }
.col.over { background: var(--accent-soft); outline-color: var(--accent) }
.col-h { display: flex; align-items: center; gap: 8px; padding: 6px 8px 4px; font-weight: 650; font-size: 13px }
.col-h i { width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.col-h .n { margin-left: auto; font: 500 11px var(--f-mono); color: var(--muted) }
.col .add { border: 1px dashed var(--line-2); border-radius: 9px; background: transparent; height: 32px; font-weight: 600; font-size: 12px; color: var(--muted) }
.col .add:hover { color: var(--accent); border-color: var(--accent); background: var(--panel) }
.card { background: var(--panel); border-radius: 10px; border: 1px solid var(--line); text-align: left; padding: 6px; display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; align-items: start; width: 100%; cursor: grab; transition: border-color .15s, box-shadow .15s; color: inherit; box-shadow: var(--sh-1) }
.card:hover { border-color: var(--line-2); box-shadow: var(--sh-2) }
.card .cvw .cv { aspect-ratio: 4/5; border-radius: 7px }
.card .pbtn, .card .cv .ico, .card .cap { display: none }
.card .cb { display: grid; gap: 6px; min-width: 0; padding-top: 1px }
.card .tt { font-size: 12.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.card .row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap }
.card .ft { display: flex; justify-content: space-between; align-items: center; gap: 6px }
.card .when { font: 500 10.5px var(--f-mono); color: var(--muted) }

/* ---------- ads ---------- */
.stats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px }
.stat { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; height: 34px; padding: 0 11px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--ink) }
.stat:hover { border-color: var(--line-2) }
.stat[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) }
.stat b { font: 500 11.5px var(--f-mono); color: var(--muted) }
.tbl { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow-x: auto }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13px }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 11px 16px; border-bottom: 1px solid var(--line) }
td { padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: middle }
tbody tr:last-child td { border-bottom: 0 }
tbody tr { cursor: pointer; transition: background .12s }
tbody tr:hover td { background: var(--hover) }
.adn { display: flex; align-items: center; gap: 12px; font-weight: 600 }
.adn .cv { width: 40px; height: 50px; border-radius: 7px; flex: none }
.adn .cv .ico { display: none }
.adn small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; margin-top: 2px }

/* ---------- medias ---------- */
.mlay { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 28px; align-items: start }
.filters { position: sticky; top: 84px; display: grid; gap: 20px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 4px }
.filters h4 { margin: 0 0 6px 8px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .08em }
.fl { display: grid; gap: 1px }
.fl button { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 13px; font-weight: 550; color: var(--ink-2); width: 100% }
.fl button:hover { background: var(--sunk) }
.fl button i { width: 8px; height: 8px; border-radius: 3px; background: var(--c, var(--line-2)); flex: none }
.fl button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.fl button small { font: 500 11px var(--f-mono); color: var(--faint) }
.fl button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 650; box-shadow: var(--sh-2), inset 0 0 0 1px var(--line) }
.cat-row { display: none }
.masonry { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 18px 14px }
.mc { display: block; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; color: inherit; min-width: 0 }
.mc .frame { position: relative; aspect-ratio: 4/5; border-radius: 12px; overflow: hidden; background: var(--thumb); transition: transform .25s var(--ease), box-shadow .25s; box-shadow: var(--sh-1) }
.mc .frame > .cv { position: absolute; inset: 0 }
.mc:hover .frame { transform: translateY(-3px); box-shadow: var(--sh-3) }
.mc .ov { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(15,14,20,.6), transparent 50%); opacity: 0; transition: opacity .2s; display: flex; align-items: flex-end; padding: 10px; color: #fff; font-size: 11.5px; font-weight: 600 }
.mc:hover .ov, .mc:focus-visible .ov { opacity: 1 }
.mc .badge { position: absolute; left: 7px; top: 7px; display: flex; gap: 4px }
.mc .badge span { height: 20px; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,.92); font: 600 10.5px var(--f-ui); display: inline-flex; align-items: center; gap: 4px; color: var(--ink) }
.mc .badge span svg { stroke: var(--ink) }
.mc .play { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(15,14,20,.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.45); display: grid; place-items: center; transition: transform .2s }
.mc:hover .play { transform: scale(1.08) }
.mc .meta { padding: 9px 2px 0; display: grid; gap: 5px }
.mc .tt { font-weight: 600; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mc .row { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden }
.favbtn { position: absolute; right: 7px; top: 7px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.92); color: #9C9BA7; box-shadow: 0 4px 12px -6px rgba(0,0,0,.35); cursor: pointer; opacity: 0; transition: opacity .15s, transform .15s, color .15s }
.favbtn svg { width: 14px; height: 14px }
.mc:hover .favbtn, .mc:focus-within .favbtn, .favbtn[aria-pressed="true"] { opacity: 1 }
.favbtn:hover { transform: scale(1.08); color: var(--fav) }
.favbtn[aria-pressed="true"] { color: #fff; background: var(--fav) }
@media (hover: none) { .favbtn { opacity: 1 } }
.btn.fav[aria-pressed="true"] { background: #FDE8EF; color: #C0174B; border-color: #F6BCCD }
.btn.fav svg { width: 14px; height: 14px }
.drop { display: contents }
.drop > span:not(.btn) { display: none }
.dropzone.over { outline: 2px dashed var(--accent); outline-offset: 8px; border-radius: 12px }
.upbar { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 14px }
.progress { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; flex: 1 }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }

/* ---------- editor ---------- */
.ed-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px }
.crumb { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; gap: 6px; align-items: center }
.crumb a { text-decoration: none } .crumb a:hover { color: var(--ink) }
.ed-top h1 { margin: 0; font: 650 21px var(--f-display); letter-spacing: -.03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.saved { font-size: 12px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center }
.saved::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--st-live) }
.saved.dirty::before { background: var(--st-make) }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 16px }
.panel + .panel { margin-top: 14px }
.panel h3 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.panel h3 small { font-weight: 500; font-size: 12px; color: var(--muted) }
.fld { display: grid; gap: 6px; min-width: 0 }
.fld > label, .fld > .lb { font-size: 12px; font-weight: 600; color: var(--muted) }
.fld input[type=text], .fld input[type=datetime-local], .fld input:not([type]), .fld select, .fld textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 9px; background: var(--panel); padding: 9px 12px; font-size: 13.5px; transition: border-color .15s, box-shadow .15s }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.fld textarea { min-height: 220px; resize: vertical; line-height: 1.6 }
.titlein { border: 0 !important; padding: 0 !important; font: 680 25px/1.15 var(--f-display) !important; letter-spacing: -.035em; box-shadow: none !important; background: transparent !important }
.titlein::placeholder { color: #C7C6CF }
.cnt { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap }
.cnt .warn { color: var(--st-make); font-weight: 600 }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chk { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 9px; height: 34px; padding: 0 12px 0 8px; font-size: 12.5px; font-weight: 600; background: var(--panel); user-select: none; transition: border-color .15s, background .15s; color: var(--ink) }
.chk[aria-pressed="false"] { color: var(--muted) }
.chk[aria-pressed="false"] .net { filter: grayscale(1); opacity: .4 }
.chk[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) }
.stsel { display: flex; flex-wrap: wrap; gap: 6px }
.stsel button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; height: 30px; padding: 0 12px 0 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: all .15s; color: var(--ink-2) }
.stsel button i { width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.stsel button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, white); color: color-mix(in srgb, var(--c) 75%, black); box-shadow: 0 0 0 1px var(--c) }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 3px }
.picker button { border: 0; border-radius: 9px; padding: 0 0 125% 0; height: 0; overflow: hidden; position: relative; background: var(--thumb); display: block; width: 100%; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .15s }
.picker button .cv { position: absolute; inset: 0 }
.picker button .cv .ico { display: none }
.picker button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent), 0 0 0 5px var(--accent-soft) }
.picker .lb { position: absolute; left: 5px; bottom: 5px; font: 500 9.5px var(--f-mono); background: rgba(15,14,20,.66); color: #fff; padding: 2px 5px; border-radius: 4px }
.picker .ok { position: absolute; right: 5px; top: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); display: none; place-items: center }
.picker button[aria-pressed="true"] .ok { display: grid }
.danger-zone { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.confirm { font-size: 13px; font-weight: 600; color: var(--danger) }

/* preview (Instagram's own chrome) */
.pv { position: sticky; top: 80px; border-radius: var(--r); padding: 16px 16px 12px; background: linear-gradient(180deg, var(--accent-soft), var(--panel) 45%); border: 1px solid var(--line); display: grid; gap: 12px; justify-items: center }
.pv-tabs { justify-self: stretch; display: flex; justify-content: space-between; align-items: center }
.pv-tabs span { font-size: 12px; font-weight: 600; color: var(--muted) }
.phone { width: 316px; max-width: 100%; border-radius: 46px; background: #0C0C10; padding: 9px; box-shadow: 0 0 0 1.5px #2A2A33 inset, var(--sh-3) }
.screen { border-radius: 38px; overflow: hidden; background: #fff; position: relative; aspect-ratio: 9/19.3; display: flex; flex-direction: column; color: #111; font-size: 13px }
.island { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 20px; background: #0C0C10; z-index: 3 }
.ig-top { height: 72px; padding-top: 38px; display: flex; align-items: center; justify-content: space-between; padding-inline: 14px; font: 650 18px var(--f-ui); letter-spacing: -.02em; border-bottom: 1px solid #F0F0F0; flex: none }
.ig-top svg { width: 20px; height: 20px }
.ig-feed { overflow-y: auto; flex: 1; scrollbar-width: none }
.ig-head { display: flex; align-items: center; gap: 8px; padding: 9px 11px }
.ig-av { width: 30px; height: 30px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg,#F9A13A,#E1306C,#833AB4); flex: none }
.ig-av div { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; border: 1.5px solid #fff }
.ig-name { font-weight: 600; font-size: 12.5px; line-height: 1.15 }
.ig-name small { display: block; font-weight: 400; font-size: 11px; color: #555 }
.ig-media { position: relative; background: #F2F2F2; overflow: hidden }
.ig-media img, .ig-media video { width: 100%; height: 100%; object-fit: cover; display: block }
.ig-media .count { position: absolute; right: 9px; top: 9px; background: rgba(0,0,0,.62); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px }
.ig-media .arr { position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(255,255,255,.88); color: #111; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-weight: 700 }
.ig-media .arr.l { left: 8px } .ig-media .arr.r { right: 8px }
.ig-cta { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #F4F6FA; border-bottom: 1px solid #ECECEC; font-weight: 600; font-size: 13px; color: #0B5CD7 }
.ig-act { display: flex; align-items: center; gap: 14px; padding: 9px 12px 4px }
.ig-act svg { width: 22px; height: 22px }
.ig-dots { display: flex; gap: 4px; justify-content: center; flex: 1; margin-right: 50px }
.ig-dots i { width: 6px; height: 6px; border-radius: 50%; background: #CFCFCF }
.ig-dots i.on { background: #0095F6 }
.ig-cap { padding: 4px 12px 16px; font-size: 12.5px; line-height: 1.42; white-space: pre-wrap; word-wrap: break-word }
.ig-cap b { font-weight: 600 }
.ig-cap .more { color: #737373; background: none; border: 0; padding: 0; font-size: 12.5px }
.ig-cap .empty-cap { color: #A0A0A0 }
.reel { position: absolute; inset: 0; background: #000 }
.reel img, .reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.reel .shade { position: absolute; inset: auto 0 0 0; height: 48%; background: linear-gradient(0deg, rgba(0,0,0,.75), transparent) }
.reel .lbl { position: absolute; top: 44px; left: 16px; color: #fff; font: 650 18px var(--f-ui); letter-spacing: -.02em }
.reel .info { position: absolute; left: 12px; right: 56px; bottom: 18px; color: #fff; display: grid; gap: 8px }
.reel .who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px }
.reel .who .ig-av { width: 28px; height: 28px }
.reel .txt { font-size: 12.5px; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap }
.reel .cta { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.95); color: #111; border-radius: 9px; padding: 9px 12px; font-weight: 700; font-size: 13px }
.reel .side { position: absolute; right: 10px; bottom: 30px; display: grid; gap: 18px; justify-items: center; color: #fff }
.reel .side svg { width: 25px; height: 25px }
.pbtn { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background: rgba(15,14,20,.55); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; transition: transform .15s, background .15s; z-index: 2; cursor: pointer }
.pbtn:hover { transform: scale(1.08); background: var(--accent) }
.pbtn svg { width: 18px; height: 18px; margin-left: 2px }
.player { position: fixed; inset: 0; z-index: 85; background: rgba(12,12,16,.88); backdrop-filter: blur(6px); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s ease both }
.player-in { display: grid; gap: 12px; justify-items: center; max-width: 100% }
.player video { max-height: 78vh; max-width: min(92vw, 520px); border-radius: 14px; background: #000; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8) }
.player .pt { color: #fff; font-weight: 600; font-size: 15px; text-align: center }
.player .pa { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }
.snd { position: absolute; left: 10px; bottom: 10px; z-index: 4; border: 0; border-radius: 99px; background: rgba(15,14,20,.72); color: #fff; font: 600 12px var(--f-ui); padding: 7px 12px; backdrop-filter: blur(6px) }
.reel .snd { top: 74px; bottom: auto; left: auto; right: 12px }
.pv-note { font-size: 11.5px; color: var(--muted); text-align: center; max-width: 330px }

/* media detail */

// ---------- data ----------
async function boot() {
  route();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.failed = true; render(); return; }
  const timer = setTimeout(() => { if (!S.db) { S.failed = true; render(); } }, 10000);
  let db = null, assets = null, user = null;
  try { [db, assets, user] = await Promise.all([c.use('db'), c.use('assets'), c.use('user')]); } catch {}
  S.db = db; S.assets = assets;
  if (!db) { clearTimeout(timer); S.failed = true; render(); return; }
  clearTimeout(timer);
  if (user) { try { S.me = await user.id(); } catch {} }
  c.use('downloads').then((dl) => { S.dl = dl; if (S.view === 'media') renderMediaDetail(); }).catch(() => {});
  c.use('mcp').then((m) => { S.mcp = m; if (S.view === 'post') renderZernio(); }).catch(() => {});
  db.collection('media').onSnapshot((snap) => {
    S.media = snap.docs.map((d) => ({id: d.id, ...d.data()})).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    S.loaded.media = true; onData();
  }, (e) => toast('Médias : ' + errMsg(e), true));
  db.collection('config').onSnapshot((snap) => { const d = snap.docs.find((x) => x.id === 'launch'); S.launch = d ? d.data() : null; if (S.view === 'lancement') render(); }, () => {});
  db.collection('posts').onSnapshot((snap) => {
    S.posts = snap.docs.map((d) => ({id: d.id, ...d.data()}));
    S.loaded.posts = true; onData();
  }, (e) => toast('Posts : ' + errMsg(e), true));
  refreshUsage();
}
function onData() {
  renderNav();
  if (S.view === 'post') { if (!S.ed) openEditorFromRoute(); else refreshPicker(); return; }
  if (S.view === 'media' && S.md) { renderMediaDetail(); return; }
  if (S.cmdk) renderCmdk();
  render();
}
async function refreshUsage() { if (!S.assets) return; try { const r = await S.assets.list(); S.usage = r.usage; renderFoot(); } catch {} }
async function writePost(p) { const {id, ...data} = p; data.updatedAt = Date.now(); await S.db.collection('posts').doc(id).set(JSON.parse(JSON.stringify(data))); }

// ---------- routing ----------
function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
function closeMenu() { S.menuOpen = false; $('#newmenu').hidden = true; $('#mobmenu')?.remove(); }
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  closeMenu();
  if (h.startsWith('post-') || h === 'nouveau') {
    S.view = 'post'; S.param = h === 'nouveau' ? null : h.slice(5);
    if (S.param && S.ed && S.ed.draft.id === S.param) { render(); return; }
    if (!S.param && S.ed?.isNew) { render(); return; }
    S.ed = null; openEditorFromRoute(); window.scrollTo(0, 0); return;
  }
  if (h.startsWith('media-')) { S.view = 'media'; S.md = {id: h.slice(6), slide: 0, confirm: false}; render(); window.scrollTo(0, 0); return; }
  S.view = VIEWS.some((x) => x.v === h) ? h : 'accueil';
  S.ed = null; S.md = null;
  render(); window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
function openEditorFromRoute() {
  if (S.param) { const p = postById(S.param); if (!p) { render(); return; } S.ed = {draft: JSON.parse(JSON.stringify(p)), isNew: false, dirty: false, slide: 0, pv: null, confirm: false}; S.zs = {}; }
  else if (!S.ed) { go('planning'); return; }
  render();
}
function newDraft(type, opts = {}) {
  const m = mediaById(opts.mediaId);
  const draft = {id: uid(), type, title: m ? m.title.replace(/^(Carrousel|Visuel pub|Short)\s*\d*\s*[–-]\s*/i, '') : '', networks: ['Instagram', 'Facebook'],
    format: m?.format || (type === 'ad' ? '9:16' : '4:5'), mediaId: m?.id || null, caption: '', date: opts.date || '',
    status: opts.status || (type === 'ad' ? 'draft' : opts.date ? 'sched' : 'idea'),
    ad: type === 'ad' ? {objective: 'Ventes', budget: '', cta: 'Commencer', link: 'https://growthity.ai', audience: ''} : null,
    createdAt: Date.now(), createdBy: S.me || null};
  S.ed = {draft, isNew: true, dirty: true, slide: 0, pv: null, confirm: false};
  S.view = 'post'; S.param = null; closeCmdk();
  if (location.hash !== '#nouveau') location.hash = 'nouveau'; else { render(); window.scrollTo(0, 0); }
}

function posterOf(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    const done = (b) => { URL.revokeObjectURL(url); res(b); };
    const t = setTimeout(() => done(null), 8000);
    v.onloadeddata = () => { v.currentTime = Math.min(1.2, (v.duration || 2) / 3); };
    v.onseeked = () => { try { const c = document.createElement('canvas'); const sc = 540 / (v.videoWidth || 540); c.width = 540; c.height = Math.round((v.videoHeight || 960) * sc); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); c.toBlob((b) => { clearTimeout(t); done(b); }, 'image/jpeg', 0.82); } catch { clearTimeout(t); done(null); } };
    v.onerror = () => { clearTimeout(t); done(null); };
    v.src = url;
  });
}
function guessFormat(w, h) { const r = w / h; return Object.entries({'9:16': 9 / 16, '4:5': 0.8, '1:1': 1, '16:9': 16 / 9}).sort((a, b) => Math.abs(a[1] - r) - Math.abs(b[1] - r))[0][0]; }
function dims(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const done = (v) => { URL.revokeObjectURL(url); res(v); };
    if (file.type.startsWith('video')) { const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.onloadedmetadata = () => done([v.videoWidth || 9, v.videoHeight || 16]); v.onerror = () => done([9, 16]); v.src = url; }
    else { const i = new Image(); i.onload = () => done([i.naturalWidth, i.naturalHeight]); i.onerror = () => done([4, 5]); i.src = url; }
  });
}
async function uploadFiles(files) {
  if (!S.assets) { toast('Import impossible : un accès Éditeur est nécessaire.', true); return; }
  files = files.filter((f) => /^(image\/(png|jpeg|webp)|video\/(mp4|webm))$/.test(f.type));
  if (!files.length) { toast('Formats acceptés : PNG, JPEG, WebP, MP4, WebM.', true); return; }
  const imgs = files.filter((f) => f.type.startsWith('image')).sort((a, b) => a.name.localeCompare(b.name, 'fr', {numeric: true}));
  const groups = [...files.filter((f) => f.type.startsWith('video')).map((v) => [v]), ...(imgs.length ? [imgs] : [])];
  S.upload = {done: 0, total: files.length}; if (S.view === 'medias') render();
  let ok = 0;
  for (const g of groups) {
    const items = []; let fmt = '4:5';
    for (const f of g) {
      try {
        const [w, h] = await dims(f); if (!items.length) fmt = guessFormat(w, h);
        const r = await S.assets.upload(f); const it = {asset: r.id, ct: r.contentType, name: f.name};
        if (f.type.startsWith('video')) { const pb = await posterOf(f); if (pb) { try { it.poster = (await S.assets.upload(pb, {type: 'image/jpeg'})).id; } catch {} } }
        items.push(it);
      }
      catch (e) { toast(`${f.name} : ${errMsg(e)}`, true); }
      S.upload.done++; if (S.view === 'medias') render();
    }
    if (!items.length) continue;
    const norm = (n) => n.toLowerCase().replace(/\s*\(\d+\)(?=\.[^.]+$)/, '');
    const match = g.length === 1 && S.media.find((m) => m.drive && !(m.items || []).length && norm(m.drive.file || '') === norm(g[0].name));
    if (match) { try { await S.db.collection('media').doc(match.id).update({items, format: fmt}); ok++; } catch (e) { toast('Enregistrement : ' + errMsg(e), true); } continue; }
    const kind = isVid(items[0]) ? 'video' : items.length > 1 ? 'carousel' : 'image';
    const title = (g.length > 1 ? 'Carrousel – ' : '') + g[0].name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
    try { await S.db.collection('media').doc(uid()).set({title, kind, format: fmt, items, niche: '', note: '', source: 'upload', createdAt: Date.now(), createdBy: S.me || null}); ok++; }
    catch (e) { toast('Enregistrement : ' + errMsg(e), true); }
  }
  S.upload = null; if (S.view === 'medias') render(); refreshUsage();
  if (ok) toast(ok > 1 ? `${ok} médias ajoutés.` : 'Média ajouté.');
}

// ---------- Zernio : publication sur les réseaux ----------
const ZN = 'Zernio';
const Z_PLAT = {Instagram: 'instagram', Facebook: 'facebook', TikTok: 'tiktok', LinkedIn: 'linkedin'};
const zText = (r) => { const v = r?.payload; if (v == null) return ''; if (typeof v === 'string') return v; if (typeof v.result === 'string') return v.result; return JSON.stringify(v); };
function zErr(e) {
  switch (e?.code) {
    case 'server_not_connected': return 'Ajoutez le connecteur Zernio dans claude.ai › Réglages › Connecteurs.';
    case 'needs_reauth': return 'Reconnectez Zernio dans claude.ai › Réglages › Connecteurs.';
    case 'not_in_manifest': return 'Zernio n’est pas autorisé pour cette page (permissions de l’artifact).';
    case 'blocked_by_policy': return 'Votre organisation bloque cet outil Zernio.';
    case 'selection_required': return 'Choisissez quel connecteur Zernio utiliser (invite claude.ai).';
    case 'server_unavailable': return 'Zernio ne répond pas pour l’instant. Vérifiez dans Zernio avant de réessayer.';
    case 'tool_error': return 'Zernio a refusé : ' + (zText(e.result) || e.message || 'erreur');
    default: return e?.message || e?.code || String(e);
  }
}
async function zAccounts(force) {
  if (!S.mcp) return null;
  if (S.zAcc && !force) return S.zAcc;
  const r = await S.mcp.callTool(ZN, 'accounts_list', {}, {cache: {staleTime: 300000, gcTime: 600000, refresh: !!force}});
  const t = zText(r); const out = [];
  for (const m of t.matchAll(/-\s*([a-z]+):\s*(.+?)\s*\(ID:\s*([A-Za-z0-9_-]+)\)/g)) out.push({platform: m[1], name: m[2], id: m[3]});
  S.zAcc = out; return out;
}
function renderZernio() {
  const box = $('#zernio'); if (!box || !S.ed) return;
  const p = S.ed.draft; const z = p.zernio || null; const zs = S.zs || {};

  const acc = S.zAcc;
  if (!acc && !zs.loading && !zs.err) { S.zs = {...zs, loading: true}; zAccounts().then(() => { S.zs = {}; renderZernio(); }).catch((e) => { S.zs = {err: zErr(e)}; renderZernio(); }); }
  const sel = zs.sel || Object.fromEntries((acc || []).map((a) => [a.id, (p.networks || []).some((n) => Z_PLAT[n] === a.platform)]));
  S.zs = {...S.zs, sel};
  const hist = z ? `<div class="zhist"><b>${z.mode === 'now' ? 'Publié' : 'Programmé'} via Zernio</b> le ${new Date(z.at).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short'})}${z.when ? ` · pour le ${new Date(z.when).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short'})}` : ''}
      <ul>${(z.results || []).map((r) => `<li class="${r.ok ? 'ok' : 'ko'}">${r.ok ? '✓' : '✕'} ${esc(r.platform)} — ${esc(r.msg || '')}</li>`).join('')}</ul></div>` : '';
  const m = mediaById(p.mediaId); const when = p.date ? new Date(p.date) : null; const future = when && when.getTime() > Date.now() + 5 * 60000;
  box.innerHTML = `<h3>Publier avec Zernio <small>Instagram, Facebook… depuis le CRM</small></h3>${hist}
    ${zs.err ? `<div class="zmsg ko">${esc(zs.err)} <button class="btn sm" data-act="z-reload">Réessayer</button></div>` : ''}
    ${!acc ? (zs.err ? '' : '<div style="font-size:13px;color:var(--muted)">Chargement des comptes Zernio…</div>') : `
      <div class="fld"><span class="lb">Comptes</span><div class="chips">${acc.length ? acc.map((a) => `<button type="button" class="chk" data-act="z-acc" data-id="${a.id}" aria-pressed="${!!sel[a.id]}">${esc(a.platform)} · ${esc(a.name)}</button>`).join('') : '<span style="font-size:13px;color:var(--muted)">Aucun compte relié dans Zernio.</span>'}</div></div>

}
async function zUpload(m) {
  // 1) public URL already known for every item → Zernio fetches it itself
  if ((m.items || []).length && m.items.every((it) => it.url)) return m.items.map((it) => it.url);
  // 2) direct upload to Zernio storage (may be blocked by the page sandbox)
  const urls = [];
  try {
    for (const [i, it] of (m.items || []).entries()) {
      S.zs.busy = `Envoi du média vers Zernio${m.items.length > 1 ? ` (${i + 1}/${m.items.length})` : ''}…`; renderZernio();
      const res = await fetch(blob(it.asset)); if (!res.ok) throw new Error('lecture du média impossible (HTTP ' + res.status + ')');
      const data = await res.blob();
      const ct = it.ct || data.type || 'video/mp4';
      const ext = ({'video/mp4': 'mp4', 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp'})[ct] || 'bin';
      const r = await S.mcp.callTool(ZN, 'call_tool', {name: 'media_get_media_presigned_url', arguments: {filename: `growthity-${m.id}-${i + 1}.${ext}`, content_type: ct, size: data.size}}, {cache: false});
      const t = zText(r);
      const up = (t.match(/uploadUrl['"]?\s*:\s*['"]([^'"]+)['"]/) || [])[1]; const pub = (t.match(/publicUrl['"]?\s*:\s*['"]([^'"]+)['"]/) || [])[1];
      if (!up || !pub) throw new Error('Zernio n’a pas fourni d’adresse d’envoi');
      const put = await fetch(up, {method: 'PUT', headers: {'Content-Type': ct}, body: data});

    }
    case 'save': saveEditor(); return;
    case 'st': S.ed.draft.status = d.v; $$('[data-act="st"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === d.v)); markDirty(); return;
    case 'z-acc': { const sel = S.zs.sel || {}; sel[d.id] = !sel[d.id]; S.zs.sel = sel; renderZernio(); return; }
    case 'z-reload': S.zs = {}; S.zAcc = null; zAccounts(true).then(() => renderZernio()).catch((er) => { S.zs = {err: zErr(er)}; renderZernio(); }); S.zs = {loading: true}; renderZernio(); return;
    case 'z-pub': S.zs.confirm = d.mode; S.zs.err = null; renderZernio(); return;
    case 'z-cancel': S.zs.confirm = null; renderZernio(); return;
    case 'z-check': zCheckManual(); return;
    case 'z-abort': { const mu = S.zs.manual; S.zs.manual = null; mu?.reject(new Error('envoi annulé')); return; }
    case 'z-go': { const mode = S.zs.confirm; S.zs.confirm = null; S.zs.busy = 'Préparation…'; renderZernio(); zPublish(mode); return; }
    case 'net': { const n = S.ed.draft.networks ||= []; const on = n.includes(d.v); S.ed.draft.networks = on ? n.filter((x) => x !== d.v) : [...n, d.v]; el.setAttribute('aria-pressed', !on); markDirty(); return; }
    case 'fmt': S.ed.draft.format = d.v; $$('[data-act="fmt"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === d.v)); S.ed.pv = null; markDirty(); refreshPicker(); renderPreview(); return;
    case 'pick': { const same = S.ed.draft.mediaId === d.id; S.ed.draft.mediaId = same ? null : d.id; S.ed.slide = 0; const m = mediaById(d.id);
      if (!same && m) { S.ed.draft.format = m.format; $$('[data-act="fmt"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === m.format)); S.ed.pv = null; if (!S.ed.draft.title.trim()) { S.ed.draft.title = m.title; $('#e-title').value = m.title; } }
      markDirty(); refreshPicker(); renderPreview(); return; }
    case 'when': { const n = Number(d.d); if (!n) S.ed.draft.date = ''; else { S.ed.draft.date = ymd(addDays(new Date(), n)) + 'T18:30'; if (S.ed.draft.type !== 'ad' && ['idea', 'make'].includes(S.ed.draft.status)) S.ed.draft.status = 'sched'; }
      $('#e-date').value = S.ed.draft.date; $$('[data-act="st"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.ed.draft.status)); markDirty(); return; }
    case 'copy': { const t = S.ed.draft.caption || ''; try { await navigator.clipboard.writeText(t); toast('Texte copié.'); } catch { const ta = $('#e-cap'); ta.focus(); ta.select(); toast('Texte sélectionné : copiez avec Ctrl/Cmd + C.'); } return; }
    case 'pv': S.ed.pv = d.v; renderPreview(); return;
    case 'pv-slide': S.ed.slide += Number(d.d); renderPreview(); return;
    case 'pv-vid':
    case 'pv-sound': { S.ed.sound = !S.ed.sound; const v = $('#pv-video'); if (v) { v.muted = !S.ed.sound; if (S.ed.sound) { v.currentTime = 0; v.play().catch(() => {}); } } const sb = $('#pv [data-act="pv-sound"]'); if (sb) sb.textContent = S.ed.sound ? '🔊 Son' : '🔇 Activer le son'; return; }
    case 'cap-more': S.ed.capOpen = true; renderPreview(); return;
    case 'dup': { const c = JSON.parse(JSON.stringify(S.ed.draft)); c.id = uid(); c.title = c.title + ' (copie)'; c.date = ''; c.status = c.type === 'ad' ? 'draft' : 'idea'; c.createdAt = Date.now();
      try { await writePost(c); toast('Copie créée.'); go('post-' + c.id); } catch (er) { toast('Duplication impossible : ' + errMsg(er), true); } return; }
    case 'del': S.ed.confirm = true; render(); return;
    case 'del-no': S.ed.confirm = false; render(); return;
    case 'del-yes': { const p = S.ed.draft; try { await S.db.collection('posts').doc(p.id).delete(); S.ed = null; toast('Supprimé.'); go(p.type === 'ad' ? 'ads' : 'posts'); } catch (er) { toast('Suppression impossible : ' + errMsg(er), true); } return; }
  }
});
document.addEventListener('input', (ev) => {
  if (!S.ed || S.view !== 'post') return; const t = ev.target;
  if (t.dataset.f) { S.ed.draft[t.dataset.f] = t.value; markDirty(); if (t.dataset.f === 'caption') { updCount(); updPreviewCaption(); } }
  if (t.dataset.af) { S.ed.draft.ad ||= {}; S.ed.draft.ad[t.dataset.af] = t.value; markDirty(); if (t.dataset.af === 'cta') renderPreview(); }
});
document.addEventListener('change', async (ev) => { const t = ev.target;
  if (t.dataset?.setst) { const p = postById(t.dataset.setst); if (!p) return; const v = t.value; t.style.setProperty('--c', STATUS[v].c);
    try { await S.db.collection('posts').doc(p.id).update({status: v, updatedAt: Date.now()}); toast('Statut : ' + STATUS[v].l + '.'); } catch (er) { toast('Statut non modifié : ' + errMsg(er), true); render(); } return; }
  if (S.ed && S.view === 'post' && (t.dataset.f || t.dataset.af)) { if (t.dataset.f) S.ed.draft[t.dataset.f] = t.value; else { S.ed.draft.ad ||= {}; S.ed.draft.ad[t.dataset.af] = t.value; } markDirty(); renderPreview(); } });
document.addEventListener('keydown', (ev) => {
  const k = ev.key.toLowerCase();
  if ((ev.metaKey || ev.ctrlKey) && k === 'k') { ev.preventDefault(); S.cmdk ? closeCmdk() : openCmdk(); return; }
  if (S.cmdk) {
    if (k === 'escape') { closeCmdk(); return; }
    if (k === 'arrowdown' || k === 'arrowup') { ev.preventDefault(); S.cmdk.sel = Math.max(0, Math.min(S.cmdk.items.length - 1, S.cmdk.sel + (k === 'arrowdown' ? 1 : -1))); renderCmdk(); return; }
    if (k === 'enter') { ev.preventDefault(); S.cmdk.items[S.cmdk.sel]?.run(); return; }
    return;
  }
  if ((ev.metaKey || ev.ctrlKey) && k === 's' && S.view === 'post') { ev.preventDefault(); saveEditor(); }
  if (k === 'enter' && ev.target.matches('tr[data-act="open"]')) go('post-' + ev.target.dataset.id);
  if (k === 'escape' && S.menuOpen) closeMenu();
  if (k === 'escape' && S.playing) closePlayer();
  if ((k === 'enter' || k === ' ') && ev.target.matches('.pbtn')) { ev.preventDefault(); ev.target.click(); }
});

// drag & drop
document.addEventListener('dragstart', (ev) => { const el = ev.target.closest?.('[data-drag]'); if (!el) return; ev.dataTransfer.setData('text/plain', el.dataset.drag); ev.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); S.dragId = el.dataset.drag; });
document.addEventListener('dragend', (ev) => { ev.target.closest?.('[data-drag]')?.classList.remove('dragging'); S.dragId = null; S.dragJustEnded = true; setTimeout(() => (S.dragJustEnded = false), 80); $$('.over').forEach((x) => x.classList.remove('over')); });
document.addEventListener('dragover', (ev) => { const z = ev.target.closest?.('[data-drop-day],[data-drop-status]'); if (!z || !S.dragId) return; ev.preventDefault(); $$('.over').forEach((x) => x !== z && x.classList.remove('over')); z.classList.add('over'); });
document.addEventListener('drop', async (ev) => {
  const z = ev.target.closest?.('[data-drop-day],[data-drop-status]'); const id = S.dragId; S.dragId = null; if (!z || !id) return; ev.preventDefault(); z.classList.remove('over');
  const p = postById(id); if (!p) return; const upd = {...p};
  if ('dropStatus' in z.dataset) { if (p.status === z.dataset.dropStatus) return; upd.status = z.dataset.dropStatus; }
  else { const day = z.dataset.dropDay; if (!day) { if (!p.date) return; upd.date = ''; } else { const time = p.date ? p.date.slice(11, 16) : '18:30'; if (p.date && p.date.slice(0, 10) === day) return; upd.date = day + 'T' + time; if (upd.type !== 'ad' && ['idea', 'make'].includes(upd.status)) upd.status = 'sched'; } }
  try { await writePost(upd); toast(upd.date !== p.date ? (upd.date ? 'Programmé le ' + new Date(upd.date).toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'}) + '.' : 'Date retirée.') : 'Statut : ' + stOf(upd).l + '.'); }
  catch (er) { toast('Déplacement impossible : ' + errMsg(er), true); }
});
addEventListener('beforeunload', (e) => { if (S.ed?.dirty && !S.ed.isNew) e.preventDefault(); });

boot();
})();
</script>
