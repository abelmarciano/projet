<title>Growthity Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: white rail (brand, Nouveau, rubriques) + working surface; editor = full view with live Instagram preview. Light only. */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --sunk: #EEF0F4;
  --ink: #0F1115;
  --ink-2: #353944;
  --muted: #6A6F7C;
  --line: #E3E5EA;
  --line-2: #D3D6DE;
  --accent: #4F3BE0;
  --accent-2: #3B28C4;
  --accent-soft: #EEEBFF;
  --st-idea: #9097A6;
  --st-make: #E08A12;
  --st-review: #E2543A;
  --st-sched: #2E6BF0;
  --st-live: #14A355;
  --st-pause: #A044E0;
  --danger: #D92D20;
  --shadow-1: 0 1px 2px rgba(15,17,21,.06);
  --shadow-2: 0 1px 2px rgba(15,17,21,.05), 0 8px 24px -12px rgba(15,17,21,.18);
  --shadow-3: 0 2px 6px rgba(15,17,21,.06), 0 24px 60px -24px rgba(15,17,21,.35);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
[hidden] { display: none !important }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100% }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding-block: max(22px, env(safe-area-inset-top, 0px)) 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; background: var(--surface); border-right: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex: none }
.brand b { display: block; font: 800 18px/1 var(--f-display); letter-spacing: -.02em }
.brand small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px }
.newbtn { position: relative }
.nav { display: grid; gap: 2px }
.nav a { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14.5px }
.nav a:hover { background: var(--sunk) }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
.nav a svg { width: 19px; height: 19px; flex: none }
.nav .n { margin-left: auto; font: 600 11.5px var(--f-mono); color: var(--muted); background: var(--sunk); border-radius: 6px; padding: 2px 6px }
.nav a[aria-current="page"] .n { background: #fff; color: var(--accent) }
.rail-foot { margin-top: auto; display: grid; gap: 10px; font-size: 12.5px; color: var(--muted); padding: 0 6px }
.meter { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px }
.tabbar { display: none }

main { min-width: 0; padding-block: 28px 80px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)) }
.page { max-width: 1320px; margin: 0 auto }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 22px }
.ph h1 { margin: 0; font: 800 32px/1.05 var(--f-display); letter-spacing: -.035em }
.ph p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; max-width: 60ch }
.grow { flex: 1 }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: var(--shadow-1); transition: background .12s, border-color .12s }
.btn:hover { border-color: var(--ink-2) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2) }
.btn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2) }
.btn.quiet:hover { background: var(--sunk) }
.btn.danger { color: var(--danger) }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px }
.btn.icon { width: 40px; padding: 0 }
.btn.sm.icon { width: 32px }
.btn svg { width: 17px; height: 17px; flex: none }
.btn[disabled] { opacity: .5; pointer-events: none }
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1) }
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); min-width: 0; flex: 0 1 260px }
.search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; font-size: 14px }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px }

.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--c) 12%, white); color: color-mix(in srgb, var(--c) 75%, black) }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); font-size: 11.5px; font-weight: 700; white-space: nowrap }
.tag.mono { font: 600 11px var(--f-mono) }
.tag.ad { background: var(--ink); color: #fff; letter-spacing: .04em }
.net { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font: 800 10px var(--f-body); flex: none }
.net.Instagram { background: linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF) }
.net.Facebook { background: #1877F2 }
.net.TikTok { background: #111 }
.net.LinkedIn { background: #0A66C2 }
.nets { display: inline-flex; gap: 3px }

.empty { border: 1.5px dashed var(--line-2); border-radius: 16px; padding: 36px 24px; text-align: center; color: var(--muted); background: var(--surface) }
.empty b { display: block; color: var(--ink); font: 800 19px var(--f-display); margin-bottom: 6px; letter-spacing: -.02em }
.empty .btn { margin-top: 14px }
.notice { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px; margin-bottom: 16px }
.skel { background: linear-gradient(90deg, var(--sunk), #F7F8FA, var(--sunk)); background-size: 200% 100%; animation: sk 1.2s infinite linear; border-radius: 12px }
@keyframes sk { to { background-position: -200% 0 } }

.thumb { position: relative; overflow: hidden; background: var(--sunk) }
.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.thumb .ico { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 6px; background: rgba(0,0,0,.55); display: grid; place-items: center }
.thumb .ico svg { width: 13px; height: 13px }

/* ---------- planning ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.cal-head h2 { margin: 0 8px 0 4px; font: 800 22px var(--f-display); letter-spacing: -.02em; text-transform: capitalize; min-width: 190px }
.plan { display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 18px; align-items: start }
.cal { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-1) }
.cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border-bottom: 1px solid var(--line) }
.cal-dow div { padding: 10px 12px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)) }
.day { min-height: 128px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: background .12s }
.day:nth-child(7n) { border-right: 0 }
.day.out { background: #FAFBFC }
.day.out .dn { color: var(--line-2) }
.day.past:not(.today) { background: #FBFBFC }
.day.over { background: var(--accent-soft) }
.day-top { display: flex; align-items: center; justify-content: space-between; padding: 2px 3px 2px 5px }
.dn { font: 600 12.5px var(--f-mono); color: var(--muted) }
.today .dn { background: var(--accent); color: #fff; border-radius: 7px; padding: 2px 7px }
.day .plus { opacity: 0; width: 24px; height: 24px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); display: grid; place-items: center }
.day:hover .plus, .day .plus:focus-visible { opacity: 1 }
.day .plus:hover { background: var(--sunk); color: var(--ink) }
.ev { display: flex; align-items: center; gap: 7px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 3px 7px 3px 3px; text-align: left; min-width: 0; box-shadow: var(--shadow-1); cursor: grab }
.ev:hover { border-color: var(--accent) }
.ev .thumb { width: 26px; height: 32px; border-radius: 6px; flex: none }
.ev .tx { min-width: 0; display: grid; line-height: 1.2 }
.ev .tt { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ev .tm { font: 500 10.5px var(--f-mono); color: var(--muted); display: flex; gap: 5px; align-items: center }
.ev .tm i { width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.ev .ico, .trow .ico, .adn .ico { display: none }
.ev.is-ad { border-left: 3px solid var(--ink) }
.ev.dragging { opacity: .4 }
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px }
.wcol { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 420px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: background .12s }
.wcol.over { background: var(--accent-soft) }
.wcol h4 { margin: 2px 4px 4px; display: flex; justify-content: space-between; align-items: baseline; font: 700 13px var(--f-body); color: var(--muted); text-transform: capitalize }
.wcol h4 b { font: 800 20px var(--f-display); color: var(--ink) }
.wcol.today h4 b { color: var(--accent) }
.wcard { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--surface); text-align: left; padding: 0; display: block; width: 100%; cursor: grab; box-shadow: var(--shadow-1) }
.wcard:hover { border-color: var(--accent) }
.wcard .thumb { aspect-ratio: 4/5 }
.wcard .wb { padding: 7px 8px 8px; display: grid; gap: 5px; justify-items: start }
.wcard .pill { font-size: 11px; height: 21px; padding: 0 7px }
.wcard .tt { font-size: 12.5px; font-weight: 700; line-height: 1.25 }
.wcard .tm { font: 500 11px var(--f-mono); color: var(--muted) }
.tray { position: sticky; top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow-1); max-height: calc(100vh - 40px); overflow: auto }
.tray.over { background: var(--accent-soft) }
.tray h3 { margin: 0 0 4px; font: 800 16px var(--f-display); display: flex; justify-content: space-between; align-items: baseline }
.tray h3 small { font: 600 12px var(--f-mono); color: var(--muted) }
.tray p { margin: 0 0 12px; font-size: 12.5px; color: var(--muted) }
.tray .list { display: grid; gap: 8px }
.trow { display: flex; gap: 10px; align-items: center; width: 100%; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 6px; text-align: left; cursor: grab }
.trow:hover { border-color: var(--accent) }
.trow .thumb { width: 40px; height: 50px; border-radius: 7px; flex: none }
.trow .tt { font-size: 13px; font-weight: 700; line-height: 1.25 }
.trow .meta { display: flex; gap: 5px; align-items: center; margin-top: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }

/* ---------- board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start }
.col { background: var(--sunk); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 220px; transition: background .12s, outline-color .12s; outline: 2px dashed transparent; outline-offset: -2px }
.col.over { background: var(--accent-soft); outline-color: var(--accent) }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 2px; font-weight: 800; font-size: 14px }
.col-h i { width: 9px; height: 9px; border-radius: 50%; background: var(--c) }
.col-h .n { margin-left: auto; font: 600 12px var(--f-mono); color: var(--muted) }
.col .add { border: 1.5px dashed var(--line-2); border-radius: 12px; background: transparent; height: 38px; font-weight: 700; font-size: 13px; color: var(--muted) }
.col .add:hover { color: var(--accent); border-color: var(--accent) }
.card { background: var(--surface); border-radius: 13px; border: 1px solid var(--line); box-shadow: var(--shadow-1); text-align: left; padding: 0; overflow: hidden; display: block; width: 100%; cursor: grab; transition: border-color .12s, box-shadow .12s }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow-2) }
.card.dragging { opacity: .4 }
.card { display: grid; grid-template-columns: 62px minmax(0,1fr); gap: 11px; padding: 9px; align-items: start }
.card .thumb { aspect-ratio: 4/5; border-radius: 8px; width: 62px }
.card .thumb .ico { right: 3px; top: 3px; width: 18px; height: 18px }
.card .cb { display: grid; gap: 6px; min-width: 0 }
.card .tt { font-size: 13.5px; font-weight: 800; line-height: 1.3; letter-spacing: -.005em }
.card .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.card .when { font: 500 11.5px var(--f-mono); color: var(--muted) }
.card .cap { font-size: 12.5px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }

/* ---------- ads ---------- */
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px }
.stat { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; cursor: pointer }
.stat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.stat b { font: 700 14px var(--f-mono) }
.tbl { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow-x: auto; box-shadow: var(--shadow-1) }
table { border-collapse: collapse; width: 100%; min-width: 820px; font-size: 14px }
th { text-align: left; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line) }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle }
tbody tr:last-child td { border-bottom: 0 }
tbody tr { cursor: pointer }
tbody tr:hover td { background: #FAFAFC }
.adn { display: flex; align-items: center; gap: 12px; font-weight: 800 }
.adn .thumb { width: 44px; height: 55px; border-radius: 8px; flex: none }
.adn small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 2px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px }

/* ---------- media ---------- */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 18px 16px; align-items: start }
.mc { border: 0; background: transparent; padding: 0; text-align: left; display: grid; gap: 8px; min-width: 0 }
.mc .thumb { border-radius: 13px; aspect-ratio: var(--ar, 4/5); box-shadow: var(--shadow-2); max-width: 100%; transition: transform .15s }
.mc:hover .thumb { transform: translateY(-2px); outline: 2px solid var(--accent) }
.mc .play { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); display: grid; place-items: center }
.mc .badge { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px }
.mc .badge .tag { background: rgba(255,255,255,.92) }
.mc .tt { font-weight: 800; font-size: 13.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mc .row { display: flex; gap: 5px; flex-wrap: wrap }
.drop { border: 1.5px dashed var(--line-2); border-radius: 16px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--surface); margin-bottom: 18px; color: var(--muted); font-size: 14px; cursor: pointer }
.drop.over { border-color: var(--accent); background: var(--accent-soft) }
.drop b { color: var(--ink) }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; flex-basis: 100% }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }

/* ---------- editor ---------- */
.ed-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; position: sticky; top: 0; z-index: 4; background: var(--bg); padding-block: 10px; margin-top: -10px }
.ed-top h1 { margin: 0; font: 800 24px var(--f-display); letter-spacing: -.03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 }
.saved { font-size: 12.5px; color: var(--muted); font-weight: 600 }
.saved.dirty { color: var(--st-make) }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow-1); display: grid; gap: 16px }
.panel + .panel { margin-top: 16px }
.panel h3 { margin: 0; font: 800 15px var(--f-display); display: flex; align-items: center; gap: 8px }
.panel h3 small { font: 500 12px var(--f-body); color: var(--muted) }
.fld { display: grid; gap: 6px; min-width: 0 }
.fld > label, .fld > .lb { font-size: 12.5px; font-weight: 700; color: var(--ink-2) }
.fld input[type=text], .fld input[type=datetime-local], .fld input:not([type]), .fld select, .fld textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 14.5px; transition: border-color .12s, box-shadow .12s }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.fld textarea { min-height: 200px; resize: vertical; line-height: 1.55 }
.fld .big { font: 800 20px var(--f-display) !important; letter-spacing: -.02em; padding: 10px 12px }
.cnt { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted) }
.cnt .warn { color: var(--st-make); font-weight: 700 }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.r3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chk { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 10px; height: 38px; padding: 0 12px 0 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: var(--surface); user-select: none }
.chk[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent) }
.stsel { display: flex; flex-wrap: wrap; gap: 6px }
.stsel button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px }
.stsel button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c) }
.stsel button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, white); color: color-mix(in srgb, var(--c) 75%, black) }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 2px }
.picker button { border: 2px solid transparent; border-radius: 10px; padding: 0 0 125% 0; height: 0; overflow: hidden; position: relative; background: var(--sunk); display: block; width: 100% }
.picker button img, .picker button video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.picker .ico { display: none }

function thumbInner(m) { const t = thumb(m); return t.replace(/^<div class="thumb" >/, '').replace(/<\/div>$/, ''); }

function guessFormat(w, h) { const r = w / h; return Object.entries({'9:16': 9 / 16, '4:5': 0.8, '1:1': 1, '16:9': 16 / 9}).sort((a, b) => Math.abs(a[1] - r) - Math.abs(b[1] - r))[0][0]; }
function dims(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const done = (v) => { URL.revokeObjectURL(url); res(v); };
    if (file.type.startsWith('video')) { const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.onloadedmetadata = () => done([v.videoWidth || 9, v.videoHeight || 16]); v.onerror = () => done([9, 16]); v.src = url; }
    else { const i = new Image(); i.onload = () => done([i.naturalWidth, i.naturalHeight]); i.onerror = () => done([4, 5]); i.src = url; }
  });
}
async function uploadFiles(files) {
  if (!S.assets) { toast('Import impossible : un accès Éditeur est nécessaire.', true); return; }
  files = files.filter((f) => /^(image\/(png|jpeg|webp)|video\/(mp4|webm))$/.test(f.type));
  if (!files.length) { toast('Formats acceptés : PNG, JPEG, WebP, MP4, WebM.', true); return; }
  const imgs = files.filter((f) => f.type.startsWith('image')).sort((a, b) => a.name.localeCompare(b.name, 'fr', {numeric: true}));
  const groups = [...files.filter((f) => f.type.startsWith('video')).map((v) => [v]), ...(imgs.length ? [imgs] : [])];
  S.upload = {done: 0, total: files.length}; render();
  let ok = 0;
  for (const g of groups) {
    const items = []; let fmt = '4:5';
    for (const f of g) {
      try { const [w, h] = await dims(f); if (!items.length) fmt = guessFormat(w, h); const r = await S.assets.upload(f); items.push({asset: r.id, ct: r.contentType, name: f.name}); }
      catch (e) { toast(`${f.name} : ${errMsg(e)}`, true); }
      S.upload.done++; if (S.view === 'medias') render();
    }
    if (!items.length) continue;
    const kind = isVid(items[0]) ? 'video' : items.length > 1 ? 'carousel' : 'image';
    const title = (g.length > 1 ? 'Carrousel – ' : '') + g[0].name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
    try { await S.db.collection('media').doc(uid()).set({title, kind, format: fmt, items, niche: '', note: '', source: 'upload', createdAt: Date.now(), createdBy: S.me || null}); ok++; }
    catch (e) { toast('Enregistrement : ' + errMsg(e), true); }
  }
  S.upload = null; render(); refreshUsage();
  if (ok) toast(ok > 1 ? `${ok} médias ajoutés.` : 'Média ajouté.');
}

          <div class="fld"><label for="m-note">Notes</label><textarea id="m-note" style="min-height:96px" placeholder="Prompt utilisé, acteur, remarques…">${esc(m.note || '')}</textarea></div>
          <div class="danger-zone"><button class="btn primary" type="submit">Enregistrer</button><span class="grow"></span>
            ${S.assets ? (S.md.confirm ? `<span class="confirm">Supprimer pour tout le monde ?</span><button class="btn danger solid sm" type="button" data-act="md-del-yes">Supprimer</button><button class="btn sm" type="button" data-act="md-del-no">Annuler</button>` : `<button class="btn quiet danger sm" type="button" data-act="md-del">Supprimer</button>`) : ''}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${KINDS[m.kind]}${m.kind === 'carousel' ? ' · ' + m.items.length + ' slides' : ''}</span><span class="tag">${m.source === 'claude' ? 'Généré par Claude' : 'Importé par l’équipe'}</span>${m.createdAt ? `<span class="tag">Ajouté le ${new Date(m.createdAt).toLocaleDateString('fr-FR')}</span>` : ''}</div>
        </form>
        <div class="panel"><h3>Utilisé dans <small>${uses.length}</small></h3>
          ${uses.length ? `<div class="uses">${uses.map((p) => `<button class="use" data-act="open" data-id="${p.id}">${p.type === 'ad' ? '<span class="tag ad">AD</span>' : ''}<span style="font-weight:700;flex:1;min-width:0">${esc(p.title || 'Sans titre')}</span>${pill(stOf(p))}</button>`).join('')}</div>` : '<div style="color:var(--muted);font-size:13.5px">Pas encore utilisé dans un post ou une ad.</div>'}</div>
      </div></div></div>`;
  $('#mform').onsubmit = async (e) => {
    e.preventDefault();
    try { await S.db.collection('media').doc(m.id).update({title: $('#m-title').value.trim() || m.title, format: $('#m-format').value, niche: $('#m-niche').value.trim(), note: $('#m-note').value.trim()}); toast('Média enregistré.'); }
    catch (er) { toast('Enregistrement : ' + errMsg(er), true); }
  };
}

// ---------- editor ----------
function vEditor(main) {
  if (!S.ed) { main.innerHTML = loading() ? `<div class="page">${skeleton(2)}</div>` : `<div class="page"><div class="empty"><b>Post introuvable</b>Il a peut-être été supprimé.<br><a class="btn" href="#posts">Retour aux posts</a></div></div>`; return; }
  const {draft: p, isNew} = S.ed; const isAd = p.type === 'ad'; const map = stMap(p); const ad = p.ad || {};
  const back = isAd ? 'ads' : 'posts';
  main.innerHTML = `<div class="page">
    <div class="ed-top"><a class="btn icon" href="#${back}" aria-label="Retour">${IC.back}</a>
      <h1>${isNew ? (isAd ? 'Nouvelle ad' : 'Nouveau post') : esc(p.title || 'Sans titre')}</h1>
      <span class="saved ${S.ed.dirty ? 'dirty' : ''}" id="savedst">${S.ed.dirty ? 'Modifications non enregistrées' : 'Enregistré'}</span>
      ${isNew ? '' : '<button class="btn" data-act="dup">Dupliquer</button>'}
      <button class="btn primary" data-act="save">Enregistrer</button></div>
    <div class="ed">
      <div>
        <div class="panel">
          <div class="fld"><label for="e-title">Titre interne</label><input id="e-title" class="big" data-f="title" value="${esc(p.title)}" placeholder="${isAd ? 'ex. Ad vidéo bijoux – Emma' : 'ex. Carrousel 5 accroches'}" autocomplete="off"></div>
          <div class="fld"><span class="lb">Statut</span><div class="stsel" role="group" aria-label="Statut">${Object.entries(map).map(([k, s]) => `<button type="button" style="--c:${s.c}" data-act="st" data-v="${k}" aria-pressed="${k === p.status}"><i></i>${s.l}</button>`).join('')}</div></div>
          <div class="r2">
            <div class="fld"><label for="e-date">${isAd ? 'Lancement' : 'Date de publication'}</label><input type="datetime-local" id="e-date" data-f="date" value="${esc(p.date || '')}"></div>
            <div class="fld"><span class="lb">Raccourcis</span><div class="chips"><button type="button" class="btn sm" data-act="when" data-d="1">Demain 18 h 30</button><button type="button" class="btn sm" data-act="when" data-d="0">Effacer</button></div></div>
          </div>
          <div class="fld"><span class="lb">Réseaux</span><div class="chips">${NETS.map((n) => `<button type="button" class="chk" data-act="net" data-v="${n}" aria-pressed="${(p.networks || []).includes(n)}"><span class="net ${n}">${NET_L[n]}</span>${n}</button>`).join('')}</div></div>
          <div class="fld"><span class="lb">Format</span><div class="seg" role="group" aria-label="Format">${FORMATS.map((f) => `<button type="button" data-act="fmt" data-v="${f}" aria-pressed="${f === p.format}">${f} <span style="font-weight:500">${FORMAT_L[f]}</span></button>`).join('')}</div></div>
        </div>
        <div class="panel"><h3>Média <small>${S.media.length} dans la médiathèque · ceux au format choisi d’abord</small></h3><div class="picker" id="picker"></div>
          <div style="font-size:12.5px;color:var(--muted)">Besoin d’un nouveau fichier ? <a href="#medias">Importez-le dans Médias</a>.</div></div>
        <div class="panel"><div class="fld"><label for="e-cap">${isAd ? 'Texte principal de la pub' : 'Légende'}</label>
          <textarea id="e-cap" data-f="caption" placeholder="${isAd ? 'Le texte affiché au-dessus de la pub…' : 'Accroche, corps du texte, appel à l’action, hashtags…'}">${esc(p.caption)}</textarea>
          <div class="cnt"><span id="e-cnt"></span><button type="button" class="btn sm" data-act="copy">Copier le texte</button></div></div></div>
        ${isAd ? `<div class="panel ad-panel"><h3><span class="tag ad">AD</span> Paramètres Meta</h3>
          <div class="r2"><div class="fld"><label for="a-obj">Objectif</label><select id="a-obj" data-af="objective">${OBJ.map((o) => `<option ${o === ad.objective ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
            <div class="fld"><label for="a-budget">Budget par jour (€)</label><input id="a-budget" data-af="budget" inputmode="decimal" value="${esc(ad.budget || '')}" placeholder="ex. 20"></div></div>
          <div class="r2"><div class="fld"><label for="a-cta">Bouton</label><select id="a-cta" data-af="cta">${CTAS.map((o) => `<option ${o === ad.cta ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
            <div class="fld"><label for="a-link">Lien de destination</label><input id="a-link" data-af="link" value="${esc(ad.link || '')}" placeholder="https://growthity.ai"></div></div>
          <div class="fld"><label for="a-aud">Audience</label><input id="a-aud" data-af="audience" value="${esc(ad.audience || '')}" placeholder="ex. e-commerçants, France, 25-55 ans"></div></div>` : ''}
        ${isNew ? '' : `<div class="panel"><div class="danger-zone" id="dz">${S.ed.confirm ? `<span class="confirm">Supprimer définitivement ?</span><button class="btn danger solid sm" data-act="del-yes">Supprimer</button><button class="btn sm" data-act="del-no">Annuler</button>` : `<span style="font-size:13px;color:var(--muted)">Créé le ${new Date(p.createdAt || Date.now()).toLocaleDateString('fr-FR')}</span><span class="grow"></span><button class="btn quiet danger sm" data-act="del">Supprimer ${isAd ? 'l’ad' : 'le post'}</button>`}</div></div>`}
      </div>
      <div class="pv" id="pv"></div>
    </div></div>`;
  refreshPicker(); renderPreview(); updCount();
}
function refreshPicker() {
  const box = $('#picker'); if (!box || !S.ed) return;
  const p = S.ed.draft;
  const list = [...S.media].sort((a, b) => (b.id === p.mediaId) - (a.id === p.mediaId) || (b.format === p.format) - (a.format === p.format));
  box.innerHTML = list.length ? list.map((m) => `<button type="button" data-act="pick" data-id="${m.id}" aria-pressed="${m.id === p.mediaId}" title="${esc(m.title)}">${thumbInner(m)}<span class="lb">${esc(m.format)}${m.kind === 'carousel' ? ' · ' + m.items.length : m.kind === 'video' ? ' · vidéo' : ''}</span><span class="ok">${IC.check}</span></button>`).join('') : '<div style="color:var(--muted);font-size:13px">Aucun média pour l’instant.</div>';
}
function updCount() {
  const el = $('#e-cnt'); if (!el || !S.ed) return;
  const t = S.ed.draft.caption || ''; const tags = (t.match(/#[\p{L}\d_]+/gu) || []).length;
  const isAd = S.ed.draft.type === 'ad';
  el.innerHTML = `${t.length.toLocaleString('fr-FR')} / 2 200 caractères · ${tags} hashtag${tags > 1 ? 's' : ''}` + (tags > 30 ? ' <span class="warn">· 30 max sur Instagram</span>' : '') + (isAd && t.length > 125 ? ' <span class="warn">· au-delà de 125, Meta coupe avec « Voir plus »</span>' : '');
}
function markDirty() { if (!S.ed) return; S.ed.dirty = true; const s = $('#savedst'); if (s) { s.textContent = 'Modifications non enregistrées'; s.classList.add('dirty'); } }

function renderPreview() {
  const box = $('#pv'); if (!box || !S.ed) return;
  const p = S.ed.draft; const m = mediaById(p.mediaId); const isAd = p.type === 'ad';
  const vertical = (S.ed.pv || (p.format === '9:16' ? 'reel' : 'feed')) === 'reel';
  const items = m?.items || []; const i = Math.min(S.ed.slide, Math.max(0, items.length - 1)); const it = items[i];
  const mediaEl = it ? (isVid(it) ? `<video src="${blob(it.asset)}" ${it.poster ? `poster="${blob(it.poster)}"` : ''} muted loop playsinline autoplay preload="metadata"></video>` : `<img src="${blob(it.asset)}" alt="">`) : '';
  const av = `<span class="ig-av"><div>${IC.logo}</div></span>`;
  const cap = (p.caption || '').trim();
  let screen;
  if (vertical) {
    screen = `<div class="reel">${mediaEl || '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:13px">Choisissez un média</div>'}<div class="shade"></div><div class="lbl">${isAd ? 'Sponsorisé' : 'Reels'}</div>
      <div class="side">${IC.heart}${IC.comment}${IC.share}</div>
      <div class="info"><div class="who">${av}growthity.ai</div>${cap ? `<div class="txt">${esc(cap)}</div>` : ''}${isAd ? `<div class="cta">${esc(p.ad?.cta || 'Commencer')}<span>›</span></div>` : ''}</div></div>`;
  } else {
    const ar = AR[m?.format && m.format !== '9:16' ? m.format : p.format === '9:16' ? '4:5' : p.format] || '4/5';
    const short = cap.length > 120 && !S.ed.capOpen;
    screen = `<div class="ig-top">Instagram</div><div class="ig-feed">
      <div class="ig-head">${av}<div class="ig-name">growthity.ai${isAd ? '<small>Sponsorisé</small>' : ''}</div></div>
      <div class="ig-media" style="aspect-ratio:${ar}">${mediaEl || '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#999;font-size:13px">Choisissez un média</div>'}
        ${items.length > 1 ? `<span class="count">${i + 1}/${items.length}</span>${i > 0 ? `<button class="arr l" data-act="pv-slide" data-d="-1" aria-label="Précédente">‹</button>` : ''}${i < items.length - 1 ? `<button class="arr r" data-act="pv-slide" data-d="1" aria-label="Suivante">›</button>` : ''}` : ''}</div>
      ${isAd ? `<div class="ig-cta">${esc(p.ad?.cta || 'Commencer')}<span>›</span></div>` : ''}
      <div class="ig-act">${IC.heart}${IC.comment}${IC.share}${items.length > 1 ? `<div class="ig-dots">${items.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>` : '<span class="grow"></span>'}${IC.save}</div>
      <div class="ig-cap">${cap ? `<b>growthity.ai</b> ${esc(short ? cap.slice(0, 120).trimEnd() + '…' : cap)}${short ? ' <button class="more" data-act="cap-more">plus</button>' : ''}` : '<span class="empty-cap">La légende apparaîtra ici.</span>'}</div></div>`;
  }
  box.innerHTML = `<div class="pv-tabs"><span>Aperçu</span><div class="seg" role="group" aria-label="Aperçu"><button data-act="pv" data-v="feed" aria-pressed="${!vertical}">Fil</button><button data-act="pv" data-v="reel" aria-pressed="${vertical}">Reel / Story</button></div></div>
    <div class="phone"><div class="screen">${screen}</div></div>
    <div class="pv-note">Aperçu indicatif d’Instagram${isAd ? ' pour une publicité' : ''}. ${m ? esc(m.title) : ''}</div>`;
}

async function saveEditor() {
  const e = S.ed; if (!e) return;
  const p = e.draft;
  if (!p.title.trim()) { const m = mediaById(p.mediaId); p.title = m ? m.title : (p.type === 'ad' ? 'Ad sans titre' : 'Post sans titre'); const t = $('#e-title'); if (t) t.value = p.title; }
  const btn = $('[data-act="save"]'); if (btn) btn.disabled = true;
  try {
    await writePost(p);
    e.dirty = false; const wasNew = e.isNew; e.isNew = false;
    toast(p.type === 'ad' ? 'Ad enregistrée.' : 'Post enregistré.');
    if (wasNew) { S.param = p.id; history.replaceState(null, '', '#post-' + p.id); }
    render();
  } catch (er) { toast('Enregistrement impossible : ' + errMsg(er), true); if (btn) btn.disabled = false; }
}

// ---------- events ----------
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (S.menuOpen && !ev.target.closest('.newbtn')) { S.menuOpen = false; $('#newmenu').hidden = true; } return; }
  const a = el.dataset.act; const d = el.dataset;
  switch (a) {
    case 'newmenu': S.menuOpen = !S.menuOpen; $('#newmenu').hidden = !S.menuOpen; el.setAttribute('aria-expanded', S.menuOpen); return;
    case 'goupload': S.menuOpen = false; $('#newmenu').hidden = true; go('medias'); setTimeout(() => $('#file')?.click(), 60); return;
    case 'new':
      ev.preventDefault(); ev.stopPropagation();
      if (S.ed?.dirty && S.view === 'post' && !S.ed.isNew) { if (!(await leaveOk())) return; }
      newDraft(d.type, {date: d.date ? d.date + 'T18:30' : '', status: d.status, mediaId: d.media}); return;
    case 'open': if (S.dragJustEnded) return; go('post-' + d.id); return;
    case 'media': go('media-' + d.id); return;
    case 'cal-prev': case 'cal-next': { const k = a === 'cal-prev' ? -1 : 1; if (S.calMode === 'month') S.month = new Date(S.month.getFullYear(), S.month.getMonth() + k, 1); else S.weekStart = addDays(S.weekStart, 7 * k); render(); return; }
    case 'cal-today': S.month = som(new Date()); S.weekStart = sow(new Date()); render(); return;
    case 'cal-mode': S.calMode = d.mode; if (d.mode === 'week') S.weekStart = sow(S.month.getMonth() === new Date().getMonth() && S.month.getFullYear() === new Date().getFullYear() ? new Date() : S.month); render(); return;
    case 'netf': S.netFilter = d.net; render(); return;
    case 'adf': S.adFilter = d.st; render(); return;
    case 'mff': S.mf.format = d.v; render(); return;
    case 'mfk': S.mf.kind = d.v; render(); return;
    case 'md-slide': { const m = mediaById(S.md.id); S.md.slide = (S.md.slide + Number(d.d) + m.items.length) % m.items.length; renderMediaDetail(); return; }
    case 'md-go': S.md.slide = Number(d.i); renderMediaDetail(); return;
    case 'md-del': S.md.confirm = true; renderMediaDetail(); return;
    case 'md-del-no': S.md.confirm = false; renderMediaDetail(); return;
    case 'md-del-yes': {
      const m = mediaById(S.md.id); if (!m) return;
      try {
        for (const it of m.items) { await S.assets.delete(it.asset); if (it.poster) await S.assets.delete(it.poster); }
        for (const p of S.posts.filter((x) => x.mediaId === m.id)) await S.db.collection('posts').doc(p.id).update({mediaId: null});
        await S.db.collection('media').doc(m.id).delete();
        toast('Média supprimé.'); refreshUsage(); go('medias');
      } catch (er) { toast('Suppression impossible : ' + errMsg(er), true); }
      return;
    }
    // editor
    case 'save': saveEditor(); return;
    case 'st': S.ed.draft.status = d.v; $$('[data-act="st"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === d.v)); markDirty(); return;
    case 'net': { const n = S.ed.draft.networks ||= []; const on = n.includes(d.v); S.ed.draft.networks = on ? n.filter((x) => x !== d.v) : [...n, d.v]; el.setAttribute('aria-pressed', !on); markDirty(); return; }
    case 'fmt': S.ed.draft.format = d.v; $$('[data-act="fmt"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === d.v)); S.ed.pv = null; markDirty(); refreshPicker(); renderPreview(); return;
    case 'pick': { const same = S.ed.draft.mediaId === d.id; S.ed.draft.mediaId = same ? null : d.id; S.ed.slide = 0; const m = mediaById(d.id);
      if (!same && m) { S.ed.draft.format = m.format; $$('[data-act="fmt"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === m.format)); S.ed.pv = null; if (!S.ed.draft.title.trim()) { S.ed.draft.title = m.title; $('#e-title').value = m.title; } }
      markDirty(); refreshPicker(); renderPreview(); return; }
    case 'when': { if (d.d === '0') S.ed.draft.date = ''; else { const t = addDays(new Date(), 1); S.ed.draft.date = ymd(t) + 'T18:30'; if (S.ed.draft.status === 'idea' || S.ed.draft.status === 'make') { S.ed.draft.status = S.ed.draft.type === 'ad' ? S.ed.draft.status : 'sched'; } }
      $('#e-date').value = S.ed.draft.date; $$('[data-act="st"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.ed.draft.status)); markDirty(); return; }
    case 'copy': { const t = S.ed.draft.caption || ''; const fb = () => { const ta = $('#e-cap'); ta.focus(); ta.select(); toast('Texte sélectionné : copiez avec Ctrl/Cmd + C.'); };
      try { await navigator.clipboard.writeText(t); toast('Texte copié.'); } catch { fb(); } return; }
    case 'pv': S.ed.pv = d.v; renderPreview(); return;
    case 'pv-slide': S.ed.slide += Number(d.d); renderPreview(); return;
    case 'cap-more': S.ed.capOpen = true; renderPreview(); return;
    case 'dup': { const c = JSON.parse(JSON.stringify(S.ed.draft)); c.id = uid(); c.title = c.title + ' (copie)'; c.date = ''; c.status = c.type === 'ad' ? 'draft' : 'idea'; c.createdAt = Date.now();
      try { await writePost(c); toast('Copie créée.'); go('post-' + c.id); } catch (er) { toast('Duplication impossible : ' + errMsg(er), true); } return; }
    case 'del': S.ed.confirm = true; render(); return;
    case 'del-no': S.ed.confirm = false; render(); return;
    case 'del-yes': { const p = S.ed.draft; try { await S.db.collection('posts').doc(p.id).delete(); S.ed = null; toast('Supprimé.'); go(p.type === 'ad' ? 'ads' : 'posts'); } catch (er) { toast('Suppression impossible : ' + errMsg(er), true); } return; }
  }
});
async function leaveOk() { return true; }
document.addEventListener('input', (ev) => {
  if (!S.ed || S.view !== 'post') return;
  const t = ev.target;
  if (t.dataset.f) { S.ed.draft[t.dataset.f] = t.value; markDirty(); if (t.dataset.f === 'caption') { updCount(); renderPreview(); } }
  if (t.dataset.af) { S.ed.draft.ad ||= {}; S.ed.draft.ad[t.dataset.af] = t.value; markDirty(); if (t.dataset.af === 'cta') renderPreview(); }
});
document.addEventListener('change', (ev) => { const t = ev.target; if (S.ed && S.view === 'post' && (t.dataset.f || t.dataset.af)) { if (t.dataset.f) S.ed.draft[t.dataset.f] = t.value; else { S.ed.draft.ad ||= {}; S.ed.draft.ad[t.dataset.af] = t.value; } markDirty(); renderPreview(); } });
document.addEventListener('keydown', (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's' && S.view === 'post') { ev.preventDefault(); saveEditor(); }
  if (ev.key === 'Enter' && ev.target.matches('tr[data-act="open"]')) go('post-' + ev.target.dataset.id);
  if (ev.key === 'Escape' && S.menuOpen) { S.menuOpen = false; $('#newmenu').hidden = true; }
});

// drag & drop: planning days / tray, board columns
document.addEventListener('dragstart', (ev) => { const el = ev.target.closest?.('[data-drag]'); if (!el) return; ev.dataTransfer.setData('text/plain', el.dataset.drag); ev.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); S.dragId = el.dataset.drag; });
document.addEventListener('dragend', (ev) => { ev.target.closest?.('[data-drag]')?.classList.remove('dragging'); S.dragJustEnded = true; setTimeout(() => (S.dragJustEnded = false), 80); $$('.over').forEach((x) => x.classList.remove('over')); });
document.addEventListener('dragover', (ev) => { const z = ev.target.closest?.('[data-drop-day],[data-drop-status]'); if (!z || !S.dragId) return; ev.preventDefault(); $$('.over').forEach((x) => x !== z && x.classList.remove('over')); z.classList.add('over'); });
document.addEventListener('drop', async (ev) => {
  const z = ev.target.closest?.('[data-drop-day],[data-drop-status]'); const id = S.dragId; S.dragId = null; if (!z || !id) return; ev.preventDefault(); z.classList.remove('over');
  const p = postById(id); if (!p) return;
  const upd = {...p};
  if ('dropStatus' in z.dataset) { if (p.status === z.dataset.dropStatus) return; upd.status = z.dataset.dropStatus; }
  else { const day = z.dataset.dropDay; if (!day) { if (!p.date) return; upd.date = ''; } else { const time = p.date ? p.date.slice(11, 16) : '18:30'; if (p.date && p.date.slice(0, 10) === day) return; upd.date = day + 'T' + time; if (upd.type !== 'ad' && ['idea', 'make'].includes(upd.status)) upd.status = 'sched'; } }
  try { await writePost(upd); toast(upd.date !== p.date ? (upd.date ? 'Programmé le ' + new Date(upd.date).toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'}) + '.' : 'Date retirée.') : 'Statut : ' + stOf(upd).l + '.'); }
  catch (er) { toast('Déplacement impossible : ' + errMsg(er), true); }
});
addEventListener('beforeunload', (e) => { if (S.ed?.dirty && !S.ed.isNew) { e.preventDefault(); } });

boot();
})();
</script>
