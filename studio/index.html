<title>Growthity Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: quiet rail + editorial surface. Visual-first: every creative shown whole on a blurred bed of itself. Light only. */
:root {
  --bg: #F4F4F6;
  --panel: #FFFFFF;
  --rail: #FAFAFB;
  --sunk: #EDEDF1;
  --ink: #0B0B10;
  --ink-2: #34353F;
  --muted: #74767F;
  --faint: #A3A5AD;
  --line: #E6E6EB;
  --line-2: #D6D7DE;
  --accent: #5B3DF5;
  --accent-2: #4A2EE0;
  --accent-soft: #EFECFF;
  --glow-a: #7B61FF;
  --glow-b: #FF6FA4;
  --st-idea: #9196A3;
  --st-make: #E8891A;
  --st-review: #EF5A3C;
  --st-sched: #2F6BFF;
  --st-live: #12A150;
  --st-pause: #A24CF0;
  --danger: #DC2E22;
  --sh-1: 0 1px 2px rgba(11,11,16,.05);
  --sh-2: 0 1px 2px rgba(11,11,16,.04), 0 10px 30px -14px rgba(11,11,16,.22);
  --sh-3: 0 2px 8px rgba(11,11,16,.06), 0 30px 70px -28px rgba(11,11,16,.38);
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; letter-spacing: -.003em }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
::selection { background: var(--accent-soft) }
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
.serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: -.01em }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.grow { flex: 1 }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0,1fr); min-height: 100% }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding-block: max(16px, env(safe-area-inset-top, 0px)) 14px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; background: var(--rail); border-right: 1px solid var(--line) }
.ws { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px }
.ws .mk { width: 34px; height: 34px; border-radius: 10px; background: radial-gradient(120% 120% at 0% 0%, var(--glow-a), var(--accent) 55%, #2A17A8); display: grid; place-items: center; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 14px -6px rgba(91,61,245,.7) }
.ws b { display: block; font-weight: 700; font-size: 14.5px; letter-spacing: -.01em }
.ws small { display: block; font-size: 12px; color: var(--muted) }
.kbtn { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 10px; margin: 6px 0 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); font-size: 13.5px; box-shadow: var(--sh-1); width: 100% }
.kbtn:hover { border-color: var(--line-2); color: var(--ink-2) }
.kbtn kbd { margin-left: auto; font: 500 11px var(--f-mono); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--rail) }
.kbtn svg { width: 15px; height: 15px }
.rail h6 { margin: 14px 10px 4px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .09em }
.nav { display: grid; gap: 1px }
.nav a, .nav button { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; border: 0; background: transparent; width: 100%; text-align: left; transition: background .15s }
.nav a:hover, .nav button:hover { background: var(--sunk) }
.nav a[aria-current="page"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--sh-1), inset 0 0 0 1px var(--line) }
.nav a[aria-current="page"] svg { color: var(--accent) }
.nav svg { width: 17px; height: 17px; flex: none; color: var(--muted) }
.nav .n { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--faint) }
.rail-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12px; color: var(--muted); padding: 12px 10px 4px; border-top: 1px solid var(--line) }
.meter { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--glow-b)); border-radius: 2px }
.tabbar { display: none }

main { min-width: 0; padding-block: 30px 90px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)) }
.page { max-width: 1340px; margin: 0 auto; animation: in .35s var(--ease) both }
@keyframes in { from { opacity: 0; transform: translateY(6px) } }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 18px; margin-bottom: 24px }
.eyebrow { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center }
.ph h1 { margin: 0; font: 650 34px/1.05 var(--f-ui); letter-spacing: -.04em; text-wrap: balance }
.ph h1 .serif { font-size: 1.12em; color: var(--accent) }
.ph p { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; max-width: 62ch }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 600; font-size: 13.5px; white-space: nowrap; box-shadow: var(--sh-1); transition: background .15s, border-color .15s, transform .1s, box-shadow .15s; text-decoration: none }
.btn:hover { border-color: #BFC1CA; box-shadow: var(--sh-2) }
.btn:active { transform: translateY(1px) }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff }
.btn.primary:hover { background: #22222B }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 8px 18px -10px rgba(91,61,245,.8) }
.btn.accent:hover { background: var(--accent-2) }
.btn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2) }
.btn.quiet:hover { background: var(--sunk) }
.btn.danger { color: var(--danger) }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff }
.btn.sm { height: 31px; padding: 0 11px; font-size: 12.5px; border-radius: 8px }
.btn.icon { width: 38px; padding: 0 }
.btn.sm.icon { width: 31px }
.btn svg { width: 16px; height: 16px; flex: none }
.btn[disabled] { opacity: .5; pointer-events: none }
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 11px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--muted); transition: background .15s, color .15s }
.seg button:hover { color: var(--ink) }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--sh-1) }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); min-width: 0; flex: 0 1 280px; box-shadow: var(--sh-1) }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; font-size: 13.5px }
.search svg { width: 15px; height: 15px; color: var(--muted); flex: none }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px }

.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: color-mix(in srgb, var(--c) 11%, white); color: color-mix(in srgb, var(--c) 72%, black) }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 22%, transparent) }
.tag { display: inline-flex; align-items: center; height: 21px; padding: 0 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); font-size: 11.5px; font-weight: 600; white-space: nowrap }
.tag.mono { font: 500 11px var(--f-mono) }
.tag.ad { background: var(--ink); color: #fff; letter-spacing: .06em; font-size: 10.5px; font-weight: 700 }
.net { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; color: #fff; font: 700 9px var(--f-ui); flex: none }
.net.Instagram { background: linear-gradient(135deg,#F9A13A,#E1306C 50%,#833AB4) }
.net.Facebook { background: #1877F2 }
.net.TikTok { background: #111 }
.net.LinkedIn { background: #0A66C2 }
.nets { display: inline-flex; gap: 3px }

.empty { border: 1px dashed var(--line-2); border-radius: 18px; padding: 40px 24px; text-align: center; color: var(--muted); background: var(--panel) }
.empty b { display: block; color: var(--ink); font-size: 18px; font-weight: 650; margin-bottom: 6px; letter-spacing: -.02em }
.empty .btn { margin-top: 14px }
.notice { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 13.5px; margin-bottom: 16px }
.skel { background: linear-gradient(90deg, var(--sunk), #F8F8FA, var(--sunk)); background-size: 200% 100%; animation: sk 1.2s infinite linear; border-radius: 14px }
@keyframes sk { to { background-position: -200% 0 } }

/* cover = the whole creative, never cropped, on a blurred bed of itself */
.cv { position: relative; overflow: hidden; background: #E9E9EE; isolation: isolate }
.cv .bed { position: absolute; inset: -18px; background-size: cover; background-position: center; filter: blur(16px) saturate(1.2); opacity: .85; transform: scale(1.1); z-index: -1 }
.cv img, .cv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block }
.cv.fill img, .cv.fill video { object-fit: cover }
.cv .ico { position: absolute; right: 7px; top: 7px; height: 22px; padding: 0 7px; border-radius: 7px; background: rgba(11,11,16,.62); backdrop-filter: blur(6px); display: inline-flex; align-items: center; gap: 4px; color: #fff; font: 600 10.5px var(--f-ui) }
.cv .ico svg { width: 11px; height: 11px }
.cv .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 12px; font-weight: 600 }

/* ---------- home ---------- */
.hero { position: relative; border-radius: 24px; padding: 30px 32px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--sh-2); overflow: hidden; margin-bottom: 22px; isolation: isolate }
.hero::before { content: ""; position: absolute; inset: auto -10% -60% 40%; height: 120%; background: radial-gradient(closest-side, rgba(123,97,255,.20), transparent), radial-gradient(closest-side at 70% 40%, rgba(255,111,164,.16), transparent); z-index: -1 }
.hero-top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end }
.hero h1 { margin: 0; font: 650 40px/1.02 var(--f-ui); letter-spacing: -.045em }
.hero h1 .serif { font-size: 1.15em; color: var(--accent) }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-top: 24px }
.kpi { text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.7); backdrop-filter: blur(6px); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; transition: border-color .15s, transform .15s }
.kpi:hover { border-color: var(--line-2); transform: translateY(-1px) }
.kpi b { font: 600 28px/1.1 var(--f-ui); letter-spacing: -.04em; font-variant-numeric: tabular-nums }
.kpi span { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px }
.kpi span i { width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.ribbon { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; margin-bottom: 22px }
.rday { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; min-height: 168px; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: var(--sh-1); transition: background .15s }
.rday.over { background: var(--accent-soft) }
.rday.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.rday h5 { margin: 0 2px; display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: capitalize }
.rday h5 b { font: 600 22px var(--f-ui); letter-spacing: -.04em; color: var(--ink) }
.rday.today h5 b { color: var(--accent) }
.rtile { border: 0; padding: 0; background: transparent; text-align: left; display: grid; gap: 5px; cursor: grab }
.rtile .cv { aspect-ratio: 4/5; border-radius: 10px; box-shadow: var(--sh-1); transition: transform .2s var(--ease) }
.rtile:hover .cv { transform: scale(1.02) }
.rtile .tt { font-size: 12px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.rtile .tm { font: 500 10.5px var(--f-mono); color: var(--muted); display: flex; gap: 5px; align-items: center }
.rtile .tm i { width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.radd { margin-top: auto; border: 1px dashed var(--line-2); border-radius: 10px; background: transparent; height: 32px; color: var(--faint); font-weight: 600; font-size: 12px }
.radd:hover { color: var(--accent); border-color: var(--accent) }
.split { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); gap: 18px; align-items: start }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--sh-1) }
.box + .box { margin-top: 18px }
.box-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px }
.box-h h3 { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -.02em }
.box-h small { font: 500 12px var(--f-mono); color: var(--faint) }
.box-h a { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none }
.list { display: grid }
.li { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 10px 6px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; border-radius: 0; transition: background .15s }
.li:first-child { border-top: 0 }
.li:hover { background: #FAFAFC }
.li .cv { width: 52px; aspect-ratio: 4/5; border-radius: 9px }
.li .cv .ico, .mini .cv .ico, .rtile .cv .ico { display: none }
.li .tt { font-weight: 600; font-size: 14px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.li .sub { display: flex; gap: 6px; align-items: center; margin-top: 4px; color: var(--muted); font-size: 12px }
.li .when { text-align: right; font: 500 12px var(--f-mono); color: var(--ink-2) }
.li .when small { display: block; color: var(--faint); font-size: 11px }
.mini { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.mini button { border: 0; padding: 0; background: transparent; border-radius: 10px; overflow: hidden }
.mini .cv { aspect-ratio: 4/5; border-radius: 10px; transition: transform .2s var(--ease) }
.mini button:hover .cv { transform: scale(1.03) }

/* ---------- planning ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px }
.cal-head h2 { margin: 0 10px 0 6px; font: 650 22px var(--f-ui); letter-spacing: -.035em; text-transform: capitalize; min-width: 210px }
.plan { display: grid; grid-template-columns: minmax(0,1fr) 288px; gap: 18px; align-items: start }
.cal { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--panel); box-shadow: var(--sh-1) }
.cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border-bottom: 1px solid var(--line); background: #FBFBFC }
.cal-dow div { padding: 10px 12px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .1em }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)) }
.day { min-height: 136px; padding: 7px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; min-width: 0; transition: background .15s }
.day:nth-child(7n) { border-right: 0 }
.day:nth-child(7n), .day:nth-child(7n-1) { background: #FCFCFD }
.day.out { background: #F9F9FA }
.day.out .dn { color: #C9CAD1 }
.day.over { background: var(--accent-soft) !important }
.day-top { display: flex; align-items: center; justify-content: space-between; padding: 1px 2px 1px 4px }
.dn { font: 500 12px var(--f-mono); color: var(--muted); min-width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 7px }
.today .dn { background: var(--accent); color: #fff }
.day .plus { opacity: 0; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; transition: opacity .15s }
.day:hover .plus, .day .plus:focus-visible { opacity: 1 }
.day .plus:hover { background: var(--sunk); color: var(--ink) }
.ev { display: flex; align-items: center; gap: 7px; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 3px 6px 3px 3px; text-align: left; min-width: 0; box-shadow: var(--sh-1); cursor: grab; transition: border-color .15s, transform .15s }
.ev:hover { border-color: var(--accent); transform: translateY(-1px) }
.ev .cv { width: 26px; height: 32px; border-radius: 6px; flex: none }
.ev .cv .ico { display: none }
.ev .tx { min-width: 0; display: grid; line-height: 1.2 }
.ev .tt { font-size: 11.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ev .tm { font: 500 10px var(--f-mono); color: var(--muted); display: flex; gap: 5px; align-items: center }
.ev .tm i { width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.ev.is-ad { box-shadow: inset 3px 0 0 var(--ink), var(--sh-1) }
.dragging { opacity: .35 }
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px }
.tray { position: sticky; top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--sh-1); max-height: calc(100vh - 40px); overflow: auto; transition: background .15s }
.tray.over { background: var(--accent-soft) }
.tray h3 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: baseline }
.tray h3 small { font: 500 12px var(--f-mono); color: var(--faint) }
.tray p { margin: 3px 0 12px; font-size: 12.5px; color: var(--muted) }
.tray .tl { display: grid; gap: 6px }
.trow { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; width: 100%; border: 1px solid transparent; border-radius: 12px; background: transparent; padding: 5px; text-align: left; cursor: grab; transition: background .15s, border-color .15s }
.trow:hover { background: #FAFAFC; border-color: var(--line) }
.trow .cv { width: 40px; aspect-ratio: 4/5; border-radius: 7px }
.trow .cv .ico { display: none }
.trow .tt { font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.trow .meta { display: flex; gap: 5px; align-items: center; margin-top: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }

/* ---------- board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(196px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: start }
.col { border-radius: 18px; padding: 8px; display: flex; flex-direction: column; gap: 10px; min-height: 260px; background: color-mix(in srgb, var(--c) 5%, #EEEEF2); transition: background .15s, outline-color .15s; outline: 2px dashed transparent; outline-offset: -2px }
.col.over { background: var(--accent-soft); outline-color: var(--accent) }
.col-h { display: flex; align-items: center; gap: 8px; padding: 6px 6px 2px; font-weight: 650; font-size: 13.5px; letter-spacing: -.01em }
.col-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent) }
.col-h .n { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--muted); background: var(--panel); border-radius: 6px; padding: 1px 7px }
.col .add { border: 1px dashed var(--line-2); border-radius: 12px; background: transparent; height: 36px; font-weight: 600; font-size: 12.5px; color: var(--muted) }
.col .add:hover { color: var(--accent); border-color: var(--accent); background: var(--panel) }
.card { background: var(--panel); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--sh-1); text-align: left; padding: 0; overflow: hidden; display: block; width: 100%; cursor: grab; transition: border-color .15s, box-shadow .2s, transform .2s var(--ease) }
.card:hover { border-color: var(--line-2); box-shadow: var(--sh-2); transform: translateY(-2px) }
.card .cv { aspect-ratio: 16/11 }
.card .cb { padding: 10px 12px 12px; display: grid; gap: 7px }
.card .tt { font-size: 13.5px; font-weight: 650; line-height: 1.3; letter-spacing: -.012em }
.card .row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap }
.card .ft { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding-top: 7px; border-top: 1px solid var(--line) }
.card .when { font: 500 11px var(--f-mono); color: var(--muted) }
.card .cap { font-size: 12px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }

/* ---------- ads ---------- */
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.stat { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; height: 38px; padding: 0 12px; display: flex; gap: 9px; align-items: center; font-size: 13px; font-weight: 600; box-shadow: var(--sh-1) }
.stat:hover { border-color: var(--line-2) }
.stat[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) }
.stat b { font: 500 12.5px var(--f-mono); color: var(--muted) }
.tbl { border: 1px solid var(--line); border-radius: 20px; background: var(--panel); overflow-x: auto; box-shadow: var(--sh-1) }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13.5px }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); padding: 13px 16px; border-bottom: 1px solid var(--line); background: #FBFBFC }
td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle }
tbody tr:last-child td { border-bottom: 0 }
tbody tr { cursor: pointer; transition: background .12s }
tbody tr:hover td { background: #FAFAFC }
.adn { display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: -.01em }
.adn .cv { width: 44px; height: 55px; border-radius: 8px; flex: none }
.adn .cv .ico { display: none }
.adn small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 2px }

/* ---------- medias ---------- */
.masonry { columns: 5 210px; column-gap: 16px }
.mc { break-inside: avoid; display: block; width: 100%; margin-bottom: 18px; border: 0; background: transparent; padding: 0; text-align: left }
.mc .frame { position: relative; border-radius: 14px; overflow: hidden; box-shadow: var(--sh-2); background: var(--sunk); transition: transform .25s var(--ease), box-shadow .25s }
.mc:hover .frame { transform: translateY(-3px); box-shadow: var(--sh-3) }
.mc .frame img { width: 100%; height: auto; display: block }
.mc .ov { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(11,11,16,.66), transparent 46%); opacity: 0; transition: opacity .2s; display: flex; align-items: flex-end; padding: 12px; color: #fff; font-size: 12.5px; font-weight: 600 }
.mc:hover .ov, .mc:focus-visible .ov { opacity: 1 }
.mc .badge { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px }
.mc .badge span { height: 22px; padding: 0 8px; border-radius: 7px; background: rgba(255,255,255,.92); backdrop-filter: blur(6px); font: 600 11px var(--f-ui); display: inline-flex; align-items: center; gap: 4px; color: var(--ink) }
.mc .play { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.22); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.4); display: grid; place-items: center }
.mc .meta { padding: 9px 2px 0; display: grid; gap: 5px }
.mc .tt { font-weight: 600; font-size: 13px; line-height: 1.3; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mc .row { display: flex; gap: 5px; flex-wrap: wrap }
.drop { border: 1px dashed var(--line-2); border-radius: 18px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--panel); margin-bottom: 20px; color: var(--muted); font-size: 13.5px; cursor: pointer; transition: background .15s, border-color .15s }
.drop:hover { border-color: #BFC1CA }
.drop.over { border-color: var(--accent); background: var(--accent-soft) }
.drop b { color: var(--ink); font-weight: 600 }
.progress { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; flex-basis: 100% }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }

/* ---------- editor ---------- */
.ed-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; position: sticky; top: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); padding-block: 12px; margin-top: -12px }
.crumb { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; gap: 6px; align-items: center }
.crumb a { text-decoration: none } .crumb a:hover { color: var(--ink) }
.ed-top h1 { margin: 0; font: 650 22px var(--f-ui); letter-spacing: -.035em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.saved { font-size: 12px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center }
.saved::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--st-live) }
.saved.dirty::before { background: var(--st-make) }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 26px; align-items: start }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--sh-1); display: grid; gap: 18px }
.panel + .panel { margin-top: 16px }
.panel h3 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px }
.panel h3 small { font-weight: 500; font-size: 12px; color: var(--muted) }
.fld { display: grid; gap: 7px; min-width: 0 }
.fld > label, .fld > .lb { font-size: 12px; font-weight: 600; color: var(--muted) }
.fld input[type=text], .fld input[type=datetime-local], .fld input:not([type]), .fld select, .fld textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 11px; background: var(--panel); padding: 10px 12px; font-size: 14px; transition: border-color .15s, box-shadow .15s }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.fld textarea { min-height: 220px; resize: vertical; line-height: 1.6 }
.titlein { border: 0 !important; padding: 0 !important; font: 650 26px/1.15 var(--f-ui) !important; letter-spacing: -.04em; box-shadow: none !important; background: transparent !important }
.titlein::placeholder { color: #C4C5CC }
.cnt { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap }
.cnt .warn { color: var(--st-make); font-weight: 600 }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chk { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 10px; height: 36px; padding: 0 12px 0 8px; font-size: 13px; font-weight: 600; background: var(--panel); user-select: none; transition: border-color .15s, background .15s }
.chk[aria-pressed="false"] .net { filter: grayscale(1); opacity: .45 }
.chk[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) }
.stsel { display: flex; flex-wrap: wrap; gap: 6px }
.stsel button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; height: 31px; padding: 0 12px 0 10px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: all .15s }
.stsel button i { width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.stsel button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 11%, white); color: color-mix(in srgb, var(--c) 72%, black); box-shadow: 0 0 0 1px var(--c) }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 9px; max-height: 312px; overflow-y: auto; padding: 3px }
.picker button { border: 0; border-radius: 11px; padding: 0 0 125% 0; height: 0; overflow: hidden; position: relative; background: var(--sunk); display: block; width: 100%; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .15s }
.picker button .cv { position: absolute; inset: 0 }
.picker button .cv .ico { display: none }
.picker button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent), 0 0 0 5px var(--accent-soft) }
.picker .lb { position: absolute; left: 5px; bottom: 5px; font: 500 9.5px var(--f-mono); background: rgba(11,11,16,.66); color: #fff; padding: 2px 5px; border-radius: 5px }
.picker .ok { position: absolute; right: 5px; top: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); display: none; place-items: center }
.picker button[aria-pressed="true"] .ok { display: grid }
.danger-zone { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.confirm { font-size: 13px; font-weight: 600; color: var(--danger) }

/* preview */
.pv { position: sticky; top: 76px; border-radius: 24px; padding: 18px 18px 14px; background: radial-gradient(120% 80% at 50% 0%, #EFEAFF 0%, #F4F4F7 55%), var(--panel); border: 1px solid var(--line); display: grid; gap: 12px; justify-items: center }
.pv-tabs { justify-self: stretch; display: flex; justify-content: space-between; align-items: center }
.pv-tabs span { font-size: 12.5px; font-weight: 600; color: var(--muted) }
.phone { width: 326px; max-width: 100%; border-radius: 46px; background: #0C0C10; padding: 9px; box-shadow: 0 0 0 1.5px #2A2A33 inset, var(--sh-3) }
.screen { border-radius: 38px; overflow: hidden; background: #fff; position: relative; aspect-ratio: 9/19.3; display: flex; flex-direction: column; color: #111; font-size: 13px }
.island { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 20px; background: #0C0C10; z-index: 3 }
.ig-top { height: 72px; padding-top: 38px; display: flex; align-items: center; justify-content: space-between; padding-inline: 14px; font: 600 19px var(--f-serif); font-style: italic; border-bottom: 1px solid #F0F0F0; flex: none }
.ig-top svg { width: 20px; height: 20px }
.ig-feed { overflow-y: auto; flex: 1; scrollbar-width: none }
.ig-head { display: flex; align-items: center; gap: 8px; padding: 9px 11px }
.ig-av { width: 30px; height: 30px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg,#F9A13A,#E1306C,#833AB4); flex: none }
.ig-av div { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; border: 1.5px solid #fff }
.ig-name { font-weight: 600; font-size: 12.5px; line-height: 1.15 }
.ig-name small { display: block; font-weight: 400; font-size: 11px; color: #555 }
.ig-media { position: relative; background: #F2F2F2; overflow: hidden }
.ig-media img, .ig-media video { width: 100%; height: 100%; object-fit: cover; display: block }
.ig-media .count { position: absolute; right: 9px; top: 9px; background: rgba(0,0,0,.62); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px }
.ig-media .arr { position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(255,255,255,.88); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-weight: 700 }
.ig-media .arr.l { left: 8px } .ig-media .arr.r { right: 8px }
.ig-cta { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #F4F6FA; border-bottom: 1px solid #ECECEC; font-weight: 600; font-size: 13px; color: #0B5CD7 }
.ig-act { display: flex; align-items: center; gap: 14px; padding: 9px 12px 4px }
.ig-act svg { width: 22px; height: 22px }
.ig-dots { display: flex; gap: 4px; justify-content: center; flex: 1; margin-right: 50px }
.ig-dots i { width: 6px; height: 6px; border-radius: 50%; background: #CFCFCF }
.ig-dots i.on { background: #0095F6 }
.ig-cap { padding: 4px 12px 16px; font-size: 12.5px; line-height: 1.42; white-space: pre-wrap; word-wrap: break-word }
.ig-cap b { font-weight: 600 }
.ig-cap .more { color: #737373; background: none; border: 0; padding: 0; font-size: 12.5px }
.ig-cap .empty-cap { color: #A0A0A0 }
.reel { position: absolute; inset: 0; background: #000 }
.reel img, .reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.reel .shade { position: absolute; inset: auto 0 0 0; height: 48%; background: linear-gradient(0deg, rgba(0,0,0,.75), transparent) }
.reel .lbl { position: absolute; top: 44px; left: 16px; color: #fff; font: 600 18px var(--f-ui); letter-spacing: -.02em }
.reel .info { position: absolute; left: 12px; right: 56px; bottom: 18px; color: #fff; display: grid; gap: 8px }
.reel .who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px }
.reel .who .ig-av { width: 28px; height: 28px }
.reel .txt { font-size: 12.5px; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap }
.reel .cta { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.95); color: #111; border-radius: 9px; padding: 9px 12px; font-weight: 700; font-size: 13px }
.reel .side { position: absolute; right: 10px; bottom: 30px; display: grid; gap: 18px; justify-items: center; color: #fff }
.reel .side svg { width: 25px; height: 25px }
.snd { position: absolute; left: 10px; bottom: 10px; z-index: 4; border: 0; border-radius: 99px; background: rgba(11,11,16,.72); color: #fff; font: 600 12px var(--f-ui); padding: 7px 12px; backdrop-filter: blur(6px) }
.reel .snd { top: 74px; bottom: auto; left: auto; right: 12px }
.pv-note { font-size: 11.5px; color: var(--muted); text-align: center; max-width: 330px }

/* media detail */
.md { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: start }
.viewer { border-radius: 24px; padding: 22px; display: grid; gap: 14px; justify-items: center; position: relative; overflow: hidden; isolation: isolate; border: 1px solid var(--line); background: #15151B }
.viewer .bed { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) saturate(1.3) brightness(.7); z-index: -1 }
.viewer .stage { position: relative; width: 100%; display: grid; place-items: center }
.viewer .stage img, .viewer .stage video { max-width: 100%; max-height: 68vh; border-radius: 14px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); display: block }
.viewer .nav-b { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.9) }
.viewer .nav-b.l { left: 0 } .viewer .nav-b.r { right: 0 }
.viewer .vf { display: flex; gap: 10px; align-items: center; color: rgba(255,255,255,.8); font-size: 12.5px }
.strip { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 3px }
.strip button { width: 52px; aspect-ratio: 4/5; border-radius: 8px; border: 0; padding: 0; overflow: hidden; flex: none; position: relative; background: #222; opacity: .6; transition: opacity .15s }
.strip button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px #fff }
.strip img { width: 100%; height: 100%; object-fit: cover; display: block }
.uses { display: grid; gap: 6px }
.use { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; background: var(--panel); text-align: left; width: 100% }
.use:hover { border-color: var(--line-2); background: #FAFAFC }

/* command palette + toast */
.cmdk-wrap { position: fixed; inset: 0; z-index: 80; background: rgba(11,11,16,.32); backdrop-filter: blur(3px); display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; animation: fade .15s ease both }
@keyframes fade { from { opacity: 0 } }
.cmdk { width: min(620px, 100%); background: var(--panel); border-radius: 18px; box-shadow: var(--sh-3), 0 0 0 1px var(--line); overflow: hidden; animation: pop .18s var(--ease) both }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.985) } }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line) }
.cmdk-in svg { width: 18px; height: 18px; color: var(--muted) }
.cmdk-in input { border: 0; outline: 0; height: 56px; width: 100%; font-size: 16px; background: transparent }
.cmdk-list { max-height: 52vh; overflow-y: auto; padding: 8px }
.cmdk-g { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .09em; padding: 10px 10px 4px }
.cmdk-it { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 10px; font-size: 14px; font-weight: 500 }
.cmdk-it .cv { width: 30px; height: 37px; border-radius: 6px; flex: none }
.cmdk-it .cv .ico { display: none }
.cmdk-it .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--sunk); display: grid; place-items: center; flex: none }
.cmdk-it .ic svg { width: 16px; height: 16px }
.cmdk-it small { margin-left: auto; color: var(--faint); font-size: 12px }
.cmdk-it[aria-selected="true"] { background: var(--accent-soft) }
.cmdk-empty { padding: 26px; text-align: center; color: var(--muted) }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px 10px 12px; border-radius: 12px; font-weight: 600; font-size: 13.5px; z-index: 90; box-shadow: var(--sh-3); display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 32px); animation: pop .2s var(--ease) both }
.toast i { width: 20px; height: 20px; border-radius: 50%; background: var(--st-live); display: grid; place-items: center; flex: none }
.toast.err { background: var(--danger) }
.toast.err i { background: rgba(255,255,255,.25) }
.newmenu { position: relative }
.menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--sh-3); padding: 6px; z-index: 40; display: grid; gap: 2px; animation: pop .15s var(--ease) both }
.menu button { border: 0; background: transparent; text-align: left; padding: 9px 10px; border-radius: 9px; font-weight: 600; font-size: 13.5px; display: flex; gap: 10px; align-items: center }
.menu button:hover { background: var(--sunk) }
.menu small { display: block; font-weight: 500; font-size: 12px; color: var(--muted) }
.menu .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--sunk); display: grid; place-items: center; flex: none }
.menu .ic svg { width: 16px; height: 16px }

/* redo + categories + drive + launch */
.redo-tag { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 6px; background: #FDECEA; color: #B42318; font-size: 11.5px; font-weight: 700; white-space: nowrap }
.redo-tag::before { content: "↺"; font-weight: 800 }
.redo-box { border: 1px solid #F6C9C3; background: #FFF6F4; border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px }
.redo-box h4 { margin: 0; font-size: 14px; color: #B42318; display: flex; align-items: center; gap: 8px }
.redo-box p { margin: 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap }
.redo-box small { color: var(--muted); font-size: 12px }
.redo-box textarea { width: 100%; min-height: 90px; border: 1px solid #F0B4AB; border-radius: 10px; padding: 10px 12px; font-size: 14px; background: #fff; resize: vertical }
.cat-row { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 20px }
.cat { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); font-size: 12.5px; font-weight: 600; color: var(--ink-2) }
.cat i { width: 8px; height: 8px; border-radius: 50%; background: var(--c) }
.cat small { font: 500 11px var(--f-mono); color: var(--faint) }
.cat[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff }
.cat[aria-pressed="true"] small { color: rgba(255,255,255,.6) }
.cat.redo[aria-pressed="true"] { background: #B42318; border-color: #B42318 }
.cv.drive, .mc .drv { background: radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--c) 55%, white), color-mix(in srgb, var(--c) 85%, black)) }
.cv.drive .dv { position: absolute; inset: 0; display: grid; place-items: center; color: #fff }
.cv.drive .dv svg { width: 34%; max-width: 46px; height: auto; opacity: .9 }
.cv.drive .dl { position: absolute; left: 6px; right: 6px; bottom: 6px; color: #fff; font: 700 10.5px var(--f-ui); text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mc .drv { position: relative; aspect-ratio: 9/16; display: grid; place-items: center; color: #fff; padding: 18px; text-align: center }
.mc .drv b { font-size: 17px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2 }

  bindSearch();
  const inp = $('#file'), drop = $('#drop');

    drop.addEventListener('dragover', (e) => { if (S.dragId) return; e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { if (S.dragId) return; e.preventDefault(); drop.classList.remove('over'); uploadFiles([...e.dataTransfer.files]); });
  }
}
function posterOf(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    const done = (b) => { URL.revokeObjectURL(url); res(b); };
    const t = setTimeout(() => done(null), 8000);
    v.onloadeddata = () => { v.currentTime = Math.min(1.2, (v.duration || 2) / 3); };
    v.onseeked = () => { try { const c = document.createElement('canvas'); const sc = 540 / (v.videoWidth || 540); c.width = 540; c.height = Math.round((v.videoHeight || 960) * sc); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); c.toBlob((b) => { clearTimeout(t); done(b); }, 'image/jpeg', 0.82); } catch { clearTimeout(t); done(null); } };
    v.onerror = () => { clearTimeout(t); done(null); };
    v.src = url;
  });
}
function guessFormat(w, h) { const r = w / h; return Object.entries({'9:16': 9 / 16, '4:5': 0.8, '1:1': 1, '16:9': 16 / 9}).sort((a, b) => Math.abs(a[1] - r) - Math.abs(b[1] - r))[0][0]; }
function dims(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const done = (v) => { URL.revokeObjectURL(url); res(v); };
    if (file.type.startsWith('video')) { const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.onloadedmetadata = () => done([v.videoWidth || 9, v.videoHeight || 16]); v.onerror = () => done([9, 16]); v.src = url; }
    else { const i = new Image(); i.onload = () => done([i.naturalWidth, i.naturalHeight]); i.onerror = () => done([4, 5]); i.src = url; }
  });
}
async function uploadFiles(files) {
  if (!S.assets) { toast('Import impossible : un accès Éditeur est nécessaire.', true); return; }
  files = files.filter((f) => /^(image\/(png|jpeg|webp)|video\/(mp4|webm))$/.test(f.type));
  if (!files.length) { toast('Formats acceptés : PNG, JPEG, WebP, MP4, WebM.', true); return; }
  const imgs = files.filter((f) => f.type.startsWith('image')).sort((a, b) => a.name.localeCompare(b.name, 'fr', {numeric: true}));
  const groups = [...files.filter((f) => f.type.startsWith('video')).map((v) => [v]), ...(imgs.length ? [imgs] : [])];
  S.upload = {done: 0, total: files.length}; if (S.view === 'medias') render();
  let ok = 0;
  for (const g of groups) {
    const items = []; let fmt = '4:5';
    for (const f of g) {
      try {
        const [w, h] = await dims(f); if (!items.length) fmt = guessFormat(w, h);
        const r = await S.assets.upload(f); const it = {asset: r.id, ct: r.contentType, name: f.name};
        if (f.type.startsWith('video')) { const pb = await posterOf(f); if (pb) { try { it.poster = (await S.assets.upload(pb, {type: 'image/jpeg'})).id; } catch {} } }
        items.push(it);
      }
      catch (e) { toast(`${f.name} : ${errMsg(e)}`, true); }
      S.upload.done++; if (S.view === 'medias') render();
    }
    if (!items.length) continue;
    const norm = (n) => n.toLowerCase().replace(/\s*\(\d+\)(?=\.[^.]+$)/, '');
    const match = g.length === 1 && S.media.find((m) => m.drive && !(m.items || []).length && norm(m.drive.file || '') === norm(g[0].name));
    if (match) { try { await S.db.collection('media').doc(match.id).update({items, format: fmt}); ok++; } catch (e) { toast('Enregistrement : ' + errMsg(e), true); } continue; }
    const kind = isVid(items[0]) ? 'video' : items.length > 1 ? 'carousel' : 'image';
    const title = (g.length > 1 ? 'Carrousel – ' : '') + g[0].name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
    try { await S.db.collection('media').doc(uid()).set({title, kind, format: fmt, items, niche: '', note: '', source: 'upload', createdAt: Date.now(), createdBy: S.me || null}); ok++; }
    catch (e) { toast('Enregistrement : ' + errMsg(e), true); }
  }
  S.upload = null; if (S.view === 'medias') render(); refreshUsage();
  if (ok) toast(ok > 1 ? `${ok} médias ajoutés.` : 'Média ajouté.');
}

        ${isNew ? '' : `<div class="panel"><div class="danger-zone" id="dz">${S.ed.confirm ? `<span class="confirm">Supprimer définitivement ?</span><button class="btn danger solid sm" data-act="del-yes">Supprimer</button><button class="btn sm" data-act="del-no">Annuler</button>` : `<span style="font-size:12.5px;color:var(--muted)">Créé le ${new Date(p.createdAt || Date.now()).toLocaleDateString('fr-FR')}</span><span class="grow"></span><button class="btn quiet danger sm" data-act="del">Supprimer ${isAd ? 'l’ad' : 'le post'}</button>`}</div></div>`}
      </div>
      <div class="pv" id="pv"></div>
    </div></div>`;
  refreshPicker(); renderPreview(); updCount();
}
function refreshPicker() {
  const box = $('#picker'); if (!box || !S.ed) return;
  const p = S.ed.draft;
  const list = [...S.media].sort((a, b) => (b.id === p.mediaId) - (a.id === p.mediaId) || (b.format === p.format) - (a.format === p.format));
  box.innerHTML = list.length ? list.map((m) => `<button type="button" data-act="pick" data-id="${m.id}" aria-pressed="${m.id === p.mediaId}" title="${esc(m.title)}">${cover(m)}<span class="lb">${esc(m.format)}${m.kind === 'carousel' ? ' · ' + m.items.length : m.kind === 'video' ? ' · vidéo' : ''}</span><span class="ok">${IC.check}</span></button>`).join('') : '<div style="color:var(--muted);font-size:13px">Aucun média pour l’instant.</div>';
}
function updCount() {
  const el = $('#e-cnt'); if (!el || !S.ed) return;
  const t = S.ed.draft.caption || ''; const tags = (t.match(/#[\p{L}\d_]+/gu) || []).length; const isAd = S.ed.draft.type === 'ad';
  el.innerHTML = `${t.length.toLocaleString('fr-FR')} / 2 200 caractères · ${tags} hashtag${tags > 1 ? 's' : ''}` + (tags > 30 ? ' <span class="warn">· 30 max sur Instagram</span>' : '') + (isAd && t.length > 125 ? ' <span class="warn">· au-delà de 125, Meta coupe avec « Voir plus »</span>' : '');
}
function markDirty() { if (!S.ed) return; S.ed.dirty = true; const s = $('#savedst'); if (s) { s.textContent = 'Non enregistré'; s.classList.add('dirty'); } }
function renderPreview() {
  const box = $('#pv'); if (!box || !S.ed) return;
  const p = S.ed.draft; const m = mediaById(p.mediaId); const isAd = p.type === 'ad';
  const vertical = (S.ed.pv || (p.format === '9:16' ? 'reel' : 'feed')) === 'reel';
  const items = m?.items || []; const i = Math.min(S.ed.slide, Math.max(0, items.length - 1)); const it = items[i];
  const snd = `<button class="snd" data-act="pv-sound" aria-label="${S.ed.sound ? 'Couper le son' : 'Activer le son'}">${S.ed.sound ? '🔊 Son' : '🔇 Activer le son'}</button>`;
  const mediaEl = it ? (isVid(it) ? `<video id="pv-video" src="${blob(it.asset)}" ${it.poster ? `poster="${blob(it.poster)}"` : ''} ${S.ed.sound ? '' : 'muted'} loop playsinline autoplay preload="metadata"></video>${snd}` : `<img src="${blob(it.asset)}" alt="">`) : '';
  const av = `<span class="ig-av"><div>${IC.logo}</div></span>`;
  const cap = (p.caption || '').trim();
  let screen;
  if (vertical) {
    screen = `<div class="reel">${mediaEl || '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:13px">Choisissez un média</div>'}<div class="shade"></div><div class="lbl">${isAd ? 'Sponsorisé' : 'Reels'}</div>
      <div class="side">${IC.heart}${IC.comment}${IC.share}</div>
      <div class="info"><div class="who">${av}growthity.ai</div>${cap ? `<div class="txt">${esc(cap)}</div>` : ''}${isAd ? `<div class="cta">${esc(p.ad?.cta || 'Commencer')}<span>›</span></div>` : ''}</div></div>`;
  } else {
    const ar = (m?.format && m.format !== '9:16' ? m.format : p.format === '9:16' ? '4:5' : p.format).replace(':', '/');
    const short = cap.length > 110 && !S.ed.capOpen;
    screen = `<div class="ig-top"><span>Instagram</span><span style="display:flex;gap:14px">${IC.heart}${IC.share}</span></div><div class="ig-feed">
      <div class="ig-head">${av}<div class="ig-name">growthity.ai${isAd ? '<small>Sponsorisé</small>' : ''}</div></div>
      <div class="ig-media" style="aspect-ratio:${ar}">${mediaEl || '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#999;font-size:13px">Choisissez un média</div>'}
        ${items.length > 1 ? `<span class="count">${i + 1}/${items.length}</span>${i > 0 ? `<button class="arr l" data-act="pv-slide" data-d="-1" aria-label="Précédente">‹</button>` : ''}${i < items.length - 1 ? `<button class="arr r" data-act="pv-slide" data-d="1" aria-label="Suivante">›</button>` : ''}` : ''}</div>
      ${isAd ? `<div class="ig-cta">${esc(p.ad?.cta || 'Commencer')}<span>›</span></div>` : ''}
      <div class="ig-act">${IC.heart}${IC.comment}${IC.share}${items.length > 1 ? `<div class="ig-dots">${items.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>` : '<span class="grow"></span>'}${IC.save}</div>
      <div class="ig-cap">${cap ? `<b>growthity.ai</b> ${esc(short ? cap.slice(0, 110).trimEnd() + '…' : cap)}${short ? ' <button class="more" data-act="cap-more">plus</button>' : ''}` : '<span class="empty-cap">La légende apparaîtra ici.</span>'}</div></div>`;
  }
  box.innerHTML = `<div class="pv-tabs"><span>Aperçu en direct</span><div class="seg" role="group" aria-label="Aperçu"><button data-act="pv" data-v="feed" aria-pressed="${!vertical}">Fil</button><button data-act="pv" data-v="reel" aria-pressed="${vertical}">Reel / Story</button></div></div>
    <div class="phone"><div class="screen"><span class="island"></span>${screen}</div></div>
    <div class="pv-note">Aperçu indicatif${isAd ? ' d’une publicité' : ''} sur Instagram${m ? ' · ' + esc(m.title) : ''}</div>`;
}
function updPreviewCaption() {
  const cap = (S.ed?.draft.caption || '').trim();
  const reelTxt = $('#pv .reel .txt'), feedCap = $('#pv .ig-cap');
  if (!$('#pv video')) { renderPreview(); return; }
  if (reelTxt) reelTxt.textContent = cap;
  else if (feedCap) { const short = cap.length > 110 && !S.ed.capOpen; feedCap.innerHTML = cap ? `<b>growthity.ai</b> ${esc(short ? cap.slice(0, 110).trimEnd() + '…' : cap)}${short ? ' <button class="more" data-act="cap-more">plus</button>' : ''}` : '<span class="empty-cap">La légende apparaîtra ici.</span>'; }
  else renderPreview();
}
async function saveEditor() {
  const e = S.ed; if (!e) return; const p = e.draft;
  if (!p.title.trim()) { const m = mediaById(p.mediaId); p.title = m ? m.title : (p.type === 'ad' ? 'Ad sans titre' : 'Post sans titre'); const t = $('#e-title'); if (t) t.value = p.title; }
  const btn = $('[data-act="save"]'); if (btn) btn.disabled = true;
  try {
    await writePost(p); e.dirty = false; const wasNew = e.isNew; e.isNew = false;
    toast(p.type === 'ad' ? 'Ad enregistrée.' : 'Post enregistré.');
    if (wasNew) { S.param = p.id; history.replaceState(null, '', '#post-' + p.id); }
    render();
  } catch (er) { toast('Enregistrement impossible : ' + errMsg(er), true); if (btn) btn.disabled = false; }
}

// ---------- command palette ----------
function openCmdk() { S.cmdk = {q: '', sel: 0}; renderCmdk(); $('#cmdk-q')?.focus(); }
function closeCmdk() { S.cmdk = null; $('#cmdk').innerHTML = ''; }
function cmdkItems() {
  const q = S.cmdk.q.trim().toLowerCase(); const m = (t) => !q || t.toLowerCase().includes(q);
  const acts = [
    {g: 'Actions', l: 'Nouveau post', ic: IC.post, run: () => newDraft('post')},
    {g: 'Actions', l: 'Nouvelle ad', ic: IC.ad, run: () => newDraft('ad')},
    {g: 'Actions', l: 'Importer des médias', ic: IC.upload, run: () => { closeCmdk(); go('medias'); setTimeout(() => $('#file')?.click(), 80); }},
    ...VIEWS.map((v) => ({g: 'Aller à', l: v.l, ic: SVG(v.i), run: () => { closeCmdk(); go(v.v); }})),
  ].filter((a) => m(a.l));
  const posts = S.posts.filter((p) => m(p.title + ' ' + (p.caption || ''))).slice(0, 7).map((p) => ({g: p.type === 'ad' ? 'Ads' : 'Posts', l: p.title || 'Sans titre', cv: cover(mediaById(p.mediaId)), sub: stOf(p).l, run: () => { closeCmdk(); go('post-' + p.id); }}));
  const meds = S.media.filter((x) => m(x.title + ' ' + (x.niche || ''))).slice(0, 6).map((x) => ({g: 'Médias', l: x.title, cv: cover(x), sub: x.format, run: () => { closeCmdk(); go('media-' + x.id); }}));
  return [...acts, ...posts, ...meds];
}
function renderCmdk() {
  if (!S.cmdk) return;
  const items = cmdkItems(); S.cmdk.items = items; S.cmdk.sel = Math.min(S.cmdk.sel, Math.max(0, items.length - 1));
  let g = ''; const rows = items.map((it, i) => { const h = it.g !== g ? `<div class="cmdk-g">${it.g}</div>` : ''; g = it.g; return h + `<button class="cmdk-it" data-act="cmdk-run" data-i="${i}" aria-selected="${i === S.cmdk.sel}">${it.cv || `<span class="ic">${it.ic}</span>`}<span>${esc(it.l)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</button>`; }).join('');
  const has = $('#cmdk-q');
  if (!has) {
    $('#cmdk').innerHTML = `<div class="cmdk-wrap" data-act="cmdk-bg"><div class="cmdk" role="dialog" aria-label="Recherche"><div class="cmdk-in">${IC.search}<input id="cmdk-q" placeholder="Rechercher un post, une ad, un média ou une action…" autocomplete="off"></div><div class="cmdk-list" id="cmdk-list"></div></div></div>`;
    $('#cmdk-q').oninput = (e) => { S.cmdk.q = e.target.value; S.cmdk.sel = 0; renderCmdk(); };
  }
  $('#cmdk-list').innerHTML = rows || '<div class="cmdk-empty">Aucun résultat.</div>';
  $('#cmdk-list [aria-selected="true"]')?.scrollIntoView({block: 'nearest'});
}

// ---------- events ----------
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (S.menuOpen && !ev.target.closest('.newmenu')) closeMenu(); return; }
  const a = el.dataset.act; const d = el.dataset;
  switch (a) {
    case 'newmenu': S.menuOpen = !S.menuOpen; $('#newmenu').hidden = !S.menuOpen; el.setAttribute('aria-expanded', S.menuOpen); return;
    case 'newmenu-mob': { if ($('#mobmenu')) { closeMenu(); return; } const m = document.createElement('div'); m.className = 'menu mob'; m.id = 'mobmenu'; m.innerHTML = MENU; document.body.appendChild(m); S.menuOpen = true; return; }
    case 'goupload': closeMenu(); go('medias'); setTimeout(() => $('#file')?.click(), 80); return;
    case 'new': ev.preventDefault(); ev.stopPropagation(); closeMenu(); newDraft(d.type, {date: d.date ? d.date + 'T18:30' : '', status: d.status, mediaId: d.media}); return;
    case 'open': if (S.dragJustEnded) return; go('post-' + d.id); return;
    case 'media': go('media-' + d.id); return;
    case 'cmdk': openCmdk(); return;
    case 'cmdk-bg': if (ev.target === el) closeCmdk(); return;
    case 'cmdk-run': S.cmdk.items[Number(d.i)]?.run(); return;
    case 'cal-prev': case 'cal-next': { const k = a === 'cal-prev' ? -1 : 1; if (S.calMode === 'month') S.month = new Date(S.month.getFullYear(), S.month.getMonth() + k, 1); else S.weekStart = addDays(S.weekStart, 7 * k); render(); return; }
    case 'cal-today': S.month = som(new Date()); S.weekStart = sow(new Date()); render(); return;
    case 'cal-mode': S.calMode = d.mode; if (d.mode === 'week') { const n = new Date(); S.weekStart = sow(S.month.getMonth() === n.getMonth() && S.month.getFullYear() === n.getFullYear() ? n : S.month); } render(); return;
    case 'netf': S.netFilter = d.net; render(); return;
    case 'adf': S.adFilter = d.st; render(); return;
    case 'mff': S.mf.format = d.v; render(); return;
    case 'mfk': S.mf.kind = d.v; render(); return;
    case 'md-slide': { const m = mediaById(S.md.id); S.md.slide = (S.md.slide + Number(d.d) + m.items.length) % m.items.length; renderMediaDetail(); return; }
    case 'mfc': S.mf.cat = d.v; render(); return;
    case 'redo-open': S.redoOpen = d.kind + ':' + d.id; rerenderCur(); setTimeout(() => $('#redo-note')?.focus(), 0); return;
    case 'redo-cancel': S.redoOpen = null; rerenderCur(); return;
    case 'redo-save': case 'redo-clear': {
      const note = a === 'redo-save' ? ($('#redo-note')?.value || '').trim() : '';
      if (a === 'redo-save' && !note) { toast('Décrivez ce qu’il faut refaire.', true); return; }
      const val = a === 'redo-save' ? {note, at: Date.now(), by: S.me || null} : null;
      try {
        if (d.kind === 'media') await S.db.collection('media').doc(d.id).update({redo: val});
        else { if (S.ed?.draft.id === d.id) S.ed.draft.redo = val; if (!S.ed?.isNew) await S.db.collection('posts').doc(d.id).update({redo: val}); else markDirty(); }
        S.redoOpen = null; toast(val ? 'Marqué « à refaire ».' : 'Marqué comme corrigé.'); rerenderCur();
      } catch (er) { toast('Enregistrement impossible : ' + errMsg(er), true); }
      return;
    }
    case 'launch-shift': {
      const v = $('#launch-date')?.value; const cfg = S.launch; if (!v || !cfg) return;
      const delta = Math.round((new Date(v + 'T00:00') - new Date(cfg.start + 'T00:00')) / 864e5); if (!delta) { toast('Même date de lancement.'); return; }
      const list = S.posts.filter((p) => p.launch && p.date);
      try {
        for (const p of list) { const dt = new Date(p.date); dt.setDate(dt.getDate() + delta); await writePost({...p, date: ymd(dt) + p.date.slice(10)}); }
        await S.db.collection('config').doc('launch').update({start: v});
        toast(`Lancement décalé au ${new Date(v + 'T00:00').toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'})} · ${list.length} contenus déplacés.`);
      } catch (er) { toast('Décalage impossible : ' + errMsg(er), true); }
      return;
    }
    case 'md-go': S.md.slide = Number(d.i); renderMediaDetail(); return;
    case 'md-del': S.md.confirm = true; renderMediaDetail(); return;
    case 'md-del-no': S.md.confirm = false; renderMediaDetail(); return;
    case 'md-del-yes': {
      const m = mediaById(S.md.id); if (!m) return;
      try {
        for (const it of m.items || []) { await S.assets.delete(it.asset); if (it.poster) await S.assets.delete(it.poster); }
        for (const p of S.posts.filter((x) => x.mediaId === m.id)) await S.db.collection('posts').doc(p.id).update({mediaId: null});
        await S.db.collection('media').doc(m.id).delete();
        toast('Média supprimé.'); refreshUsage(); go('medias');
      } catch (er) { toast('Suppression impossible : ' + errMsg(er), true); }
      return;
    }
    case 'save': saveEditor(); return;
    case 'st': S.ed.draft.status = d.v; $$('[data-act="st"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === d.v)); markDirty(); return;
    case 'net': { const n = S.ed.draft.networks ||= []; const on = n.includes(d.v); S.ed.draft.networks = on ? n.filter((x) => x !== d.v) : [...n, d.v]; el.setAttribute('aria-pressed', !on); markDirty(); return; }
    case 'fmt': S.ed.draft.format = d.v; $$('[data-act="fmt"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === d.v)); S.ed.pv = null; markDirty(); refreshPicker(); renderPreview(); return;
    case 'pick': { const same = S.ed.draft.mediaId === d.id; S.ed.draft.mediaId = same ? null : d.id; S.ed.slide = 0; const m = mediaById(d.id);
      if (!same && m) { S.ed.draft.format = m.format; $$('[data-act="fmt"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === m.format)); S.ed.pv = null; if (!S.ed.draft.title.trim()) { S.ed.draft.title = m.title; $('#e-title').value = m.title; } }
      markDirty(); refreshPicker(); renderPreview(); return; }
    case 'when': { const n = Number(d.d); if (!n) S.ed.draft.date = ''; else { S.ed.draft.date = ymd(addDays(new Date(), n)) + 'T18:30'; if (S.ed.draft.type !== 'ad' && ['idea', 'make'].includes(S.ed.draft.status)) S.ed.draft.status = 'sched'; }
      $('#e-date').value = S.ed.draft.date; $$('[data-act="st"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.ed.draft.status)); markDirty(); return; }
    case 'copy': { const t = S.ed.draft.caption || ''; try { await navigator.clipboard.writeText(t); toast('Texte copié.'); } catch { const ta = $('#e-cap'); ta.focus(); ta.select(); toast('Texte sélectionné : copiez avec Ctrl/Cmd + C.'); } return; }
    case 'pv': S.ed.pv = d.v; renderPreview(); return;
    case 'pv-slide': S.ed.slide += Number(d.d); renderPreview(); return;
    case 'pv-sound': { S.ed.sound = !S.ed.sound; const v = $('#pv-video'); if (v) { v.muted = !S.ed.sound; if (S.ed.sound) { v.currentTime = 0; v.play().catch(() => {}); } } el.textContent = S.ed.sound ? '🔊 Son' : '🔇 Activer le son'; return; }
    case 'cap-more': S.ed.capOpen = true; renderPreview(); return;
    case 'dup': { const c = JSON.parse(JSON.stringify(S.ed.draft)); c.id = uid(); c.title = c.title + ' (copie)'; c.date = ''; c.status = c.type === 'ad' ? 'draft' : 'idea'; c.createdAt = Date.now();
      try { await writePost(c); toast('Copie créée.'); go('post-' + c.id); } catch (er) { toast('Duplication impossible : ' + errMsg(er), true); } return; }
    case 'del': S.ed.confirm = true; render(); return;
    case 'del-no': S.ed.confirm = false; render(); return;
    case 'del-yes': { const p = S.ed.draft; try { await S.db.collection('posts').doc(p.id).delete(); S.ed = null; toast('Supprimé.'); go(p.type === 'ad' ? 'ads' : 'posts'); } catch (er) { toast('Suppression impossible : ' + errMsg(er), true); } return; }
  }
});
document.addEventListener('input', (ev) => {
  if (!S.ed || S.view !== 'post') return; const t = ev.target;
  if (t.dataset.f) { S.ed.draft[t.dataset.f] = t.value; markDirty(); if (t.dataset.f === 'caption') { updCount(); updPreviewCaption(); } }
  if (t.dataset.af) { S.ed.draft.ad ||= {}; S.ed.draft.ad[t.dataset.af] = t.value; markDirty(); if (t.dataset.af === 'cta') renderPreview(); }
});
document.addEventListener('change', (ev) => { const t = ev.target; if (S.ed && S.view === 'post' && (t.dataset.f || t.dataset.af)) { if (t.dataset.f) S.ed.draft[t.dataset.f] = t.value; else { S.ed.draft.ad ||= {}; S.ed.draft.ad[t.dataset.af] = t.value; } markDirty(); renderPreview(); } });
document.addEventListener('keydown', (ev) => {
  const k = ev.key.toLowerCase();
  if ((ev.metaKey || ev.ctrlKey) && k === 'k') { ev.preventDefault(); S.cmdk ? closeCmdk() : openCmdk(); return; }
  if (S.cmdk) {
    if (k === 'escape') { closeCmdk(); return; }
    if (k === 'arrowdown' || k === 'arrowup') { ev.preventDefault(); S.cmdk.sel = Math.max(0, Math.min(S.cmdk.items.length - 1, S.cmdk.sel + (k === 'arrowdown' ? 1 : -1))); renderCmdk(); return; }
    if (k === 'enter') { ev.preventDefault(); S.cmdk.items[S.cmdk.sel]?.run(); return; }
    return;
  }
  if ((ev.metaKey || ev.ctrlKey) && k === 's' && S.view === 'post') { ev.preventDefault(); saveEditor(); }
  if (k === 'enter' && ev.target.matches('tr[data-act="open"]')) go('post-' + ev.target.dataset.id);
  if (k === 'escape' && S.menuOpen) closeMenu();
});

// drag & drop
document.addEventListener('dragstart', (ev) => { const el = ev.target.closest?.('[data-drag]'); if (!el) return; ev.dataTransfer.setData('text/plain', el.dataset.drag); ev.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); S.dragId = el.dataset.drag; });
document.addEventListener('dragend', (ev) => { ev.target.closest?.('[data-drag]')?.classList.remove('dragging'); S.dragId = null; S.dragJustEnded = true; setTimeout(() => (S.dragJustEnded = false), 80); $$('.over').forEach((x) => x.classList.remove('over')); });
document.addEventListener('dragover', (ev) => { const z = ev.target.closest?.('[data-drop-day],[data-drop-status]'); if (!z || !S.dragId) return; ev.preventDefault(); $$('.over').forEach((x) => x !== z && x.classList.remove('over')); z.classList.add('over'); });
document.addEventListener('drop', async (ev) => {
  const z = ev.target.closest?.('[data-drop-day],[data-drop-status]'); const id = S.dragId; S.dragId = null; if (!z || !id) return; ev.preventDefault(); z.classList.remove('over');
  const p = postById(id); if (!p) return; const upd = {...p};
  if ('dropStatus' in z.dataset) { if (p.status === z.dataset.dropStatus) return; upd.status = z.dataset.dropStatus; }
  else { const day = z.dataset.dropDay; if (!day) { if (!p.date) return; upd.date = ''; } else { const time = p.date ? p.date.slice(11, 16) : '18:30'; if (p.date && p.date.slice(0, 10) === day) return; upd.date = day + 'T' + time; if (upd.type !== 'ad' && ['idea', 'make'].includes(upd.status)) upd.status = 'sched'; } }
  try { await writePost(upd); toast(upd.date !== p.date ? (upd.date ? 'Programmé le ' + new Date(upd.date).toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'}) + '.' : 'Date retirée.') : 'Statut : ' + stOf(upd).l + '.'); }
  catch (er) { toast('Déplacement impossible : ' + errMsg(er), true); }
});
addEventListener('beforeunload', (e) => { if (S.ed?.dirty && !S.ed.isNew) e.preventDefault(); });

boot();
})();
</script>
